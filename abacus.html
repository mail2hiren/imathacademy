<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>iMathAcademy — Virtual Abacus</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Baloo+2:wght@800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#1A1A2E;font-family:'Nunito',sans-serif;color:#fff;overflow:hidden;}
.app{display:flex;flex-direction:column;height:100vh;max-width:680px;margin:0 auto;}

/* TOPBAR */
.topbar{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.logo{font-family:'Baloo 2',sans-serif;font-size:.95rem;font-weight:900;color:#fff;}
.logo span{color:#90CAF9;}
.value-wrap{display:flex;flex-direction:column;align-items:center;}
.value-label{font-size:.6rem;font-weight:800;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.5px;}
.value-num{font-family:'Baloo 2',sans-serif;font-size:1.5rem;font-weight:900;color:#FFD54F;letter-spacing:1px;min-width:80px;text-align:center;}
.icon-btns{display:flex;gap:6px;}
.icon-btn{width:32px;height:32px;border-radius:8px;border:none;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;}
.icon-btn.active{background:rgba(255,255,255,.25);}

/* ROD SELECTOR */
.rod-sel{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 14px;flex-shrink:0;}
.rod-sel-label{font-size:.68rem;font-weight:800;color:rgba(255,255,255,.4);}
.rod-btn{padding:4px 12px;border-radius:20px;border:1.5px solid rgba(255,255,255,.2);background:transparent;color:rgba(255,255,255,.5);font-family:inherit;font-size:.72rem;font-weight:800;cursor:pointer;transition:all .12s;}
.rod-btn.active{background:#1565C0;border-color:#1565C0;color:#fff;}

/* ABACUS FRAME */
.abacus-outer{flex:1;display:flex;flex-direction:column;padding:0 8px;overflow:hidden;}
.abacus-frame{flex:1;background:#4E342E;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;}
.frame-top{height:10px;background:#3E2723;border-radius:14px 14px 0 0;flex-shrink:0;}
.frame-bot{height:10px;background:#3E2723;border-radius:0 0 14px 14px;flex-shrink:0;}
.rods-wrap{flex:1;display:flex;align-items:stretch;padding:0 6px;background:#3E2723;gap:2px;overflow:hidden;}

/* SINGLE ROD */
.rod{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;cursor:pointer;min-width:0;}
.rod-line{position:absolute;top:0;bottom:0;width:3px;border-radius:2px;left:50%;transform:translateX(-50%);z-index:0;opacity:.5;}

/* HEAVEN ZONE */
.heaven-zone{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:3px;position:relative;z-index:1;flex-shrink:0;}

/* DIVIDER */
.rod-divider{height:6px;width:100%;background:#5D4037;flex-shrink:0;position:relative;z-index:2;}
.rod-divider::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:6px;height:6px;background:#3E2723;border-radius:50%;}

/* EARTH ZONE */
.earth-zone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:3px;position:relative;z-index:1;gap:2px;}

/* BEAD */
.bead{border-radius:50%;position:relative;z-index:3;flex-shrink:0;transition:transform .18s cubic-bezier(.34,1.4,.64,1);cursor:pointer;width:calc(100% - 4px);max-width:30px;}
.bead::after{content:'';position:absolute;top:15%;left:20%;width:35%;height:25%;border-radius:50%;background:rgba(255,255,255,.4);}
.bead:active{transform:scale(.9);}

/* BEAD STATES */
.bead.inactive{opacity:.45;}
.bead.active{opacity:1;box-shadow:0 2px 10px rgba(0,0,0,.4);}

/* GHOST SLOT */
.ghost{border-radius:50%;flex-shrink:0;border:1.5px dashed rgba(255,255,255,.15);width:calc(100% - 4px);max-width:30px;}

/* CONTROLS */
.controls{display:flex;gap:8px;padding:8px 14px;flex-shrink:0;}
.ctrl-btn{flex:1;padding:10px 6px;border-radius:10px;border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff;font-family:inherit;font-size:.75rem;font-weight:800;cursor:pointer;transition:all .12s;text-align:center;}
.ctrl-btn:hover{background:rgba(255,255,255,.15);}
.ctrl-btn.primary{background:#1565C0;border-color:#1565C0;}

/* QUESTION CARD */
.q-card{margin:0 14px 6px;border-radius:12px;padding:10px 14px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.12);flex-shrink:0;display:none;}
.q-card.show{display:block;}
.q-label{font-size:.62rem;font-weight:900;text-transform:uppercase;letter-spacing:.4px;color:rgba(255,255,255,.5);margin-bottom:3px;}
.q-num{font-family:'Baloo 2',sans-serif;font-size:1.3rem;font-weight:900;color:#FFD54F;}
.q-feedback{font-size:.78rem;font-weight:800;margin-top:6px;padding:5px 10px;border-radius:8px;display:none;}
.q-feedback.correct{background:rgba(46,125,50,.3);color:#81C784;display:block;}
.q-feedback.wrong{background:rgba(198,40,40,.3);color:#EF9A9A;display:block;}

/* CELEBRATION */
.celeb{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100;}
.celeb.show{display:flex;}
.celeb-card{background:#1A1A2E;border:2px solid #FFD54F;border-radius:20px;padding:28px 24px;text-align:center;max-width:280px;width:90%;}
.celeb-icon{font-size:3rem;margin-bottom:8px;}
.celeb-title{font-family:'Baloo 2',sans-serif;font-size:1.4rem;font-weight:900;color:#FFD54F;margin-bottom:6px;}
.celeb-sub{font-size:.82rem;color:rgba(255,255,255,.7);margin-bottom:16px;}
.celeb-btn{width:100%;padding:12px;background:#1565C0;color:#fff;border:none;border-radius:12px;font-family:inherit;font-size:.9rem;font-weight:900;cursor:pointer;}

@media(max-width:380px){
  .bead,.ghost{max-width:22px;}
  .value-num{font-size:1.2rem;}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo">🧮 iMath<span>Academy</span></div>
    <div class="value-wrap">
      <div class="value-label">Value</div>
      <div class="value-num" id="valDisp">0</div>
    </div>
    <div class="icon-btns">
      <button class="icon-btn" id="soundBtn" onclick="toggleSound()" title="Sound">🔊</button>
      <button class="icon-btn" id="clearBtn" onclick="clearAll()" title="Clear">↺</button>
    </div>
  </div>

  <div class="rod-sel">
    <span class="rod-sel-label">Rods:</span>
    <button class="rod-btn active" onclick="setRods(7,this)">7</button>
    <button class="rod-btn" onclick="setRods(9,this)">9</button>
    <button class="rod-btn" onclick="setRods(13,this)">13</button>
    <button class="rod-btn" onclick="setRods(17,this)">17</button>
  </div>

  <!-- Mode buttons -->
  <div style="display:flex;gap:6px;padding:0 14px 6px;flex-shrink:0;">
    <button class="ctrl-btn primary" onclick="setMode('free',this)" id="modeBtn0">🎯 Free play</button>
    <button class="ctrl-btn" onclick="setMode('practice',this)" id="modeBtn1">📝 Practice</button>
    <button class="ctrl-btn" onclick="setMode('challenge',this)" id="modeBtn2">⚡ Challenge</button>
  </div>

  <!-- Question card -->
  <div class="q-card" id="qCard">
    <div class="q-label" id="qLabel">Set this number on the abacus</div>
    <div class="q-num" id="qNum">—</div>
    <div class="q-feedback" id="qFeedback"></div>
  </div>

  <!-- THE ABACUS -->
  <div class="abacus-outer">
    <div class="abacus-frame">
      <div class="frame-top"></div>
      <div class="rods-wrap" id="rodsWrap"></div>
      <div class="frame-bot"></div>
    </div>
  </div>

  <!-- Bottom controls -->
  <div class="controls" id="bottomControls" style="padding-bottom:max(8px,env(safe-area-inset-bottom));">
    <button class="ctrl-btn" onclick="randomNumber()" id="randBtn">🎲 Random</button>
    <button class="ctrl-btn primary" onclick="checkAnswer()" id="checkBtn" style="display:none">✓ Check</button>
    <button class="ctrl-btn" onclick="nextQuestion()" id="nextBtn" style="display:none">Next →</button>
  </div>
</div>

<div class="celeb" id="celeb">
  <div class="celeb-card">
    <div class="celeb-icon">🎉</div>
    <div class="celeb-title">Correct!</div>
    <div class="celeb-sub" id="celebSub">Well done!</div>
    <button class="celeb-btn" onclick="nextQuestion()">Next question →</button>
  </div>
</div>

<script>
// ── COLOURS PER ROD (right to left = ones to highest) ────────
var ROD_COLORS = [
  {rod:'#F44336',bead:'linear-gradient(145deg,#FF8A80,#F44336 55%,#B71C1C)',glow:'#F44336'},
  {rod:'#FF7F00',bead:'linear-gradient(145deg,#FFD180,#FF7F00 55%,#E65100)',glow:'#FF7F00'},
  {rod:'#FFC107',bead:'linear-gradient(145deg,#FFFF8D,#FFC107 55%,#FF6F00)',glow:'#FFC107'},
  {rod:'#4CAF50',bead:'linear-gradient(145deg,#B9F6CA,#4CAF50 55%,#1B5E20)',glow:'#4CAF50'},
  {rod:'#2196F3',bead:'linear-gradient(145deg,#82B1FF,#2196F3 55%,#0D47A1)',glow:'#2196F3'},
  {rod:'#9C27B0',bead:'linear-gradient(145deg,#EA80FC,#9C27B0 55%,#4A148C)',glow:'#9C27B0'},
  {rod:'#F44336',bead:'linear-gradient(145deg,#FF8A80,#F44336 55%,#B71C1C)',glow:'#F44336'},
  {rod:'#FF7F00',bead:'linear-gradient(145deg,#FFD180,#FF7F00 55%,#E65100)',glow:'#FF7F00'},
  {rod:'#FFC107',bead:'linear-gradient(145deg,#FFFF8D,#FFC107 55%,#FF6F00)',glow:'#FFC107'},
  {rod:'#4CAF50',bead:'linear-gradient(145deg,#B9F6CA,#4CAF50 55%,#1B5E20)',glow:'#4CAF50'},
  {rod:'#2196F3',bead:'linear-gradient(145deg,#82B1FF,#2196F3 55%,#0D47A1)',glow:'#2196F3'},
  {rod:'#9C27B0',bead:'linear-gradient(145deg,#EA80FC,#9C27B0 55%,#4A148C)',glow:'#9C27B0'},
  {rod:'#F44336',bead:'linear-gradient(145deg,#FF8A80,#F44336 55%,#B71C1C)',glow:'#F44336'},
  {rod:'#FF7F00',bead:'linear-gradient(145deg,#FFD180,#FF7F00 55%,#E65100)',glow:'#FF7F00'},
  {rod:'#FFC107',bead:'linear-gradient(145deg,#FFFF8D,#FFC107 55%,#FF6F00)',glow:'#FFC107'},
  {rod:'#4CAF50',bead:'linear-gradient(145deg,#B9F6CA,#4CAF50 55%,#1B5E20)',glow:'#4CAF50'},
  {rod:'#2196F3',bead:'linear-gradient(145deg,#82B1FF,#2196F3 55%,#0D47A1)',glow:'#2196F3'},
];

var NUM_RODS = 7;
var state = []; // index 0 = rightmost (ones)
var mode = 'free';
var soundOn = true;
var target = null;
var score = {c:0,t:0};
var chalTimer = null, chalTime = 0;
var audioCtx = null;

function audio() {
  if (!audioCtx) try { audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){}
  return audioCtx;
}
function click(high) {
  if (!soundOn) return;
  var ctx = audio(); if (!ctx) return;
  var o = ctx.createOscillator(), g = ctx.createGain();
  o.connect(g); g.connect(ctx.destination);
  o.frequency.value = high ? 1100 : 700;
  g.gain.setValueAtTime(.1, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+.06);
  o.start(); o.stop(ctx.currentTime+.06);
}
function playSuccess() {
  if (!soundOn) return;
  var ctx = audio(); if (!ctx) return;
  [523,659,784,1047].forEach(function(f,i){
    var o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.frequency.value=f;
    var t=ctx.currentTime+i*.08;
    g.gain.setValueAtTime(.1,t);
    g.gain.exponentialRampToValueAtTime(.001,t+.12);
    o.start(t);o.stop(t+.12);
  });
}

function initState() {
  state = [];
  for (var i=0;i<NUM_RODS;i++) state.push({h:0,e:0});
}

function getValue() {
  var total = 0;
  state.forEach(function(r,i){
    total += (r.h*5 + r.e) * Math.pow(10, NUM_RODS-1-i);
  });
  return total;
}

function setRods(n, btn) {
  NUM_RODS = n;
  document.querySelectorAll('.rod-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  initState();
  buildDOM();
  updateDisplay();
}

// ── DOM BUILD ─────────────────────────────────────────────────
function buildDOM() {
  var wrap = document.getElementById('rodsWrap');
  wrap.innerHTML = '';

  // Compute bead size based on available height
  var frameH = wrap.offsetHeight || 260;
  var beadH = Math.min(Math.floor((frameH - 30) / 7.5), 28);
  var beadW = beadH; // square aspect ratio makes circles; we'll do slightly wider
  var gap = Math.max(2, Math.floor(beadH * .08));

  // Left to right visually = highest rod to lowest
  // state[0] = ones = rightmost
  for (var vi=0; vi<NUM_RODS; vi++) {
    var di = NUM_RODS - 1 - vi; // data index (0=ones at right)
    var col = ROD_COLORS[vi % ROD_COLORS.length];

    var rodEl = document.createElement('div');
    rodEl.className = 'rod';

    // Rod line
    var line = document.createElement('div');
    line.className = 'rod-line';
    line.style.background = col.rod;
    rodEl.appendChild(line);

    // ── HEAVEN ZONE ──────────────────────────────────────────
    var hz = document.createElement('div');
    hz.className = 'heaven-zone';
    hz.style.height = (beadH * 2 + gap + 6) + 'px';

    // Ghost slot (top = bead resting position)
    var hGhost = document.createElement('div');
    hGhost.className = 'ghost';
    hGhost.style.height = beadH + 'px';
    hGhost.style.marginBottom = gap + 'px';

    // Heaven bead
    var hBead = document.createElement('div');
    hBead.className = 'bead ' + (state[di].h ? 'active' : 'inactive');
    hBead.style.height = beadH + 'px';
    hBead.style.background = col.bead;
    if (state[di].h) hBead.style.boxShadow = '0 2px 10px ' + col.glow + '80';
    hBead.dataset.di = di;
    hBead.dataset.type = 'h';
    hBead.addEventListener('click', function(e) {
      e.stopPropagation();
      tapHeaven(parseInt(this.dataset.di));
    });
    hBead.addEventListener('touchend', function(e) {
      e.preventDefault();
      tapHeaven(parseInt(this.dataset.di));
    });

    if (state[di].h) {
      hz.appendChild(hGhost);
      hz.appendChild(hBead);
    } else {
      hz.appendChild(hBead);
      hz.appendChild(hGhost);
    }

    rodEl.appendChild(hz);

    // ── DIVIDER ──────────────────────────────────────────────
    var div = document.createElement('div');
    div.className = 'rod-divider';
    rodEl.appendChild(div);

    // ── EARTH ZONE ───────────────────────────────────────────
    var ez = document.createElement('div');
    ez.className = 'earth-zone';

    for (var ei=0; ei<4; ei++) {
      var isActive = ei < state[di].e;

      if (isActive) {
        var eBead = document.createElement('div');
        eBead.className = 'bead active';
        eBead.style.height = beadH + 'px';
        eBead.style.background = col.bead;
        eBead.style.boxShadow = '0 2px 10px ' + col.glow + '80';
        eBead.dataset.di = di;
        eBead.dataset.ei = ei;
        eBead.dataset.type = 'e';
        eBead.addEventListener('click', (function(d,e_){ return function(ev){
          ev.stopPropagation(); tapEarth(d,e_);
        };})(di, ei));
        eBead.addEventListener('touchend', (function(d,e_){ return function(ev){
          ev.preventDefault(); tapEarth(d,e_);
        };})(di, ei));
        ez.appendChild(eBead);
      } else {
        var eGhost = document.createElement('div');
        eGhost.className = 'ghost';
        eGhost.style.height = beadH + 'px';
        eGhost.dataset.di = di;
        eGhost.dataset.ei = ei;
        eGhost.addEventListener('click', (function(d,e_){ return function(ev){
          ev.stopPropagation(); tapEarth(d,e_);
        };})(di, ei));
        eGhost.addEventListener('touchend', (function(d,e_){ return function(ev){
          ev.preventDefault(); tapEarth(d,e_);
        };})(di, ei));
        ez.appendChild(eGhost);
      }
    }

    rodEl.appendChild(ez);
    wrap.appendChild(rodEl);
  }
}

// ── INTERACTIONS ─────────────────────────────────────────────
function tapHeaven(di) {
  state[di].h = state[di].h ? 0 : 1;
  click(true);
  buildDOM();
  updateDisplay();
}

function tapEarth(di, ei) {
  // If tapping an active bead — deactivate it and all above it
  // If tapping a ghost/inactive — activate it and all below
  if (ei < state[di].e) {
    state[di].e = ei; // deactivate from ei upward
  } else {
    state[di].e = ei + 1; // activate from 0 to ei inclusive
  }
  click(false);
  buildDOM();
  updateDisplay();
}

function updateDisplay() {
  var v = getValue();
  var el = document.getElementById('valDisp');
  el.textContent = v === 0 ? '0' : v.toLocaleString('en-IN');
  el.style.color = v === 0 ? 'rgba(255,255,255,.3)' : '#FFD54F';
}

// ── MODES ─────────────────────────────────────────────────────
function setMode(m, btn) {
  mode = m;
  document.querySelectorAll('[id^="modeBtn"]').forEach(function(b){b.classList.remove('primary');});
  btn.classList.add('primary');

  var qCard = document.getElementById('qCard');
  var checkBtn = document.getElementById('checkBtn');
  var nextBtn = document.getElementById('nextBtn');
  var randBtn = document.getElementById('randBtn');

  if (m === 'free') {
    qCard.classList.remove('show');
    checkBtn.style.display = 'none';
    nextBtn.style.display = 'none';
    randBtn.style.display = '';
    if (chalTimer) { clearInterval(chalTimer); chalTimer = null; }
  } else {
    qCard.classList.add('show');
    checkBtn.style.display = '';
    nextBtn.style.display = 'none';
    randBtn.style.display = 'none';
    score = {c:0,t:0};
    nextQuestion();
  }
  clearAll(true);
}

var practiceList = [3,5,7,8,9,12,23,45,67,89,99,123,456,789,999,1234,5678,9999,12345];
var practiceIdx = 0;

function nextQuestion() {
  document.getElementById('celeb').classList.remove('show');
  document.getElementById('qFeedback').className = 'q-feedback';
  document.getElementById('checkBtn').style.display = '';
  document.getElementById('nextBtn').style.display = 'none';

  var maxVal = Math.pow(10, NUM_RODS) - 1;

  if (mode === 'practice') {
    var filtered = practiceList.filter(function(n){return n<=maxVal;});
    target = filtered[practiceIdx % filtered.length];
    practiceIdx++;
    document.getElementById('qLabel').textContent = 'Set this number on the abacus';
  } else {
    target = Math.floor(Math.random() * Math.min(maxVal, 9999)) + 1;
    chalTime = 0;
    if (chalTimer) clearInterval(chalTimer);
    chalTimer = setInterval(function(){
      chalTime++;
      document.getElementById('qLabel').textContent = '⚡ Time: ' + chalTime + 's';
    }, 1000);
    document.getElementById('qLabel').textContent = '⚡ Time: 0s';
  }

  document.getElementById('qNum').textContent = (target||0).toLocaleString('en-IN');
  clearAll(true);
}

function checkAnswer() {
  var v = getValue();
  var fb = document.getElementById('qFeedback');

  if (v === target) {
    if (chalTimer) { clearInterval(chalTimer); chalTimer = null; }
    score.c++; score.t++;
    playSuccess();
    document.getElementById('celebSub').textContent =
      (target||0).toLocaleString('en-IN') + ' — correct! ' +
      (mode === 'challenge' ? 'Time: ' + chalTime + 's. ' : '') +
      'Score: ' + score.c + '/' + score.t;
    document.getElementById('celeb').classList.add('show');
    document.getElementById('checkBtn').style.display = 'none';
    document.getElementById('nextBtn').style.display = '';
  } else {
    score.t++;
    fb.textContent = '✗ You set ' + v.toLocaleString('en-IN') +
      ' — the answer is ' + (target||0).toLocaleString('en-IN') + '. Try again!';
    fb.className = 'q-feedback wrong';
  }
}

function clearAll(silent) {
  initState();
  buildDOM();
  updateDisplay();
  if (!silent) {
    document.getElementById('qFeedback').className = 'q-feedback';
  }
}

function randomNumber() {
  var max = Math.pow(10, NUM_RODS) - 1;
  var n = Math.floor(Math.random() * max) + 1;
  setNumber(n);
}

function setNumber(n) {
  initState();
  var rem = Math.floor(n);
  for (var i=NUM_RODS-1; i>=0; i--) {
    var di = NUM_RODS - 1 - i; // data index
    var place = Math.pow(10, i);
    var digit = Math.floor(rem / place);
    rem -= digit * place;
    state[di].h = digit >= 5 ? 1 : 0;
    state[di].e = digit >= 5 ? digit - 5 : digit;
  }
  buildDOM();
  updateDisplay();
}

function toggleSound() {
  soundOn = !soundOn;
  var btn = document.getElementById('soundBtn');
  btn.textContent = soundOn ? '🔊' : '🔇';
  btn.classList.toggle('active', !soundOn);
  audio(); // init on gesture
}

// ── INIT ─────────────────────────────────────────────────────
initState();
// Wait for layout before building (need offsetHeight)
requestAnimationFrame(function(){
  buildDOM();
  updateDisplay();
  // Rebuild on resize
  var resizeTimer;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){ buildDOM(); }, 80);
  });
});
</script>
</body>
</html>
