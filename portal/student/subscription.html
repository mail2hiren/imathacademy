  <meta charset="UTF-8">

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito', sans-serif; background: #F7F8FF; color: #1A1A2E; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    :root {
      --green: #43A047; --green-dk: #1B5E20; --green-lt: #E8F5E9;
      --blue: #1E88E5; --blue-dk: #0D47A1; --blue-lt: #E3F2FD;
      --red: #E53935; --red-lt: #FFEBEE; --red-dk: #B71C1C;
      --orange: #FB8C00; --orange-lt: #FFF3E0; --orange-dk: #E65100;
      --border: #E8EAF6; --bg: #fff; --bg2: #F7F8FF;
      --text: #1A1A2E; --text2: #4A4A6A; --text3: #9090B0;
    }
    .card { background: var(--bg); border-radius: 24px; box-shadow: 0 8px 40px rgba(0,0,0,.12); width: 100%; max-width: 460px; overflow: hidden; }

    /* Header */
    .header { background: linear-gradient(135deg, #1565C0, #1976D2); padding: 28px 28px 24px; color: #fff; }
    .logo { font-family: 'Baloo 2', sans-serif; font-size: 1.2rem; font-weight: 800; margin-bottom: 16px; opacity: .9; }
    .student-info { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .student-av { width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,.2); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: 800; border: 2px solid rgba(255,255,255,.4); }
    .student-name { font-size: 1.1rem; font-weight: 800; }
    .student-level { font-size: .8rem; opacity: .8; margin-top: 2px; }
    .status-bar { background: rgba(255,255,255,.15); border-radius: 10px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
    .status-label { font-size: .75rem; opacity: .8; margin-bottom: 2px; }
    .status-val { font-size: .9rem; font-weight: 800; }
    .status-expired { color: #FFD600; }
    .status-active  { color: #A5D6A7; }

    /* Body */
    .body { padding: 24px 28px; }

    /* Plan cards */
    .plans-label { font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; color: var(--text3); margin-bottom: 12px; }
    .plan-card { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 2px solid var(--border); border-radius: 14px; cursor: pointer; margin-bottom: 10px; transition: all .15s; position: relative; overflow: hidden; }

    .plan-amount { font-size: 1.2rem; font-weight: 800; }
    .plan-per { font-size: .72rem; color: var(--text3); }
    .save-badge { position: absolute; top: 0; right: 0; background: var(--green); color: #fff; font-size: .65rem; font-weight: 800; padding: 3px 10px; border-radius: 0 14px 0 10px; }

    .features-title { font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; color: var(--text3); margin-bottom: 10px; }
    .features-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .feature-item { font-size: .8rem; color: var(--text2); display: flex; align-items: center; gap: 6px; font-weight: 600; }
    .feature-item span { color: var(--green); font-weight: 800; }

    /* Pay button */
    .pay-btn { width: 100%; padding: 16px; background: var(--blue); color: #fff; border: none; border-radius: 14px; font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 800; cursor: pointer; transition: all .15s; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px; }
    .pay-btn:hover { background: var(--blue-dk); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(30,136,229,.35); }
    .pay-btn:disabled { opacity: .6; cursor: not-allowed; transform: none; box-shadow: none; }

    /* Payment methods */
    .methods { text-align: center; margin-bottom: 12px; }
    .methods-label { font-size: .72rem; color: var(--text3); margin-bottom: 8px; }
    .methods-row { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
    .method-pill { background: var(--bg2); border: 1.5px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: .72rem; font-weight: 700; color: var(--text2); }
    .secure { text-align: center; font-size: .72rem; color: var(--text3); }

    /* Blocked overlay */
    .blocked-banner { background: var(--red-lt); border: 2px solid var(--red); border-radius: 14px; padding: 16px; margin-bottom: 18px; text-align: center; }
    .blocked-icon { font-size: 2.5rem; margin-bottom: 8px; }
    .blocked-title { font-family: 'Baloo 2', sans-serif; font-size: 1.1rem; font-weight: 800; color: var(--red-dk); margin-bottom: 4px; }

    .safe-box { background: var(--orange-lt); border: 1.5px solid var(--orange); border-radius: 10px; padding: 10px 14px; margin: 12px 0; text-align: left; }
    .safe-title { font-size: .78rem; font-weight: 800; color: var(--orange-dk); margin-bottom: 6px; }
    .safe-item { font-size: .78rem; color: var(--orange-dk); display: flex; gap: 6px; margin-bottom: 3px; }

    /* Success */
    .success-wrap { padding: 28px; text-align: center; }
    .success-icon { font-size: 4rem; margin-bottom: 12px; }
    .success-title { font-family: 'Baloo 2', sans-serif; font-size: 1.3rem; font-weight: 800; margin-bottom: 6px; }
    .success-sub { font-size: .875rem; color: var(--text2); margin-bottom: 18px; line-height: 1.6; }
    .receipt { background: var(--bg2); border-radius: 12px; padding: 14px 16px; margin-bottom: 18px; text-align: left; }
    .receipt-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--border); font-size: .82rem; }
    .receipt-row:last-child { border-bottom: none; }
    .receipt-label { color: var(--text2); }
    .receipt-val { font-weight: 800; }
    .dashboard-btn { display: block; width: 100%; padding: 14px; background: var(--blue); color: #fff; border: none; border-radius: 12px; font-family: 'Nunito', sans-serif; font-size: .95rem; font-weight: 800; cursor: pointer; text-decoration: none; text-align: center; }

    /* Toast */
    .toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 12px; font-size: .875rem; font-weight: 700; color: #fff; z-index: 9999; animation: slideIn .3s ease; display: none; }
    .toast.success { background: var(--green-dk); }
    .toast.error   { background: var(--red-dk); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  </style>

function isExpired(sub) {
  if (!sub) return true;
  if (sub.status === 'expired') return true;
  return new Date(sub.expires_at) < new Date();
}

function fmt(date) {
  return new Date(date).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
}

function addDays(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);

}

async function startPayment() {
  const plan = selectedPlan;
  const p = PLANS[plan];
  const btn = document.getElementById('payBtn');
  btn.disabled = true;
  btn.textContent = 'Opening payment...';

  try {
        /* An order has to exist before checkout opens. Without one the
       payment arrives "authorized" and waits for somebody to capture
       it by hand — which is why payments were not switching on access.
       The order is created with payment_capture: 1, so the money is
       taken at once and the webhook writes the subscription within
       seconds. */
    const orderRes = await fetch(SUPABASE_URL + '/functions/v1/create-order', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + session.access_token,
        'apikey': SUPABASE_KEY
      },
      body: JSON.stringify({ plan_code: p.code || plan, student_id: session.user.id })
    });
    const ord = await orderRes.json();
    if (!orderRes.ok || !ord.order_id) {
      throw new Error(ord.error || 'Could not start the payment');
    }

    const options = {
      /* The order is what makes this an auto-captured payment. Without
         it Razorpay only authorises the money and waits for a manual
         capture, which is why paying did not switch on access. */
      order_id: ord.order_id,
      key:      ord.key_id || RAZORPAY_KEY,
      amount:   ord.amount,     // from the pricing table, not the browser
      currency: ord.currency,
      name: 'iMathAcademy',
      description: `${p.label} subscription for ${profile?.full_name || 'Student'}`,
      image: '/assets/logo.png',
      // ── CRITICAL: student_id and plan passed to webhook via notes ──
      notes: {
        student_id: session.user.id,
        plan:       plan,
        student_name: profile?.full_name || '',
      },
      prefill: {
        name:    profile?.full_name || '',
        email:   session.user.email || '',
        contact: profile?.phone || '',
      },
      theme: { color: '#1565C0' },
      /* No callback_url. Setting one puts Razorpay into redirect mode:
         it POSTs the result to that page, GitHub Pages only answers GET,
         and the parent lands on a 405. It also skips the handler below,
         so nothing gets recorded.

         Without it, checkout stays in the page and calls handler()
         directly, which is what switches access on. */
      cancel_url:   'https://imathacademy.net/payment-failed.html',
      handler: async function(response) {
        /* The webhook is what really records this, and it usually
           lands within a second or two. Wait for it, then show
           success — so a family sees access switched on rather than
           being told to refresh.

           If it has not arrived after a few seconds, the browser
           writes the row itself as a backup. */
        for (var w = 0; w < 6; w++) {
          await new Promise(function (r) { setTimeout(r, 900); });
          try {
            var chk = await sb.from('subscriptions')
              .select('id').eq('student_id', session.user.id)
              .eq('status', 'active').gt('expires_at', new Date().toISOString())
              .limit(1);
            if (chk.data && chk.data.length) {
              renderSuccess(plan, response.razorpay_payment_id);
              return;
            }
          } catch (e) { /* keep waiting */ }
        }
        await handlePaymentSuccess(plan, response.razorpay_payment_id, response.razorpay_order_id);
      },
      modal: {
        ondismiss: function() {
          btn.disabled = false;
          btn.textContent = 'Pay ' + Money.format(p.amount, myCountry) + ' securely · via Razorpay';
        }
      }
    };

    const rzp = new Razorpay(options);
    rzp.open();

  } catch(err) {
    toast('❌ Payment failed: ' + err.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Pay ' + Money.format(p.amount, myCountry) + ' securely · via Razorpay';
  }
}

async function handlePaymentSuccess(plan, paymentId, orderId) {
  try {
    const p = PLANS[plan];
    const now = new Date().toISOString();
    const expiresAt = addDays(p.days);

    // Mark old subscription expired
    if (subscription?.id) {
      await sb.from('subscriptions').update({ status: 'expired' }).eq('id', subscription.id);
    }

    // Create new subscription record
    /* created_by was the string 'parent' going into a uuid column, so
       Postgres rejected the whole row. The money left the parent's
       account and nothing was written — no subscription, no access,
       and a screenshot sent to Megha.

       The payer is the signed-in user, and .select() is here so a
       refused write cannot look like a success. */
    const { data, error } = await sb.from('subscriptions').insert({
      student_id:          session.user.id,
      plan,
      amount:              p.amount,
      currency:            (typeof Money !== 'undefined') ? Money.currencyCode(myCountry) : 'INR',
      status:              'active',
      payment_method:      'razorpay',
      razorpay_payment_id: paymentId,
      razorpay_order_id:   orderId || null,
      starts_at:           now,
      expires_at:          expiresAt,
      created_by:          session.user.id,
    }).select();

    if (error) throw error;
    if (!data || !data.length) throw new Error('The subscription was not saved');

    renderSuccess(plan, paymentId);

  } catch(err) {
    /* A parent who has just paid must never be left with an error and
       nothing else. The payment id is theirs — it is what lets Megha
       find the money and put the access right. */
    console.error('Subscription not saved after payment:', err);

    try {
      await sb.from('enquiries').insert({
        child_name:  (profile && profile.full_name) || 'Unknown',
        parent_name: 'PAYMENT NEEDS CHECKING',
        phone:       (profile && profile.phone) || '',
        status:      'new',
        notes:       'Paid on Razorpay but the subscription did not save. ' +
                     'Payment id ' + paymentId + '. Plan ' + plan + '. ' +
                     'Error: ' + (err.message || 'unknown')
      });
    } catch (e2) { /* even this failing must not hide the message below */ }

    document.getElementById('mainCard').innerHTML =
      '<div style="padding:30px 22px;text-align:center;">' +
        '<div style="font-size:2.6rem;">\u2705</div>' +
        '<div style="font-size:1.2rem;font-weight:900;margin-top:10px;">' +
          'Your payment went through</div>' +
        '<div style="font-size:.95rem;color:#555;margin-top:10px;line-height:1.65;">' +
          'It has not switched on your access yet — that needs a moment from us. ' +
          'Your teacher has been told and will sort it today.</div>' +
        '<div style="background:#F7F9FF;border-radius:12px;padding:13px;margin-top:16px;' +
          'font-size:.85rem;">Payment reference<br>' +
          '<strong style="font-family:ui-monospace,monospace;">' + paymentId + '</strong></div>' +
        '<div style="font-size:.8rem;color:#8892A4;margin-top:12px;">' +
          'Keep this reference. Nothing has been lost.</div>' +
      '</div>';
  }
}

async function init() {
  document.getElementById('mainCard').innerHTML = `
    <div style="padding:40px;text-align:center;color:#9090B0">
      <div style="width:40px;height:40px;border:4px solid #E8EAF6;border-top-color:#1E88E5;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px"></div>
      Loading...
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  `;

  try {
    const { data: { session: s } } = await sb.auth.getSession();
    if (!s) { window.location.href = '/login.html'; return; }
    session = s;

    const { data: p } = await sb.from('users').select('*, country_code').eq('id', s.user.id).single();
  myCountry = (p && p.country_code) || 'IN';

  /* The plan prices were written into this page, so a family abroad
     saw rupees. Megha sets the real prices per country in the admin
     screen; those are what should be shown and charged. */
  try {
    const pr = await sb.from('pricing_plans')
      .select('plan_code, plan_name, amount, duration_days, is_active')
      .eq('country_code', myCountry).order('duration_days');
    const live = (pr.data || []).filter(x => x.is_active !== false);

    if (live.length) {
      live.forEach(row => {
        const months = Math.round((row.duration_days || 30) / 30);
        const key = months >= 12 ? 'annual' : months >= 6 ? 'halfyearly'
                  : months >= 3 ? 'quarterly' : 'monthly';
        if (!PLANS[key]) {
          PLANS[key] = { label: row.plan_name || key, days: row.duration_days,
                         desc: 'Access for ' + months + ' months' };
        }
        PLANS[key].amount = Number(row.amount);
        PLANS[key].code = row.plan_code;
      });
    } else if (myCountry !== 'IN') {
      /* Nothing priced for that country. Saying so is better than
         quietly charging a family in the wrong currency. */
      const warn = document.createElement('div');
      warn.style.cssText = 'background:#FFF4E5;border-radius:12px;padding:12px 14px;' +
        'margin:14px 0;font-size:.85rem;color:#8a4b00;line-height:1.55;';
      warn.textContent = 'Prices for your country are not set up yet — ' +
        'please message your teacher to arrange payment.';
      const first = document.querySelector('.plan-amount');
      if (first && first.closest('.plan-card') && first.closest('.plan-card').parentNode) {
        first.closest('.plan-card').parentNode.insertBefore(warn, first.closest('.plan-card'));
      }
    }

    // and put the real figures on the cards
    document.querySelectorAll('.plan-amount').forEach((el, i) => {
      const key = Object.keys(PLANS)[i];
      if (key && PLANS[key]) el.textContent = Money.format(PLANS[key].amount, myCountry);
    });
    const per = document.querySelector('.plan-per');
    if (per && PLANS.halfyearly) {
      per.textContent = Money.format(
        Math.round(PLANS.halfyearly.amount / (PLANS.halfyearly.days / 30)), myCountry) + '/month';
    }
    const badge = document.querySelector('.save-badge');
    if (badge && PLANS.halfyearly && PLANS.monthly) {
      const saved = (PLANS.monthly.amount * (PLANS.halfyearly.days / 30)) - PLANS.halfyearly.amount;
      badge.textContent = saved > 0 ? 'SAVE ' + Money.format(saved, myCountry) : '';
      badge.style.display = saved > 0 ? '' : 'none';
    }
  } catch (e) { console.warn('Could not load pricing:', e.message); }
    profile = p;

    // Get latest subscription
    const { data: subs } = await sb.from('subscriptions')
      .select('*')
      .eq('student_id', s.user.id)
      .eq('status', 'active')
      .order('expires_at', { ascending: false })
      .limit(1);

    subscription = subs?.[0] || null;
    const expired = isExpired(subscription);

    renderPayScreen(expired);

  } catch(err) {
    document.getElementById('mainCard').innerHTML = `<div style="padding:40px;text-align:center;color:#E53935">Error loading subscription: ${err.message}</div>`;
  }
}

init();
</script>
  <script src="../js/student-nav.js"></script>
</body>
</html>
