<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vedic Maths &mdash; the whole course on one page</title>

<style>

        display:flex; align-items:center; gap:12px; flex-wrap:wrap; }

  .top h1{ font-size:1.02rem; font-weight:900; }
  .top p{ font-size:.76rem; color:var(--t3); }
  .legend{ display:flex; gap:10px; margin-left:auto; font-size:.7rem; font-weight:800;
           color:var(--t2); flex-wrap:wrap; }
  .legend span{ display:inline-flex; align-items:center; gap:4px; }
  .legend i{ display:inline-block; width:18px; height:14px; border-radius:3px; font-style:normal;
             font-size:.6rem; font-weight:900; text-align:center; line-height:14px; color:#fff; }

  .banner{ padding:12px 15px; font-size:.86rem; border-bottom:1.5px solid var(--line); }
  .banner.setup{ background:#FFF8F0; color:#8a4b00; }
  .banner.live{ background:#EEF8F3; color:#1B5E20; font-size:.8rem; }
  .banner.err{ background:#FDECEA; color:var(--bad); }
  .banner button{ margin-top:8px; padding:10px 16px; border:none; border-radius:10px;
                  background:var(--teal); color:#fff; font:900 .88rem 'Nunito',sans-serif; cursor:pointer; }
  .banner:empty{ display:none; }

  .scroller{ overflow:auto; max-height:calc(100vh - 150px); background:#fff; }
  table{ border-collapse:separate; border-spacing:0; width:100%; font-size:.78rem; }
  th,td{ border-bottom:1px solid var(--line); border-right:1px solid var(--line);
         padding:7px 8px; vertical-align:top; text-align:left; }

             border-right:2px solid var(--line); }

  thead .lv{ font-size:.9rem; color:var(--ink); }

             text-transform:uppercase; color:var(--t2); }

  td.cell.on{ background:var(--soft); }

  .st{ display:inline-block; min-width:22px; padding:1px 6px; border-radius:5px; font-weight:900;
       font-size:.66rem; color:#fff; margin-bottom:3px; }
  .st.I{ background:var(--teal); } .st.P{ background:#5DB5BA; } .st.M{ background:#6D8FB8; }
  .st.R{ background:#B9C4D4; color:#3A4556; }

  .bw{ font-size:.62rem; color:var(--warn); font-weight:900; display:block; margin-top:2px; }
  td.m .nm{ font-weight:900; font-size:.82rem; line-height:1.25; }
  td.m .sk{ font-size:.66rem; color:var(--t3); font-style:italic; }
  td.m .nr{ font-size:.62rem; color:var(--bad); font-weight:900; }

          align-items:flex-end; justify-content:center; }
  #sheet.show{ display:flex; }
  .sheet-in{ background:#fff; border-radius:16px 16px 0 0; width:100%; max-width:480px; padding:18px;
             padding-bottom:calc(18px + env(safe-area-inset-bottom,0px)); }
  .sheet-in h2{ font-size:1.02rem; font-weight:900; }
  .sheet-in .at{ font-size:.8rem; color:var(--ink); font-weight:800; margin-top:3px; }
  .sheet-in .scope{ font-size:.86rem; color:var(--t2); background:#F7F9FF; border-radius:9px;

  .opt{ padding:11px; border:1.5px solid var(--line); border-radius:10px; background:#fff;
        font:800 .84rem 'Nunito',sans-serif; color:var(--t2); cursor:pointer; text-align:left; }

mber", "cat": "Cubes", "sanskrit": "Anurupyena", "ready": true, "scopes": {"7": "Extended to three digits"}}, {"key": "sqrt_perfect", "label": "Square root of a perfect square", "cat": "Roots", "sanskrit": "Vilokanam", "ready": true, "scopes": {"8": "By inspection, perfect squares only"}}, {"key": "cbrt_perfect", "label": "Cube root of a perfect cube", "cat": "Roots", "sanskrit": "Vilokanam", "ready": true, "scopes": {"8": "By inspection, perfect cubes only"}}, {"key": "sqrt_general", "label": "Square root of any number", "cat": "Roots", "sanskrit": "Dwandwa Yoga", "ready": false, "scopes": {"8": "The general method, including non-perfect squares"}}, {"key": "digit_sum", "label": "Digit sum", "cat": "Number theory", "sanskrit": "Beejank", "ready": true, "scopes": {"2": "Reducing a number to a single digit", "3": "Checking an addition", "4": "Checking a multiplication"}}, {"key": "divis_2_3_5_10", "label": "Divisibility by 2, 3, 5 and 10", "cat": "Number theory", "sanskrit": "", "ready": true, "scopes": {"5": "The four simplest tests"}}, {"key": "divis_4_8_9", "label": "Divisibility by 4, 8 and 9", "cat": "Number theory", "sanskrit": "", "ready": true, "scopes": {"6": "Last two digits, last three, and the digit sum"}}, {"key": "divis_6_15", "label": "Divisibility by 6 and 15", "cat": "Number theory", "sanskrit": "", "ready": true, "scopes": {"7": "Combining two tests"}}, {"key": "divis_7_13_19", "label": "Divisibility by 7, 13 and 19", "cat": "Number theory", "sanskrit": "Vestanas (osculation)", "ready": true, "scopes": {"8": "The osculator method"}}, {"key": "percent_of", "label": "Finding a percentage of a number", "cat": "Percentages", "sanskrit": "", "ready": true, "scopes": {"7": "Simple percentages: 10%, 25%, 50%", "8": "Any percentage"}}, {"key": "percent_fraction", "label": "Fractional percentages", "cat": "Percentages", "sanskrit": "", "ready": true, "scopes": {"7": "12.5% and 6.25%, as one eighth and one sixteenth", "8": "33.33%, 16.66% and the rest"}}, {"k function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
  return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }

/* The scope a method uses at a level: its own, or the nearest it has. */
function scopeLevel(key, L) {
  var sc = METHODS[key].scopes || {};
  if (sc[L]) return L;
  var have = Object.keys(sc).map(Number).sort(function (a, b) { return a - b; });
  var below = have.filter(function (n) { return n < L; });
  return below.length ? below[below.length - 1] : have[0];
}

async function load() {
  var s = await sb.auth.getSession();
  if (!s.data.session) { location.href = '/login.html'; return; }

  var [cc, lc] = await Promise.all([
    sb.from('curriculum_concepts').select('id, concept_code').eq('program_code', PROG),
    sb.from('curriculum_level_concepts')
      .select('level_code, status, concept_id, curriculum_concepts(concept_code)').eq('program_code', PROG)
  ]);
  if (cc.error || lc.error) {
    banner('err', 'Could not read the curriculum: ' + esc((cc.error || lc.error).message));
    return;
  }
  CONCEPT_ID = {};
  var hasMarker = false;
  (cc.data || []).forEach(function (c) {
    if (c.concept_code === MARKER) hasMarker = true;
    if (METHODS[c.concept_code]) CONCEPT_ID[c.concept_code] = c.id;
  });
  STATUS = {};
  (lc.data || []).forEach(function (r) {
    var k = r.curriculum_concepts && r.curriculum_concepts.concept_code;
    if (!k || !METHODS[k] || !r.status || r.status === 'N') return;
    STATUS[parseInt(r.level_code.replace(/^L/, ''), 10) + ':' + k] = r.status;
  });
  /* Live only once the approved plan is in. Rows without the marker
     are an older draft \u2014 the engine ignores them, and so must this. */
  var staleRows = Object.keys(STATUS).length;
  LIVE = hasMarker;
  if (!LIVE) STATUS = {};

  if (!LIVE) {
    /* Show the approved plan, locked, with the one step that unlocks it. */
    PLAN.plan.forEach(function (p) { STATUS[p[0] + ':' + p[1]] = p[2]; });
    banner('setup',
      '<b>This is Megha\u2019s approved plan, not yet in the curriculum.</b><br>' +
      (staleRows ? 'The curriculum holds ' + staleRows + ' rows from an older draft, which worksheets are ' +
                   'ignoring. Putting the plan in replaces them.<br>' : '') +
      'Put it in first, and every change after that will reach LX Designer straight away.' +
      '<br><button onclick="seed()">Put the approved plan into the curriculum</button>');
  } else {
    banner('live', 'Live \u2014 ' + Object.keys(STATUS).length + ' methods placed across 8 levels. ' +
      'Tap any cell to change it; the next Vedic worksheet follows.');
  }
  draw();
}

function banner(kind, html) {
  var b = document.getElementById('banner');
  b.className = 'banner ' + kind; b.innerHTML = html;
}

/* ── putting the approved plan in ─────────────────────────── */
async function ensureConcept(key) {
  if (CONCEPT_ID[key]) return CONCEPT_ID[key];
  var m = METHODS[key];
  var ins = await sb.from('curriculum_concepts').insert({
    program_code: PROG, concept_code: key, concept_name: m.label, category: m.cat
  }).select('id');
  if (ins.error || !ins.data || !ins.data.length) throw new Error('could not add ' + m.label + ': ' +
    ((ins.error && ins.error.message) || 'nothing written'));
  CONCEPT_ID[key] = ins.data[0].id;
  return CONCEPT_ID[key];
}

async function seed() {
  banner('setup', 'Putting the approved plan in\u2026');
  try {
    /* 1. Retire the older draft: every existing Vedic row set to "not
          taught" rather than deleted, so nothing is lost and nothing old
          can be read as part of the new plan. */
    var off = await sb.from('curriculum_level_concepts').update({ status: 'N' }).eq('program_code', PROG);
    if (off.error) throw off.error;

    /* 2. One concept per method, then the 76 placements. */
    var keys = Object.keys(METHODS);
    for (var i = 0; i < keys.length; i++) await ensureConcept(keys[i]);
    var rows = PLAN.plan.map(function (p) {
      return { program_code: PROG, level_code: 'L' + p[0], concept_id: CONCEPT_ID[p[1]], status: p[2] };
    });
    var up = await sb.from('curriculum_level_concepts')
      .upsert(rows, { onConflict: 'program_code,level_code,concept_id' }).select('concept_id');
    if (up.error) throw up.error;

    /* 3. Counted back before anything trusts it. */
    var back = await sb.from('curriculum_level_concepts')
      .select('status, curriculum_concepts(concept_code)').eq('program_code', PROG).neq('status', 'N');
    if (back.error) throw back.error;
    var n = (back.data || []).filter(function (r) {
      return r.curriculum_concepts && METHODS[r.curriculum_concepts.concept_code];
    }).length;
    if (n !== rows.length) throw new Error(n + ' of ' + rows.length + ' placements arrived');

    /* 4. The marker, LAST. Only now does the engine start reading the
          curriculum instead of the built-in plan. */
    var mk = await sb.from('curriculum_concepts').insert({
      program_code: PROG, concept_code: MARKER,
      concept_name: 'Vedic plan in the curriculum (do not delete)', category: 'system'
    }).select('id');
    if (mk.error || !mk.data || !mk.data.length)
      throw new Error('the plan went in but could not be marked ready: ' +
        ((mk.error && mk.error.message) || 'nothing written'));
    await load();
  } catch (e) {
    banner('err', 'The plan did not go in: ' + esc(e.message || String(e)) +
      '. Worksheets carry on using the approved plan, so children are unaffected.');
  }
}

/* ── drawing ──────────────────────────────────────────────── */
function draw() {
  var h = '<table><thead><tr><th class="m">Method</th>';
  for (var L = 1; L <= 8; L++) h += '<th><div class="lv">L' + L + '</div></th>';
  h += '</tr></thead><tbody>';
  CATS.forEach(function (cat) {
    var ms = PLAN.methods.filter(function (m) { return m.cat === cat; });
    if (!ms.length) return;
    h += '<tr class="cat"><td colspan="9">' + esc(cat) + '</td></tr>';
    ms.forEach(function (m) {
      h += '<tr><td class="m"><div class="nm">' + esc(m.label) + '</div>' +
        (m.sanskrit ? '<div class="sk">' + esc(m.sanskrit) + '</div>' : '') +
        (m.ready ? '' : '<div class="nr">not built yet \u2014 worksheets skip it</div>') + '</td>';
      for (var L = 1; L <= 8; L++) {
        var st = STATUS[L + ':' + m.key];
        var sL = scopeLevel(m.key, L), borrow = st && sL !== L;
        h += '<td class="cell' + (st ? ' on' : '') + (borrow ? ' borrow' : '') + (LIVE ? '' : ' locked') +
          '" onclick="tap(\'' + m.key + '\',' + L + ')">' +
          (st ? '<span class="st ' + st + '">' + st + '</span>' +
                '<span class="sc">' + esc(m.scopes[sL] || '') + '</span>' +
                (borrow ? '<span class="bw">using its Level ' + sL + ' scope</span>' : '') : '') +
          '</td>';
      }
      h += '</tr>';
    });
  });
  document.getElementById('grid').innerHTML = h + '</tbody></table>';
}

/* ── changing a cell ──────────────────────────────────────── */
function tap(key, L) {
  if (!LIVE) {
    banner('setup', '<b>Put the approved plan in first</b> \u2014 until then a change here could ' +
      'replace the whole course with one method.<br>' +
      '<button onclick="seed()">Put the approved plan into the curriculum</button>');
    return;
  }
  var m = METHODS[key]; open = { key: key, L: L };
  var cur = STATUS[L + ':' + key] || null, sL = scopeLevel(key, L);
  var h = '<h2>' + esc(m.label) + '</h2><div class="at">Level ' + L + '</div>' +
    '<div class="scope">At this level: <b>' + esc(m.scopes[sL] || '') + '</b>' +
      (sL !== L ? '<br><span style="color:var(--warn);font-weight:800;">It has no Level ' + L +
        ' scope of its own, so it uses its Level ' + sL + ' one.</span>' : '') + '</div>' +
    '<div class="opts">' +
      ['I','P','M','R'].map(function (s) {
        return '<button class="opt' + (cur === s ? ' on' : '') + '" onclick="setSt(\'' + s + '\')">' +
          '<b>' + s + '</b>' + WORDS[s] + '</button>';
      }).join('') +
      '<button class="opt none' + (!cur ? ' on' : '') + '" onclick="setSt(\'N\')"><b>&ndash;</b>Not taught at this level</button>' +
    '</div><div class="msg" id="msg" role="status"></div>' +
    '<button class="close" onclick="closeSheet()">Done</button>';
  document.getElementById('sheetIn').innerHTML = h;
  document.getElementById('sheet').classList.add('show');
}

async function setSt(st) {
  if (!open) return;
  var msg = document.getElementById('msg');
  msg.className = 'msg'; msg.textContent = 'Saving\u2026';
  try {
    var cid = await ensureConcept(open.key);
    var res = await sb.from('curriculum_level_concepts').upsert({
      program_code: PROG, level_code: 'L' + open.L, concept_id: cid, status: st
    }, { onConflict: 'program_code,level_code,concept_id' }).select();
    if (res.error || !res.data || !res.data.length)
      throw new Error((res.error && res.error.message) || 'nothing was written');
    var k = open.L + ':' + open.key;
    if (st === 'N') delete STATUS[k]; else STATUS[k] = st;
    draw();
    var kept = open;
    tap(kept.key, kept.L);
    var m2 = document.getElementById('msg');
    m2.className = 'msg ok';
    m2.textContent = (st === 'N' ? 'Saved \u2014 not taught here.' : 'Saved as ' + WORDS[st] + '.') +
      ' The next Vedic worksheet at Level ' + kept.L + ' will follow this.';
  } catch (e) {
    msg.className = 'msg err'; msg.textContent = 'Not saved: ' + e.message;
  }
}

function closeSheet() { document.getElementById('sheet').classList.remove('show'); open = null; }
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

load().catch(function (e) { banner('err', 'Could not load: ' + esc(e.message)); });
</script>
