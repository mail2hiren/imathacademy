<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vedic practice — iMath Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--program:#04949D;--soft:#E7F6F7;--ink:#04616a;
        --t1:#1F2430;--t2:#4A5160;--t3:#8892A4;--line:#E6E9F0;
        --good:#2E7D32;--bad:#C62828;}
  body{font-family:'Nunito',sans-serif;background:#F5F7FC;color:var(--t1);
       line-height:1.6;-webkit-font-smoothing:antialiased;}
  .top{background:#fff;border-bottom:1.5px solid var(--line);padding:11px 15px;
       display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;}
  .top a{color:var(--t3);text-decoration:none;font-size:1.25rem;}
  .top .t{font-size:.94rem;font-weight:900;}
  .top .xp{margin-left:auto;background:var(--soft);color:var(--ink);border-radius:20px;
           padding:5px 11px;font-size:.76rem;font-weight:900;}

  .wrap{max-width:560px;margin:0 auto;padding:14px;}

  .pips{display:flex;gap:5px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;}
  .pip{width:22px;height:22px;border-radius:50%;background:#E4E7F2;color:var(--t3);
       font-size:.68rem;font-weight:900;display:flex;align-items:center;
       justify-content:center;}
  .pip.on{background:var(--program);color:#fff;}
  .pip.right{background:var(--good);color:#fff;}
  .pip.wrong{background:var(--bad);color:#fff;}

  .card{background:linear-gradient(135deg,var(--program),#40A9A2);border-radius:20px;
        padding:24px 20px;color:#fff;text-align:center;position:relative;}
  .card .meth{font-size:.72rem;font-weight:900;letter-spacing:1pt;opacity:.9;}
  .card .sum{font-size:2.3rem;font-weight:900;margin-top:8px;
             font-variant-numeric:tabular-nums;line-height:1.2;}
  .card .of{font-size:.74rem;opacity:.8;margin-top:8px;}

  .steps{background:#fff;border:1.5px solid var(--line);border-radius:16px;
         padding:17px;margin-top:14px;}
  .steps .lead{font-size:.72rem;font-weight:900;letter-spacing:.7pt;color:var(--t3);
               text-transform:uppercase;margin-bottom:11px;}
  .st{display:flex;align-items:center;gap:10px;padding:9px 0;
      border-bottom:1px solid var(--line);}
  .st:last-child{border-bottom:none;}
  .st.future{opacity:.35;}
  .st .n{width:23px;height:23px;border-radius:50%;background:var(--soft);
         color:var(--ink);font-size:.7rem;font-weight:900;flex-shrink:0;
         display:flex;align-items:center;justify-content:center;}
  .st.done .n{background:var(--good);color:#fff;}
  .st .ask{flex:1;font-size:.9rem;min-width:0;}
  .st .got{font-weight:900;color:var(--good);font-variant-numeric:tabular-nums;}
  .st input{width:78px;padding:9px;border:1.5px solid var(--program);border-radius:9px;
            font-family:inherit;font-size:1rem;text-align:center;font-weight:800;}
  .st input:focus{outline:none;border-color:var(--ink);}
  .hint{font-size:.79rem;color:var(--t3);margin-top:4px;}

  .answer{background:#fff;border:1.5px solid var(--line);border-radius:16px;
          padding:18px;margin-top:14px;text-align:center;}
  .answer input{width:100%;max-width:200px;padding:14px;border:2px solid var(--program);
                border-radius:12px;font-family:inherit;font-size:1.5rem;text-align:center;
                font-weight:900;}
  .answer input:focus{outline:none;}

  .btn{width:100%;padding:15px;border:none;border-radius:13px;background:var(--program);
       color:#fff;font-family:inherit;font-size:1rem;font-weight:900;cursor:pointer;
       margin-top:13px;}
  .btn[disabled]{opacity:.5;}
  .btn.ghost{background:#fff;color:var(--t2);border:1.5px solid var(--line);}

  .verdict{border-radius:14px;padding:15px 17px;margin-top:13px;font-size:.92rem;}
  .verdict.right{background:#E9F5EC;color:#1B5E20;}
  .verdict.wrong{background:#FDECEA;color:#8a1c17;}
  .verdict strong{display:block;font-size:1.02rem;margin-bottom:4px;}
  .working{background:#F7F9FF;border-radius:10px;padding:11px 13px;margin-top:10px;
           font-size:.85rem;color:var(--t2);text-align:left;}
  .working div{padding:2px 0;}

  .done-screen{text-align:center;padding:34px 18px;}
  .done-screen .big{font-size:3rem;}
  .done-screen h2{font-size:1.35rem;font-weight:900;margin-top:10px;}
  .done-screen .score{font-size:2.2rem;font-weight:900;color:var(--program);margin-top:12px;}
  .spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--program);
        border-radius:50%;margin:40px auto;animation:sp .7s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="top">
  <a href="vedic-home.html">&larr;</a>
  <span class="t" id="title">Vedic practice</span>
  <span class="xp" id="xp">&#9889; 0</span>
</div>

<div class="wrap" id="body"><div class="spin"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/programs.js"></script>
<script src="../js/sutra-rules.js"></script>
<script src="../js/vedic-gen.js"></script>
<script src="../js/vedic-steps.js"></script>
<script src="../js/vedic-engine.js"></script>
<script>
/* ============================================================
   Vedic practice
   ------------------------------------------------------------
   Megha's instruction, close to word for word:

     "Guided steps when a method is introduced — the first few
      questions at that level. Then answer-only with the working
      revealed for the rest, once they know it."

   So a guided question walks through one step at a time, each
   checked as it is entered. An unguided one takes the answer and
   shows the working afterwards either way — right or wrong,
   because seeing the method again is the point.

   There is no fallback generator. If the engine cannot build a
   legal page it says so, because a Vedic sum the method does not
   suit teaches the wrong instinct.
   ============================================================ */

var SUPABASE_URL = 'https://bhullfoajenhkxlkiubs.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJodWxsZm9hamVuaGt4bGtpdWJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MzcwMjUsImV4cCI6MjA5MzExMzAyNX0.RUcKFGluRhu9H8sZdLb-ow4ORoCd2-oIzYXJqyNZ5Uc';
var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

var me = null, level = 1, questions = [], at = 0;
var stepAt = 0, right = 0, wrong = 0, xp = 0, marks = [];

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

async function init() {
  var s = await sb.auth.getSession();
  if (!s.data.session) { location.href = '../../login.html'; return; }
  me = s.data.session.user.id;

  await Programs.load(me);
  var lv = Programs.levelIn('vedic');
  if (lv === null) { location.href = 'vedic-home.html'; return; }
  level = lv;

  var page = VedicEngine.buildPage(level, { count: 10, guideFirst: 3 });

  /* Said plainly rather than faked. This is the lesson from the
     abacus side, where a silent fallback gave children the wrong
     level for weeks. */
  if (page.error || !page.questions || !page.questions.length) {
    document.getElementById('body').innerHTML =
      '<div class="done-screen"><div class="big">\uD83E\uDDEE</div>' +
      '<h2>Practice is not ready for this level</h2>' +
      '<div style="color:var(--t2);margin-top:8px;line-height:1.65;">' +
        esc(page.error || 'Nothing could be built.') + '</div>' +
      '<a href="vedic-home.html" class="btn" style="display:block;text-decoration:none;' +
        'max-width:240px;margin:20px auto 0;">Back</a></div>';
    return;
  }

  /* The gate, again, in the page that serves it. Cheap, and it is
     the difference between a bug and a bad lesson. */
  var problems = VedicEngine.auditPage(page, level);
  if (problems.length) {
    console.error('Vedic page failed its own audit:', problems);
    document.getElementById('body').innerHTML =
      '<div class="done-screen"><div class="big">\uD83E\uDDEE</div>' +
      '<h2>Practice is not ready just now</h2>' +
      '<div style="color:var(--t2);margin-top:8px;">Your teacher has been told.</div></div>';
    return;
  }

  questions = page.questions;
  document.getElementById('title').textContent =
    'Level ' + level + ' \u00b7 ' + page.levelName;
  render();
}

function render() {
  var q = questions[at];
  if (!q) { finish(); return; }
  stepAt = 0;

  var pips = questions.map(function (_, i) {
    var c = i === at ? 'on' : (marks[i] === true ? 'right' : marks[i] === false ? 'wrong' : '');
    return '<div class="pip ' + c + '">' + (i + 1) + '</div>';
  }).join('');

  var html = '<div class="pips">' + pips + '</div>' +
    '<div class="card">' +
      '<div class="meth">' + (q.tellMethod ? esc(q.label).toUpperCase() : 'WHICH METHOD?') + '</div>' +
      '<div class="sum">' + esc(q.text) + '</div>' +
      '<div class="of">Question ' + (at + 1) + ' of ' + questions.length + '</div>' +
    '</div>';

  if (q.guided && q.steps) {
    html += '<div class="steps" id="steps">' +
      '<div class="lead">Work through it step by step</div>' +
      q.steps.map(function (s, i) {
        return '<div class="st ' + (i === 0 ? '' : 'future') + '" id="st-' + i + '">' +
          '<div class="n">' + (i + 1) + '</div>' +
          '<div class="ask">' + esc(s.ask) +
            (i === 0 && s.hint ? '<div class="hint">' + esc(s.hint) + '</div>' : '') +
          '</div>' +
          (i === 0
            ? '<input id="si" inputmode="numeric" onkeydown="if(event.key===\'Enter\')checkStep()">'
            : '<span class="got" id="sv-' + i + '"></span>') +
        '</div>';
      }).join('') +
      '</div>' +
      '<button class="btn" onclick="checkStep()">Check</button>';
  } else {
    html += '<div class="answer">' +
      '<div style="font-size:.8rem;color:var(--t3);font-weight:800;margin-bottom:9px;">' +
        'Work it on paper, then type the answer</div>' +
      '<input id="ai" inputmode="numeric" onkeydown="if(event.key===\'Enter\')checkAnswer()">' +
      '</div>' +
      '<button class="btn" onclick="checkAnswer()">Check</button>';
  }

  document.getElementById('body').innerHTML = html;
  var f = document.getElementById('si') || document.getElementById('ai');
  if (f) f.focus();
}

/* ── a guided question, one step at a time ───────────────── */
function checkStep() {
  var q = questions[at];
  var inp = document.getElementById('si');
  if (!inp || inp.value === '') return;

  var want = q.steps[stepAt].answer;
  var got  = Number(inp.value);
  var row  = document.getElementById('st-' + stepAt);

  if (got !== want) {
    /* The step is shown, not hidden. A child stuck on step three
       should be told what step three is, not sent back to the top. */
    row.classList.add('done');
    row.querySelector('.n').style.background = 'var(--bad)';
    inp.remove();
    var sv = document.createElement('span');
    sv.className = 'got';
    sv.style.color = 'var(--bad)';
    sv.innerHTML = esc(String(got)) + ' &rarr; <span style="color:var(--good)">' +
                   esc(String(want)) + '</span>';
    row.appendChild(sv);
    marks[at] = false;
  } else {
    row.classList.add('done');
    inp.remove();
    var ok = document.createElement('span');
    ok.className = 'got';
    ok.textContent = want;
    row.appendChild(ok);
    if (marks[at] !== false) marks[at] = true;
  }

  stepAt++;
  if (stepAt >= q.steps.length) { settle(marks[at] !== false); return; }

  // open the next step
  var next = document.getElementById('st-' + stepAt);
  next.classList.remove('future');
  var span = document.getElementById('sv-' + stepAt);
  if (span) span.remove();
  var ni = document.createElement('input');
  ni.id = 'si';
  ni.setAttribute('inputmode', 'numeric');
  ni.onkeydown = function (e) { if (e.key === 'Enter') checkStep(); };
  next.appendChild(ni);
  var h = q.steps[stepAt].hint;
  if (h) {
    var hd = document.createElement('div');
    hd.className = 'hint';
    hd.textContent = h;
    next.querySelector('.ask').appendChild(hd);
  }
  ni.focus();
}

/* ── an unguided question ─────────────────────────────────── */
function checkAnswer() {
  var q = questions[at];
  var inp = document.getElementById('ai');
  if (!inp || inp.value.trim() === '') return;
  var ok = inp.value.trim().replace(/\s+/g, '') === String(q.answer).replace(/\s+/g, '');
  marks[at] = ok;
  settle(ok);
}

/* Right or wrong, the working is shown. Seeing the method again is
   the point of the exercise. */
function settle(ok) {
  var q = questions[at];
  if (ok) { right++; xp += 10; } else { wrong++; }
  document.getElementById('xp').textContent = '\u26A1 ' + xp;

  var steps = q.steps || q.workingShown || [];
  var html =
    '<div class="verdict ' + (ok ? 'right' : 'wrong') + '">' +
      '<strong>' + (ok ? 'Correct' : 'Not quite \u2014 the answer is ' + esc(q.answer)) + '</strong>' +
      (q.tellMethod ? '' : 'This one is ' + esc(q.label) + '.') +
      (steps.length
        ? '<div class="working">' + steps.map(function (s) {
            return '<div>' + esc(s.ask) + ' &nbsp;&rarr;&nbsp; <strong>' +
                   esc(String(s.answer)) + '</strong></div>';
          }).join('') + '</div>'
        : '') +
    '</div>' +
    '<button class="btn" onclick="next()">' +
      (at + 1 >= questions.length ? 'Finish' : 'Next question') + '</button>';

  document.getElementById('body').insertAdjacentHTML('beforeend', html);
  var b = document.querySelector('.btn:last-of-type');
  document.querySelectorAll('.btn').forEach(function (x) {
    if (x.textContent === 'Check') x.remove();
  });
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

function next() { at++; render(); }

async function finish() {
  var pct = Math.round(right / questions.length * 100);
  document.getElementById('body').innerHTML =
    '<div class="done-screen">' +
      '<div class="big">' + (pct >= 90 ? '\uD83C\uDF1F' : pct >= 70 ? '\uD83D\uDC4D' : '\uD83D\uDCAA') + '</div>' +
      '<h2>' + (pct >= 90 ? 'Excellent' : pct >= 70 ? 'Well done' : 'Keep going') + '</h2>' +
      '<div class="score">' + right + ' / ' + questions.length + '</div>' +
      '<div style="color:var(--t2);margin-top:6px;">' + pct + '% \u00b7 ' + xp + ' XP earned</div>' +
      '<button class="btn" onclick="location.reload()">Practise again</button>' +
      '<a href="vedic-home.html" class="btn ghost" style="display:block;' +
        'text-decoration:none;text-align:center;">Done for now</a>' +
    '</div>';

  // .select() so a refused write does not look like a save
  try {
    var res = await sb.from('practice_sessions').insert({
      student_id: me, program_code: 'vedic', level: level,
      questions_total: questions.length, questions_correct: right,
      accuracy: pct, xp_earned: xp
    }).select();
    if (res.error) throw res.error;
    if (!res.data || !res.data.length) throw new Error('nothing written');
  } catch (e) {
    console.warn('Session not saved:', e.message);
  }
}

init().catch(function (e) {
  document.getElementById('body').innerHTML =
    '<div class="done-screen"><h2>Could not load</h2><div style="color:var(--t2);' +
    'margin-top:8px;">' + esc(e.message) + '</div></div>';
});
</script>
</body>
</html>
