<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My child &mdash; iMath Academy</title>
<link rel="icon" type="image/png" href="/assets/icon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#16324F; --t2:#4A5160; --t3:#8892A4; --line:#E6E9F0; --bg:#F4F7FB;
         --teal:#04949D; --teal-soft:#E7F6F7; --org:#E67D21; --org-soft:#FFF1E2;
         --good:#2E7D32; --good-soft:#E8F5EE; --warn:#EF6C00; --bad:#C62828; --gold:#B8860B; }
  :root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px);
         padding-bottom:env(safe-area-inset-bottom,0px); }
  *,*::before,*::after{ box-sizing:inherit; margin:0; padding:0; }
  body{ font-family:'Nunito',system-ui,-apple-system,sans-serif; background:var(--bg);
        color:var(--ink); -webkit-font-smoothing:antialiased; line-height:1.5; }

  .bar{ background:#fff; border-bottom:1.5px solid var(--line); padding:11px 16px;
        display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:10; }
  .bar .logo{ font-weight:900; font-size:1rem; }
  .bar .out{ margin-left:auto; font-size:.8rem; color:var(--t3); text-decoration:none; font-weight:800; }

  .wrap{ max-width:620px; margin:0 auto; padding:14px 14px 90px; }

  .kids{ display:flex; gap:7px; overflow-x:auto; margin-bottom:12px; scrollbar-width:none; }
  .kids::-webkit-scrollbar{ display:none; }
  .kids button{ flex:0 0 auto; padding:8px 15px; border-radius:999px; border:2px solid var(--line);
                background:#fff; font:800 .88rem 'Nunito',sans-serif; color:var(--t2); cursor:pointer; }
  .kids button[aria-pressed="true"]{ border-color:var(--teal); background:var(--teal-soft); color:#04616a; }

  .card{ background:#fff; border-radius:18px; padding:18px; margin-bottom:12px;
         box-shadow:0 1px 0 var(--line), 0 8px 24px -18px rgba(22,50,79,.4); }
  .card h2{ font-size:.72rem; font-weight:900; letter-spacing:.9pt; text-transform:uppercase;
            color:var(--t3); margin-bottom:10px; }

  /* the one thing a parent should read first */
  .hero{ background:linear-gradient(135deg,#04949D,#3FB6AE); color:#fff; }
  .hero h2{ color:rgba(255,255,255,.85); }
  .hero .name{ font-size:1.5rem; font-weight:900; }
  .hero .line{ font-size:1rem; margin-top:4px; opacity:.95; }
  .ring{ display:flex; align-items:center; gap:14px; margin-top:14px; }
  .ring .track{ flex:1; height:12px; border-radius:8px; background:rgba(255,255,255,.28); overflow:hidden; }
  .ring .track i{ display:block; height:100%; background:#fff; border-radius:8px; }
  .ring .pct{ font-weight:900; font-variant-numeric:tabular-nums; }
  .listen{ margin-top:14px; width:100%; padding:13px; border:none; border-radius:13px;
           background:rgba(255,255,255,.18); color:#fff; border:2px solid rgba(255,255,255,.55);
           font:900 .92rem 'Nunito',sans-serif; cursor:pointer; }

  .strip{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
  .stat{ background:#fff; border-radius:14px; padding:13px 10px; text-align:center;
         box-shadow:0 1px 0 var(--line); }
  .stat .n{ font-size:1.4rem; font-weight:900; line-height:1; }
  .stat .n.good{ color:var(--good); } .stat .n.warn{ color:var(--warn); }
  .stat .k{ font-size:.7rem; color:var(--t3); font-weight:800; margin-top:4px; }

  /* the journey */
  .track2{ display:flex; align-items:flex-start; gap:0; overflow-x:auto; padding-bottom:4px;
           scrollbar-width:none; }
  .track2::-webkit-scrollbar{ display:none; }
  .stop{ flex:0 0 auto; width:62px; text-align:center; position:relative; }
  .stop .dot{ width:30px; height:30px; border-radius:50%; margin:0 auto; display:flex;
              align-items:center; justify-content:center; font-weight:900; font-size:.78rem;
              background:#EEF1F6; color:var(--t3); border:2px solid #fff; position:relative; z-index:1; }
  .stop.done .dot{ background:var(--good); color:#fff; }
  .stop.here .dot{ background:var(--org); color:#fff; box-shadow:0 0 0 4px var(--org-soft); }
  .stop .lb{ font-size:.66rem; color:var(--t3); font-weight:800; margin-top:5px; line-height:1.25; }
  .stop::before{ content:''; position:absolute; top:15px; left:0; width:100%; height:3px;
                 background:var(--line); z-index:0; }
  .stop:first-child::before{ left:50%; width:50%; }
  .stop:last-child::before{ width:50%; }
  .stop.done::before{ background:var(--good); }

  /* what to do about it */
  .help{ display:flex; gap:11px; align-items:flex-start; padding:11px 0;
         border-bottom:1px solid var(--line); }
  .help:last-child{ border-bottom:none; }
  .help .ic{ width:32px; height:32px; border-radius:10px; flex-shrink:0; display:flex;
             align-items:center; justify-content:center; font-size:1rem; background:var(--org-soft); }
  .help .tx strong{ display:block; font-size:.94rem; }
  .help .tx span{ font-size:.84rem; color:var(--t2); }

  .money{ display:flex; align-items:center; gap:12px; }
  .money .st{ flex:1; }
  .money .st b{ display:block; font-size.98rem; font-size:.98rem; }
  .money .st span{ font-size:.82rem; color:var(--t2); }
  .pill{ font-size:.7rem; font-weight:900; padding:4px 10px; border-radius:999px; }
  .pill.ok{ background:var(--good-soft); color:#1B5E20; }
  .pill.due{ background:var(--org-soft); color:#8a4b00; }
  .pill.off{ background:#FDECEA; color:#B71C1C; }

  .go{ display:block; text-align:center; padding:13px; border-radius:13px; text-decoration:none;
       font:900 .9rem 'Nunito',sans-serif; margin-top:10px;
       background:var(--teal); color:#fff; }
  .go.ghost{ background:#fff; color:var(--teal); border:2px solid var(--teal); }

  .bnav{ position:fixed; left:0; right:0; bottom:0; background:#fff;
         border-top:1.5px solid var(--line); display:flex; z-index:20;
         padding-bottom:env(safe-area-inset-bottom,0px); }
  .bnav a{ flex:1; text-align:center; padding:9px 4px; text-decoration:none; color:var(--t3);
           font:800 .66rem 'Nunito',sans-serif; }
  .bnav a .i{ display:block; font-size:1.2rem; }
  .bnav a.on{ color:var(--teal); }

  .quiet{ font-size:.8rem; color:var(--t3); }
  .err{ background:#FDECEA; color:var(--bad); border-radius:14px; padding:14px;
        font-weight:800; font-size:.88rem; }
  .spin{ padding:40px; text-align:center; color:var(--t3); }
  button:focus-visible, a:focus-visible{ outline:3px solid var(--teal); outline-offset:2px; }
</style>
</head>
<body>

<div class="bar">
  <span class="logo">&#128101; iMath Academy</span>
  <a class="out" href="../../login.html" onclick="signOut(event)">Sign out</a>
</div>

<div class="wrap">
  <div class="kids" id="kids"></div>
  <div id="body"><div class="spin">Loading&hellip;</div></div>
</div>

<nav class="bnav">
  <a class="on" href="dashboard.html"><span class="i">&#128200;</span>Progress</a>
  <a href="certificates.html"><span class="i">&#127942;</span>Awards</a>
  <a href="payments.html"><span class="i">&#128179;</span>Fees</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/speech.js"></script>
<script src="../js/bead-rules.js"></script>
<script src="../js/column-gen.js"></script>
<script src="../js/practice-engine.js"></script>
<script>
/* ============================================================
   What a parent sees
   ------------------------------------------------------------
   The old screen had five tabs, eight cards and a voice chooser, and
   no parent was using it. This one answers the three questions a
   parent actually has, in that order:

     How is my child doing?
     What can I do about it?
     Am I paid up?

   Everything is one scroll. Nothing is a tab. The progress can be
   READ ALOUD, because a parent on a phone between other things would
   rather listen than read \u2014 in the voice the app already prefers,
   Indian and female where the device has one.

   What we do NOT do here: show a number that invites comparison
   between children, or say anything about a child's difficulties
   that their teacher has not already said.
   ============================================================ */

var sb = supabase.createClient(
  'https://bhullfoajenhkxlkiubs.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJodWxsZm9hamVuaGt4bGtpdWJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MzcwMjUsImV4cCI6MjA5MzExMzAyNX0.RUcKFGluRhu9H8sZdLb-ow4ORoCd2-oIzYXJqyNZ5Uc');

var KIDS = [], whose = null, DATA = {}, LEVELNAMES = {};

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
  return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }
function fmt(d){ return d ? new Date(d).toLocaleDateString('en-IN',
  { day:'numeric', month:'short' }) : ''; }
function days(d){ return d ? Math.floor((Date.now() - new Date(d)) / 86400000) : null; }
function first(n){ return String(n || '').trim().split(' ')[0] || 'your child'; }

async function signOut(e) {
  e.preventDefault();
  try { await sb.auth.signOut(); } catch (x) {}
  location.href = '../../login.html';
}

async function start() {
  var s = await sb.auth.getSession();
  if (!s.data.session) { location.href = '../../login.html'; return; }
  var me = s.data.session.user.id;

  var link = await sb.from('parent_student')
    .select('student_id, users:student_id(id, full_name, current_level, xp_points, last_active)')
    .eq('parent_id', me);
  if (link.error) {
    document.getElementById('body').innerHTML =
      '<div class="err">Could not load your children: ' + esc(link.error.message) + '</div>';
    return;
  }
  KIDS = (link.data || []).map(function (r) {
    return Object.assign({ id: r.student_id }, r.users || {});
  }).filter(function (k) { return k.id; });

  if (!KIDS.length) {
    document.getElementById('body').innerHTML =
      '<div class="card"><h2>Welcome</h2><div class="name" style="font-size:1.2rem;font-weight:900;">' +
      'No child is linked to this account yet</div>' +
      '<p class="quiet" style="margin-top:6px;">Please ask the academy to link your child. ' +
      'Everything about their progress will appear here once they do.</p></div>';
    return;
  }
  whose = KIDS[0].id;

  try {
    var lv = await sb.from('curriculum_levels').select('program_code, level_code, level_name');
    (lv.data || []).forEach(function (l) {
      LEVELNAMES[(l.program_code || 'abacus') + '|' + l.level_code] = l.level_name;
    });
  } catch (e) {}

  drawKids();
  await load(whose);
}

function drawKids() {
  if (KIDS.length < 2) { document.getElementById('kids').innerHTML = ''; return; }
  document.getElementById('kids').innerHTML = KIDS.map(function (k) {
    return '<button aria-pressed="' + (k.id === whose) + '" onclick="pick(\'' + k.id + '\')">' +
      esc(first(k.full_name)) + '</button>';
  }).join('');
}
async function pick(id) { whose = id; drawKids(); await load(id); }

/* Everything about one child, read together. */
async function load(id) {
  document.getElementById('body').innerHTML = '<div class="spin">Loading&hellip;</div>';
  var since = new Date(Date.now() - 45 * 86400000).toISOString();

  var [progs, sess, ws, comp, tests, pos, subs] = await Promise.all([
    sb.from('student_programs').select('*').eq('student_id', id),
    sb.from('practice_sessions').select('*').eq('student_id', id)
      .gte('created_at', since).order('created_at', { ascending: false }),
    /* The worksheet's own concept and programme come with it — that is
       what makes "where the practice is needed" possible at all. */
    sb.from('worksheet_responses')
      .select('score, total, submitted_at, lx_worksheets(concept, program_code, level)')
      .eq('student_id', id).order('submitted_at', { ascending: false }).limit(40),
    sb.from('student_level_completions').select('*').eq('student_id', id),
    sb.from('test_attempts').select('*').eq('student_id', id),
    sb.from('student_level_position').select('*').eq('student_id', id),
    /* Every subscription, not the latest one: a child may be paid up
       for Abacus and not for Vedic, and a parent needs to see which. */
    sb.from('subscriptions').select('*').eq('student_id', id)
      .order('expires_at', { ascending: false })
  ]);

  DATA = {
    kid: KIDS.filter(function (k) { return k.id === id; })[0] || {},
    progs: (progs.data || []).filter(function (p) { return p.is_active !== false; }),
    sess: sess.data || [],
    ws: (ws.data || []).map(function (w) {
      var sheet = w.lx_worksheets || {};
      return { score: w.score, total: w.total, submitted_at: w.submitted_at,
               concept: sheet.concept, program_code: sheet.program_code || 'abacus',
               level: sheet.level };
    }),
    comp: comp.data || [], tests: (tests && !tests.error) ? (tests.data || []) : [],
    pos: pos.data || [], subs: subs.data || []
  };
  draw();
}

/* ── the words a parent reads or hears ─────────────────────── */
function summary() {
  var d = DATA, name = first(d.kid.full_name);
  var prog = d.progs.filter(function (p) { return p.program_code === 'abacus'; })[0] || d.progs[0] || {};
  var lvl = prog.current_level != null ? prog.current_level : (d.kid.current_level || 0);
  var code = (prog.program_code === 'vedic' ? 'VL' : 'L') + lvl;
  var p = d.pos.filter(function (x) { return x.level_code === code; })[0];
  var through = p ? Math.round(Number(p.position) * 100) : null;

  var weekStart = Date.now() - 7 * 86400000;
  var week = d.sess.filter(function (s) { return new Date(s.created_at) >= weekStart; });
  var att = week.reduce(function (a, s) { return a + (s.questions_attempted || 0); }, 0);
  var cor = week.reduce(function (a, s) { return a + (s.questions_correct || 0); }, 0);
  var acc = att ? Math.round(cor / att * 100) : null;
  var quiet = days(d.sess.length ? d.sess[0].created_at : d.kid.last_active);

  var levelName = LEVELNAMES[(prog.program_code || 'abacus') + '|' + code] || '';
  var where = through == null ? 'just started this level'
            : through < 25 ? 'near the beginning of this level'
            : through < 55 ? 'working through this level'
            : through < 80 ? 'well into this level'
            : 'close to finishing this level';

  var lines = [];
  lines.push(name + ' is on Level ' + lvl + (levelName ? ', ' + levelName : '') + ', and is ' + where + '.');
  if (week.length) {
    lines.push('This week ' + name + ' has practised ' + week.length + ' time' +
      (week.length === 1 ? '' : 's') + (acc != null ? ', getting ' + acc + ' out of every hundred right' : '') + '.');
  } else if (quiet != null && quiet > 0) {
    lines.push(name + ' last practised ' + quiet + ' day' + (quiet === 1 ? '' : 's') + ' ago.');
  }
  var certs = d.comp.length;
  if (certs) lines.push(name + ' has earned ' + certs + ' certificate' + (certs === 1 ? '' : 's') + ' so far.');

  var passed = {};
  d.tests.filter(function (t) { return t.passed && t.level_code === code; })
         .forEach(function (t) { passed[t.test_no] = true; });
  var np = Object.keys(passed).length;
  if (np) lines.push(np + ' of the 2 tests for this level ' + (np === 1 ? 'is' : 'are') + ' passed.');

  return { lines: lines, name: name, lvl: lvl, levelName: levelName, through: through,
           week: week.length, acc: acc, quiet: quiet, code: code, prog: prog, passed: np };
}

/* What this child has done in one programme, and — the part Megha
   asked for — WHICH METHODS need work, so a parent can say "practise
   your combination sums" rather than "do some maths". */
function programmeCard(pr) {
  var d = DATA, prog = pr.program_code || 'abacus';
  var lvl = pr.current_level != null ? pr.current_level : 0;
  var code = (prog === 'vedic' ? 'VL' : 'L') + lvl;
  var name = LEVELNAMES[prog + '|' + code] || '';
  var p = d.pos.filter(function (x) { return x.level_code === code; })[0];
  var through = p ? Math.round(Number(p.position) * 100) : null;

  /* Results: practice and worksheets, in this programme. */
  var mySess = d.sess.filter(function (s) {
    return (s.program_code || 'abacus') === prog;
  });
  var practice = mySess.filter(function (s) { return s.topic !== 'worksheet'; });
  var att = mySess.reduce(function (a, s) {
    return a + (s.questions_attempted || s.questions_total || 0); }, 0);
  var cor = mySess.reduce(function (a, s) { return a + (s.questions_correct || 0); }, 0);
  var acc = att ? Math.round(cor / att * 100) : null;

  var myWs = d.ws.filter(function (w) { return (w.program_code || 'abacus') === prog; });
  var wsAtt = myWs.reduce(function (a, w) { return a + (w.total || 0); }, 0);
  var wsCor = myWs.reduce(function (a, w) { return a + (w.score || 0); }, 0);
  var wsAcc = wsAtt ? Math.round(wsCor / wsAtt * 100) : null;

  /* Which methods are strong and which need practice, from the
     worksheets themselves: each one was set on a concept. Only said
     when there is enough to be fair about — two worksheets is not
     evidence. */
  var byConcept = {};
  myWs.forEach(function (w) {
    if (!w.concept || !w.total) return;
    var k = byConcept[w.concept] = byConcept[w.concept] || { score: 0, total: 0, sheets: 0 };
    k.score += w.score || 0; k.total += w.total; k.sheets++;
  });
  var insights = Object.keys(byConcept).map(function (k) {
    var v = byConcept[k];
    return { name: prettyConcept(k), pct: Math.round(v.score / v.total * 100), sheets: v.sheets };
  }).filter(function (x) { return x.sheets >= 2; }).sort(function (a, b) { return a.pct - b.pct; });

  var passed = {};
  d.tests.filter(function (t) { return t.passed && t.level_code === code; })
         .forEach(function (t) { passed[t.test_no] = true; });
  var np = Object.keys(passed).length;
  var certs = d.comp.filter(function (x) {
    return (prog === 'vedic') === /^VL/.test(String(x.level_code || '')); }).length;

  return '<div class="card">' +
    '<h2>' + (prog === 'vedic' ? '\u0950 Vedic Maths' : '\uD83E\uDDEE Abacus') + '</h2>' +
    '<div style="font-size:1.2rem;font-weight:900;">Level ' + lvl +
      (name ? ' \u00b7 ' + esc(name) : '') + '</div>' +
    '<div class="ring" style="margin-top:10px;">' +
      '<span class="track" style="background:var(--line);"><i style="width:' +
        (through == null ? 4 : Math.max(4, through)) + '%;background:var(--teal);"></i></span>' +
      '<span class="pct" style="color:var(--teal);">' +
        (through == null ? '' : through + '%') + '</span></div>' +
    '<div class="quiet" style="margin-top:4px;">' +
      (through == null ? 'Just started this level'
        : through < 25 ? 'Near the beginning of this level'
        : through < 55 ? 'Working through this level'
        : through < 80 ? 'Well into this level'
        : 'Close to finishing this level') + '</div>' +

    /* results */
    '<div class="strip" style="margin-top:14px;">' +
      '<div class="stat"><div class="n">' + practice.length + '</div>' +
        '<div class="k">practices</div></div>' +
      '<div class="stat"><div class="n' + (acc == null ? '' : acc >= 80 ? ' good' : acc >= 60 ? '' : ' warn') +
        '">' + (acc == null ? '\u2014' : acc + '%') + '</div><div class="k">practice right</div></div>' +
      '<div class="stat"><div class="n' + (wsAcc == null ? '' : wsAcc >= 80 ? ' good' : wsAcc >= 60 ? '' : ' warn') +
        '">' + (wsAcc == null ? '\u2014' : wsAcc + '%') + '</div><div class="k">' +
        myWs.length + ' worksheets</div></div>' +
    '</div>' +

    /* method insights */
    (insights.length
      ? '<div style="margin-top:14px;">' +
          '<div class="quiet" style="font-weight:800;color:var(--t2);">Where the practice is needed</div>' +
          insights.slice(0, 4).map(function (x) {
            var tone = x.pct >= 85 ? 'var(--good)' : x.pct >= 65 ? 'var(--warn)' : 'var(--bad)';
            return '<div style="display:flex;align-items:center;gap:9px;padding:6px 0;font-size:.88rem;">' +
              '<span style="flex:1;">' + esc(x.name) + '</span>' +
              '<span style="width:90px;height:8px;border-radius:5px;background:var(--line);overflow:hidden;">' +
                '<i style="display:block;height:100%;width:' + x.pct + '%;background:' + tone + ';"></i></span>' +
              '<span style="font-weight:900;color:' + tone + ';min-width:38px;text-align:right;">' +
                x.pct + '%</span></div>';
          }).join('') +
          '<div class="quiet" style="margin-top:4px;">Lowest first \u2014 that is the one to practise.</div>' +
        '</div>'
      : '<div class="quiet" style="margin-top:12px;">Once there are a few more worksheets, ' +
        'this will show which methods need practice.</div>') +

    /* level and certificate */
    '<div class="quiet" style="margin-top:12px;">' +
      (np ? np + ' of the 2 tests for Level ' + lvl + ' passed. ' : 'No test sat for Level ' + lvl + ' yet. ') +
      certs + ' certificate' + (certs === 1 ? '' : 's') + ' earned.' +
    '</div>' +
  '</div>';
}

/* Her concept codes, in words a parent would use. */
function prettyConcept(code) {
  var c = String(code || '').toLowerCase().replace(/_/g, ' ');
  var map = { 'big friends':'Big Friends', 'small friends':'Small Friends',
    'combination':'Combination', 'direct add':'Straight adding', 'direct sub':'Straight taking away',
    'multiplication':'Multiplication', 'division':'Division', 'decimals':'Decimals',
    'negative':'Negative numbers', 'anzan':'Mental maths', 'counting':'Counting',
    'number recog':'Reading numbers', 'add sub':'Adding and taking away' };
  if (map[c]) return map[c];
  if (typeof Sutras !== 'undefined' && Sutras.METHODS[code]) return Sutras.METHODS[code].label;
  return c.replace(/^./, function (x) { return x.toUpperCase(); });
}

function draw() {
  var s = summary();
  var d = DATA;

  /* ── how they are doing ── */
  var h = '<div class="card hero">' +
    '<h2>How ' + esc(s.name) + ' is doing</h2>' +
    '<div class="name">Level ' + s.lvl + (s.levelName ? ' \u00b7 ' + esc(s.levelName) : '') + '</div>' +
    '<div class="line">' + esc(s.lines[0].replace(/^[^,]*is on [^,]*, ?/, '').replace(/^and is /, '')
      .replace(/^./, function (c) { return c.toUpperCase(); })) + '</div>' +
    '<div class="ring"><span class="track"><i style="width:' +
      (s.through == null ? 4 : Math.max(4, s.through)) + '%"></i></span>' +
      '<span class="pct">' + (s.through == null ? '' : s.through + '%') + '</span></div>' +
    '<div style="display:flex;gap:8px;margin-top:14px;">' +
      '<button class="listen" style="margin:0;" onclick="listen(\'en\')">&#128266; Listen</button>' +
      '<button class="listen" style="margin:0;" onclick="listen(\'hi\')">&#128266; \u0939\u093F\u0902\u0926\u0940</button>' +
    '</div>' +
    '<div id="saidIn" class="quiet" style="color:rgba(255,255,255,.85);margin-top:8px;min-height:1.2em;"></div>' +
  '</div>';

  /* ── this week ── */
  h += '<div class="strip">' +
    '<div class="stat"><div class="n' + (s.week >= 3 ? ' good' : s.week ? '' : ' warn') + '">' +
      s.week + '</div><div class="k">practices this week</div></div>' +
    '<div class="stat"><div class="n' + (s.acc == null ? '' : s.acc >= 80 ? ' good' : s.acc >= 60 ? '' : ' warn') +
      '">' + (s.acc == null ? '\u2014' : s.acc + '%') + '</div><div class="k">right this week</div></div>' +
    '<div class="stat"><div class="n">' + d.comp.length + '</div><div class="k">certificates</div></div>' +
  '</div>';

  /* ── one card per programme ─────────────────────────────────
     A child may learn both, and the two are separate courses with
     separate levels and certificates. One card each, rather than one
     mixed picture. */
  h += DATA.progs.map(function (pr) { return programmeCard(pr); }).join('');

  /* ── the journey ── */
  var done = {};
  d.comp.forEach(function (c) { done[String(c.level_code).replace(/^V?L/, '')] = true; });
  h += '<div class="card"><h2>' + esc(s.name) + '\u2019s journey</h2><div class="track2">' +
    [0,1,2,3,4,5,6,7,8].map(function (n) {
      var cls = done[String(n)] ? 'done' : (n === s.lvl ? 'here' : '');
      return '<div class="stop ' + cls + '"><div class="dot">' +
        (done[String(n)] ? '\u2713' : n) + '</div>' +
        '<div class="lb">' + (n === s.lvl ? 'here now' :
          (LEVELNAMES['abacus|L' + n] || 'Level ' + n).split(' ')[0]) + '</div></div>';
    }).join('') +
  '</div>' +
  '<div class="quiet" style="margin-top:8px;">A level ends with two passed tests and a certificate. ' +
    (s.passed ? esc(s.name) + ' has passed ' + s.passed + ' of the 2 for Level ' + s.lvl + '.'
              : 'No test sat for Level ' + s.lvl + ' yet.') + '</div></div>';

  /* "How you can help" removed at Megha's request: a parent wants to
     know where their child stands, and the teacher gives the advice. */

  /* ── fees, one line per programme ────────────────────────────
     A family may pay for Abacus and Vedic separately, so one status
     for the child would be wrong for one of them. */
  var subs = DATA.subs || [];
  var progList = DATA.progs.length ? DATA.progs : [{ program_code: 'abacus' }];
  h += '<div class="card"><h2>Fees</h2>' +
    progList.map(function (pr) {
      var prog = pr.program_code || 'abacus';
      var mine = subs.filter(function (s) {
        return (s.program_code || 'abacus') === prog;
      });
      /* No programme recorded on a subscription means the older single
         subscription, which covered Abacus. */
      if (!mine.length && prog === 'abacus') {
        mine = subs.filter(function (s) { return !s.program_code; });
      }
      var sub = mine[0] || null;
      var until = sub && sub.expires_at ? new Date(sub.expires_at) : null;
      var live = until ? until > new Date() : false;
      var left = until ? Math.ceil((until - Date.now()) / 86400000) : null;
      return '<div class="money" style="padding:8px 0;border-bottom:1px solid var(--line);">' +
        '<span class="st"><b>' + (prog === 'vedic' ? '\u0950 Vedic Maths' : '\uD83E\uDDEE Abacus') + '</b>' +
          '<span>' + (sub
            ? (live ? 'Paid to ' + fmt(sub.expires_at) +
                      (left != null && left <= 14 ? ' \u2014 ' + left + ' day' +
                        (left === 1 ? '' : 's') + ' left' : '')
                    : 'Ended ' + fmt(sub.expires_at))
            : 'Not started') + '</span></span>' +
        '<span class="pill ' + (!sub ? 'off' : live ? (left <= 14 ? 'due' : 'ok') : 'off') + '">' +
          (!sub ? 'none' : live ? (left <= 14 ? 'renew soon' : 'active') : 'expired') + '</span>' +
      '</div>';
    }).join('') +
    '<a class="go" href="payments.html">Fees, payments and receipts</a></div>';

  /* ── the awards ── */
  h += '<div class="card"><h2>Certificates</h2>' +
    '<div class="quiet">' + (d.comp.length
      ? esc(s.name) + ' has ' + d.comp.length + ', every one kept. Download any of them as a PDF, or print it.'
      : 'None yet. One comes with each level finished.') + '</div>' +
    '<a class="go ghost" href="certificates.html">Open certificates</a></div>';

  document.getElementById('body').innerHTML = h;
}

/* Read the progress out, in English or Hindi. Slower than before —
   Megha said it was too fast to follow — and short, because a parent
   wants the gist, not everything on the screen.

   If the device has no Hindi voice, that is said rather than quietly
   speaking English instead. */
function spokenSummary(lang) {
  var s = summary(), d = DATA;
  var name = s.name;
  if (lang === 'hi') {
    var out = [];
    out.push(name + ' \u0905\u092D\u0940 \u0932\u0947\u0935\u0932 ' + s.lvl +
      ' \u092E\u0947\u0902 \u0939\u0948\u0902\u0964');
    out.push(s.through == null
      ? '\u092F\u0939 \u0932\u0947\u0935\u0932 \u0905\u092C\u0940 \u0936\u0941\u0930\u0942 \u0939\u0941\u0906 \u0939\u0948\u0964'
      : '\u0932\u0947\u0935\u0932 \u0915\u093E ' + s.through +
        ' \u092A\u094D\u0930\u0924\u093F\u0936\u0924 \u092A\u0942\u0930\u093E \u0939\u094B \u0917\u092F\u093E \u0939\u0948\u0964');
    if (s.week) {
      out.push('\u0907\u0938 \u0939\u092B\u094D\u0924\u0947 ' + s.week +
        ' \u092C\u093E\u0930 \u0905\u092D\u094D\u092F\u093E\u0938 \u0915\u093F\u092F\u093E' +
        (s.acc != null ? ', \u0914\u0930 ' + s.acc +
          ' \u092A\u094D\u0930\u0924\u093F\u0936\u0924 \u0938\u0939\u0940 \u0939\u0941\u0906' : '') + '\u0964');
    } else if (s.quiet != null && s.quiet > 0) {
      out.push(s.quiet + ' \u0926\u093F\u0928 \u0938\u0947 \u0905\u092D\u094D\u092F\u093E\u0938 ' +
        '\u0928\u0939\u0940\u0902 \u0939\u0941\u0906 \u0939\u0948\u0964');
    }
    if (d.comp.length) {
      out.push(d.comp.length + ' \u092A\u094D\u0930\u092E\u093E\u0923\u092A\u0924\u094D\u0930 ' +
        '\u092E\u093F\u0932 \u091A\u0941\u0915\u0947 \u0939\u0948\u0902\u0964');
    }
    return out.join(' ');
  }
  /* English: the first three lines only — the gist. */
  return s.lines.slice(0, 3).join(' ');
}

function listen(lang) {
  var said = document.getElementById('saidIn');
  if (typeof Speech === 'undefined') return;
  try { Speech.unlock(); } catch (e) {}
  Speech.stop();

  if (lang === 'hi' && Speech.canSpeak && !Speech.canSpeak('hi')) {
    if (said) said.textContent = 'This device has no Hindi voice installed, so Hindi cannot be spoken here.';
    return;
  }
  /* Slower than a normal reading: this is a summary a parent is
     listening to once, not a sentence they can re-read. */
  var res = Speech.say(spokenSummary(lang), {
    raw: true, lang: lang === 'hi' ? 'hi-IN' : 'en-IN',
    rate: lang === 'hi' ? 0.82 : 0.84
  });
  if (said) said.textContent = res && res.voice ? 'Speaking\u2026' : 'Speaking\u2026';
}

start().catch(function (e) {
  document.getElementById('body').innerHTML = '<div class="err">Could not load: ' + esc(e.message) + '</div>';
});
</script>
</body>
</html>
