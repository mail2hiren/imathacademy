<!DOCTYPE html>
<html lang="en">
<head>

<title>Vedic Maths plan &mdash; tap to review</title>

<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--teal:#04949D;--soft:#E7F6F7;--ink:#04616a;--orange:#E67D21;
        --green:#2E7D32;--red:#C62828;
        --t1:#1F2430;--t2:#4A5160;--t3:#8892A4;--line:#E6E9F0;}
  body{font-family:'Nunito',sans-serif;background:#F5F7FC;color:var(--t1);
       line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:84px;}

  .top{background:#fff;border-bottom:1.5px solid var(--line);padding:11px 15px;
       position:sticky;top:0;z-index:20;}
  .top h1{font-size:1.02rem;font-weight:900;}
  .top p{font-size:.78rem;color:var(--t3);margin-top:1px;}

  .strip{display:flex;gap:5px;overflow-x:auto;padding:9px 14px;background:#fff;
         border-bottom:1.5px solid var(--line);position:sticky;top:58px;z-index:19;
         -webkit-overflow-scrolling:touch;}
  .lvbtn{flex:0 0 auto;min-width:56px;padding:7px 9px;border:1.5px solid var(--line);
         border-radius:10px;background:#fff;font-family:inherit;cursor:pointer;text-align:center;}
  .lvbtn.on{border-color:var(--teal);background:var(--soft);}
  .lvbtn .n{font-size:.88rem;font-weight:900;color:var(--ink);}
  .lvbtn .c{font-size:.62rem;color:var(--t3);font-weight:800;}
  .lvbtn .tick{font-size:.6rem;font-weight:900;color:var(--green);}

  .wrap{max-width:720px;margin:0 auto;padding:14px;}

  .lvhead{background:linear-gradient(135deg,var(--teal),#40A9A2);border-radius:15px;
          padding:16px 17px;color:#fff;}
  .lvhead .k{font-size:.66rem;font-weight:900;letter-spacing:1pt;opacity:.9;}
  .lvhead h2{font-size:1.24rem;font-weight:900;margin-top:2px;}
  .lvhead .f{font-size:.85rem;opacity:.95;margin-top:4px;}
  .lvhead .o{font-size:.8rem;opacity:.9;margin-top:8px;
             border-top:1px solid rgba(255,255,255,.28);padding-top:8px;}

  .cat{font-size:.66rem;font-weight:900;letter-spacing:.9pt;color:var(--t3);
       text-transform:uppercase;margin:16px 0 6px;}

  .m{background:#fff;border:1.5px solid var(--line);border-radius:12px;
     padding:12px 13px;margin-bottom:8px;}
  .m.keep{border-color:#A5D6A7;background:#F7FBF8;}
  .m.move{border-color:#FFCC80;background:#FFFCF7;}
  .m.drop{border-color:#EEE;background:#FAFAFA;opacity:.5;}
  .m h3{font-size:.95rem;font-weight:900;}
  .m .skt{font-size:.72rem;color:var(--t3);font-style:italic;}
  .m .scope{font-size:.84rem;color:var(--t2);margin-top:4px;}
  .m .scope b{color:var(--ink);}
  .m .prev{font-size:.72rem;color:var(--t3);margin-top:3px;}

  .row{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap;}
  .b{padding:6px 11px;border:1.5px solid var(--line);border-radius:8px;background:#fff;
     font-family:inherit;font-size:.75rem;font-weight:800;color:var(--t2);cursor:pointer;}
  .b.on-keep{background:#E8F5E9;border-color:#A5D6A7;color:#1B5E20;}
  .b.on-move{background:#FFF3E0;border-color:#FFCC80;color:#8a4b00;}
  .b.on-drop{background:#FDECEA;border-color:#FFCDD2;color:#B71C1C;}
  .moveto{display:none;gap:4px;margin-top:7px;flex-wrap:wrap;}
  .moveto.show{display:flex;}

  .carried{background:#F7F9FF;border-radius:11px;padding:11px 13px;margin-top:12px;}
  .carried h3{font-size:.66rem;font-weight:900;letter-spacing:.9pt;color:var(--t3);
              text-transform:uppercase;}
  .carried .c{font-size:.82rem;color:var(--t2);margin-top:4px;}
  .carried .c b{color:var(--t1);}

  .set{background:#fff;border:1.5px solid var(--line);border-radius:12px;
       padding:14px;margin-top:12px;}
  .set h3{font-size:.66rem;font-weight:900;letter-spacing:.9pt;color:var(--t3);
          text-transform:uppercase;margin-bottom:8px;}
  .q{font-size:.85rem;font-weight:800;margin-top:11px;}
  .q:first-of-type{margin-top:0;}

  .note{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;
        font-family:inherit;font-size:.86rem;min-height:46px;margin-top:10px;}

  .nav{display:flex;gap:8px;margin-top:16px;}
  .nav button{flex:1;padding:12px;border:none;border-radius:11px;background:var(--teal);
              color:#fff;font-family:inherit;font-size:.9rem;font-weight:900;cursor:pointer;}
  .nav button.ghost{background:#fff;color:var(--t2);border:1.5px solid var(--line);}

  #bar{position:fixed;left:0;right:0;bottom:0;background:#fff;
       border-top:1.5px solid var(--line);padding:10px 15px;z-index:20;
       display:flex;align-items:center;gap:11px;}
  #bar .txt{font-size:.78rem;font-weight:800;color:var(--t3);white-space:nowrap;}
  #bar .prog{height:6px;background:var(--line);border-radius:4px;flex:1;overflow:hidden;}
  #bar .prog i{display:block;height:100%;background:var(--green);width:0;transition:width .25s;}
</style>
</head>

/* One key per level AND method, because the same method appears at
   several levels with different scope. Confirming x 11 at Level 2
   should not mark x 111 at Level 4 as done. */
function vkey(L, id) { return L + ':' + id; }

function counts() {
  var total = 0, done = 0;
  PLAN.levels.forEach(function (l) {
    l.intro.forEach(function (m) {
      total++;
      if (state.verdicts[vkey(l.n, m.id)]) done++;
    });
  });
  return { done: done, total: total };
}

function drawStrip() {
  document.getElementById('strip').innerHTML = PLAN.levels.map(function (l) {
    var d = l.intro.filter(function (m) { return state.verdicts[vkey(l.n, m.id)]; }).length;
    var all = l.intro.length;
    var tick = (all && d === all) ? '&#10003;' : (d ? d + '/' + all : '&nbsp;');

      '<div class="c">' + all + '</div>' +
      '<div class="tick">' + tick + '</div></button>';
  }).join('');
}

  l.intro.forEach(function (m) { (byCat[m.cat] = byCat[m.cat] || []).push(m); });
  var order = ['Addition','Subtraction','Number work','Multiplication','Division',
               'Squares','Cubes','Roots','Number theory','Percentages'];
  order.filter(function (c) { return byCat[c]; }).forEach(function (cat) {
    html += '<div class="cat">' + esc(cat) + '</div>';
    html += byCat[cat].map(function (m) {
      var k = vkey(l.n, m.id);
      var v = state.verdicts[k];
      var again = m.firstSeen < l.n;
      return '<div class="m' + (v ? ' ' + v : '') + '">' +
        '<h3>' + esc(m.name) + '</h3>' +
        (m.sanskrit ? '<div class="skt">' + esc(m.sanskrit) + '</div>' : '') +
        '<div class="scope">At this level: <b>' + esc(m.scope) + '</b></div>' +
        (again ? '<div class="prev">Carried on from Level ' + m.firstSeen + '</div>' : '') +
        '<div class="row">' +
          '<button class="b' + (v==='keep'?' on-keep':'') +
            '" onclick="mark(\'' + k + '\',\'keep\')">&#10003; Right</button>' +
          '<button class="b' + (v==='move'?' on-move':'') +
            '" onclick="mark(\'' + k + '\',\'move\')">&#8646; Different level</button>' +
          '<button class="b' + (v==='drop'?' on-drop':'') +
            '" onclick="mark(\'' + k + '\',\'drop\')">&#10005; Not here</button>' +
        '</div>' +
        '<div class="moveto' + (v==='move'?' show':'') + '" id="mv-' + k.replace(':','_') + '">' +
          [1,2,3,4,5,6,7,8].map(function (n) {
            return '<button class="b' + (state.moveTo[k]===n?' on-move':'') +
              '" onclick="moveTo(\'' + k + '\',' + n + ')">L' + n + '</button>';
          }).join('') +
        '</div>' +
      '</div>';
    }).join('');
  });

  if (l.carried.length) {
    html += '<div class="carried"><h3>Also practised at this level</h3><div class="c">' +
      l.carried.map(function (m) {
        return '<b>' + esc(m.name) + '</b> &mdash; ' + esc(m.scope);
      }).join('<br>') + '</div></div>';
  }

  html += '<div class="set"><h3>How this level runs</h3>';
  SETTINGS.forEach(function (s) {
    var cur = (state.settings[at] || {})[s.key] || s.suggest;
    html += '<div class="q">' + esc(s.q) + '</div><div class="row">' +
      s.opts.map(function (o) {
        return '<button class="b' + (cur===o?' on-keep':'') +
          '" onclick="setOpt(\'' + s.key + '\',\'' + o + '\')">' + esc(o) + '</button>';
      }).join('') + '</div>';
  });
  html += '</div>';

  html += '<textarea class="note" placeholder="Anything missing from this level? (optional)" ' +
    'oninput="setNote(this.value)">' + esc(state.notes[at] || '') + '</textarea>';

  html += '<div class="nav">' +
    (at > 1 ? '<button class="ghost" onclick="go(' + (at-1) + ')">&larr; L' + (at-1) + '</button>' : '') +
    (at < 8 ? '<button onclick="go(' + (at+1) + ')">Level ' + (at+1) + ' &rarr;</button>'
            : '<button onclick="finish()">Done</button>') + '</div>';

  document.getElementById('level').innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function mark(k, v) {
  state.verdicts[k] = v;
  if (v !== 'move') delete state.moveTo[k];
  save(); drawStrip(); drawLevel(); bar();
}
function moveTo(k, n) { state.moveTo[k] = n; save(); drawLevel(); }
function setOpt(key, v) {
  state.settings[at] = state.settings[at] || {};
  state.settings[at][key] = v; save(); drawLevel();
}
function setNote(v) { state.notes[at] = v; save(); }
function go(n) { at = n; drawStrip(); drawLevel(); }

function bar() {
  var c = counts();
  document.getElementById('barTxt').textContent = c.done + ' of ' + c.total + ' confirmed';
  document.getElementById('barFill').style.width =
    (c.total ? Math.round(c.done / c.total * 100) : 0) + '%';
}

function finish() {
  var c = counts();
  document.getElementById('level').innerHTML =
    '<div style="text-align:center;padding:38px 18px;">' +
      '<div style="font-size:2.6rem;">&#10003;</div>' +
      '<h2 style="font-size:1.24rem;font-weight:900;margin-top:9px;">Thank you</h2>' +
      '<p style="color:var(--t2);margin-top:7px;">' + c.done + ' of ' + c.total +
      ' confirmed. Everything is saved, and you can change any of it later.</p>' +
      '<button onclick="go(1)" style="margin-top:16px;padding:11px 20px;border:none;' +
      'border-radius:11px;background:var(--teal);color:#fff;font-family:inherit;' +
      'font-weight:900;cursor:pointer;">Back to Level 1</button></div>';
}

function save() { try { Draft.save('plan', 'vedic41', state); } catch (e) {} }

(async function () {
  try {
    var d = await Draft.load('plan', 'vedic41');
    if (d) state = Object.assign(state, d);
  } catch (e) {}
  drawStrip(); drawLevel(); bar();
})();
</script>
</body>
</html>
