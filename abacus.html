<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>iMathAcademy — Virtual Abacus</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Baloo+2:wght@800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#1A1A2E;font-family:'Nunito',sans-serif;color:#fff;overflow:hidden;}
body{display:flex;flex-direction:column;}

.topbar{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;background:#111827;flex-shrink:0;}
.logo{font-family:'Baloo 2',sans-serif;font-size:1rem;font-weight:900;}
.logo em{color:#90CAF9;font-style:normal;}
.val-box{text-align:center;}
.val-lbl{font-size:.58rem;font-weight:800;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.5px;}
.val-num{font-family:'Baloo 2',sans-serif;font-size:1.5rem;font-weight:900;color:#FFD54F;min-width:90px;text-align:center;line-height:1.1;}
.icon-btns{display:flex;gap:6px;}
.ibtn{width:34px;height:34px;border-radius:8px;border:none;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;font-size:1rem;}

.rod-sel{display:flex;align-items:center;justify-content:center;gap:6px;padding:5px 14px;background:#111827;border-top:1px solid rgba(255,255,255,.06);flex-shrink:0;}
.rsl{font-size:.65rem;font-weight:800;color:rgba(255,255,255,.3);}
.rbtn{padding:3px 12px;border-radius:20px;border:1.5px solid rgba(255,255,255,.18);background:transparent;color:rgba(255,255,255,.4);font-family:inherit;font-size:.7rem;font-weight:800;cursor:pointer;}
.rbtn.on{background:#1565C0;border-color:#1565C0;color:#fff;}

.modes{display:flex;gap:6px;padding:5px 14px;background:#111827;border-top:1px solid rgba(255,255,255,.06);flex-shrink:0;}
.mbtn{flex:1;padding:7px 4px;border-radius:8px;border:1.5px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:rgba(255,255,255,.55);font-family:inherit;font-size:.7rem;font-weight:800;cursor:pointer;text-align:center;}
.mbtn.on{background:#1565C0;border-color:#1565C0;color:#fff;}

.qcard{margin:5px 12px;border-radius:9px;padding:8px 12px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.1);flex-shrink:0;display:none;}
.qcard.show{display:block;}
.qlbl{font-size:.58rem;font-weight:900;text-transform:uppercase;letter-spacing:.4px;color:rgba(255,255,255,.38);margin-bottom:1px;}
.qnum{font-family:'Baloo 2',sans-serif;font-size:1.25rem;font-weight:900;color:#FFD54F;}
.qfb{font-size:.75rem;font-weight:800;margin-top:4px;padding:4px 8px;border-radius:6px;display:none;}
.qfb.ok{background:rgba(46,125,50,.35);color:#81C784;display:block;}
.qfb.no{background:rgba(183,28,28,.35);color:#EF9A9A;display:block;}

.abacus-area{flex-shrink:0;padding:8px 10px;}
.abacus-frame{border-radius:12px;overflow:hidden;background:#3E2723;border:3px solid #5D4037;display:flex;flex-direction:column;}
.ab-top{height:9px;background:#5D4037;flex-shrink:0;}
.ab-mid{display:flex;}
.ab-bot{height:9px;background:#5D4037;flex-shrink:0;}

.spacer{flex:1;}

.rod-col{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;padding:0 1px;}
.rod-stick{position:absolute;top:0;bottom:0;width:3px;border-radius:2px;left:50%;transform:translateX(-50%);opacity:.4;z-index:0;}

/* Heaven and earth sections — fixed height, flex column */
.h-area{
  display:flex;flex-direction:column;align-items:center;
  justify-content:flex-end; /* beads stack from bottom = near divider */
  padding:4px 0 2px;
  gap:3px;
  flex-shrink:0;
}
.e-area{
  display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start; /* beads stack from top = near divider */
  padding:2px 0 4px;
  gap:3px;
  flex-shrink:0;
}

.divbar{height:5px;background:#5D4037;width:100%;flex-shrink:0;z-index:5;position:relative;}
.divbar::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:5px;height:5px;background:#3E2723;border-radius:50%;}

/* BEAD — oval shaped, fully visible */
.bead{
  flex-shrink:0;
  border-radius:40%;
  position:relative;z-index:3;
  cursor:pointer;
  transition:transform .12s cubic-bezier(.34,1.4,.64,1);
}
.bead::after{
  content:'';position:absolute;
  top:16%;left:18%;width:28%;height:22%;
  border-radius:50%;background:rgba(255,255,255,.45);
}
.bead:active{transform:scale(.85);}

/* GHOST — same size as bead but dashed outline only */
.ghost{
  flex-shrink:0;
  border-radius:40%;
  border:1.5px dashed rgba(255,255,255,.25);
  background:transparent;
  cursor:pointer;
  z-index:2;
}

.controls{display:flex;gap:8px;padding:6px 14px;background:#111827;border-top:1px solid rgba(255,255,255,.06);flex-shrink:0;}
.cbtn{flex:1;padding:9px 4px;border-radius:9px;border:1.5px solid rgba(255,255,255,.13);background:rgba(255,255,255,.07);color:#fff;font-family:inherit;font-size:.73rem;font-weight:800;cursor:pointer;text-align:center;}
.cbtn.p{background:#1565C0;border-color:#1565C0;}

.celeb{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:200;}
.celeb.show{display:flex;}
.celeb-box{background:#111827;border:2px solid #FFD54F;border-radius:18px;padding:26px 20px;text-align:center;max-width:260px;width:86%;}
.c-icon{font-size:2.8rem;margin-bottom:6px;}
.c-title{font-family:'Baloo 2',sans-serif;font-size:1.3rem;font-weight:900;color:#FFD54F;margin-bottom:5px;}
.c-sub{font-size:.8rem;color:rgba(255,255,255,.65);margin-bottom:12px;line-height:1.5;}
.c-btn{width:100%;padding:10px;background:#1565C0;color:#fff;border:none;border-radius:9px;font-family:inherit;font-size:.88rem;font-weight:900;cursor:pointer;}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">🧮 iMath<em>Academy</em></div>
  <div class="val-box">
    <div class="val-lbl">Value</div>
    <div class="val-num" id="vd">0</div>
  </div>
  <div class="icon-btns">
    <button class="ibtn" id="sndBtn" onclick="toggleSound()">🔊</button>
    <button class="ibtn" onclick="clearAll()">↺</button>
  </div>
</div>

<div class="rod-sel">
  <span class="rsl">Rods:</span>
  <button class="rbtn on" onclick="setRods(7,this)">7</button>
  <button class="rbtn" onclick="setRods(9,this)">9</button>
  <button class="rbtn" onclick="setRods(13,this)">13</button>
  <button class="rbtn" onclick="setRods(17,this)">17</button>
</div>

<div class="modes">
  <button class="mbtn on" onclick="setMode('free',this)">🎯 Free</button>
  <button class="mbtn" onclick="setMode('practice',this)">📝 Practice</button>
  <button class="mbtn" onclick="setMode('challenge',this)">⚡ Challenge</button>
</div>

<div class="qcard" id="qcard">
  <div class="qlbl" id="qlbl">Set this number</div>
  <div class="qnum" id="qnum">—</div>
  <div class="qfb" id="qfb"></div>
</div>

<div class="abacus-area" id="abacusArea">
  <div class="abacus-frame">
    <div class="ab-top"></div>
    <div class="ab-mid" id="abMid"></div>
    <div class="ab-bot"></div>
  </div>
</div>

<div class="spacer"></div>

<div class="controls">
  <button class="cbtn" id="randBtn" onclick="randomNum()">🎲 Random</button>
  <button class="cbtn p" id="chkBtn" style="display:none" onclick="checkAns()">✓ Check</button>
  <button class="cbtn" id="nxtBtn" style="display:none" onclick="nextQ()">Next →</button>
</div>

<div class="celeb" id="celeb">
  <div class="celeb-box">
    <div class="c-icon">🎉</div>
    <div class="c-title">Correct!</div>
    <div class="c-sub" id="cSub">Well done!</div>
    <button class="c-btn" onclick="nextQ()">Next question →</button>
  </div>
</div>

<script>
var COLORS=[
  {rod:'#F44336',g:'radial-gradient(ellipse at 35% 30%,#FF8A80,#F44336 60%,#B71C1C)',b:'#B71C1C',glow:'rgba(244,67,54,.5)'},
  {rod:'#FF8F00',g:'radial-gradient(ellipse at 35% 30%,#FFE082,#FF8F00 60%,#E65100)',b:'#E65100',glow:'rgba(255,143,0,.5)'},
  {rod:'#FDD835',g:'radial-gradient(ellipse at 35% 30%,#FFFF8D,#FDD835 60%,#F57F17)',b:'#F57F17',glow:'rgba(253,216,53,.5)'},
  {rod:'#43A047',g:'radial-gradient(ellipse at 35% 30%,#B9F6CA,#43A047 60%,#1B5E20)',b:'#1B5E20',glow:'rgba(67,160,71,.5)'},
  {rod:'#1E88E5',g:'radial-gradient(ellipse at 35% 30%,#82B1FF,#1E88E5 60%,#0D47A1)',b:'#0D47A1',glow:'rgba(30,136,229,.5)'},
  {rod:'#8E24AA',g:'radial-gradient(ellipse at 35% 30%,#EA80FC,#8E24AA 60%,#4A148C)',b:'#4A148C',glow:'rgba(142,36,170,.5)'},
];

var N=7, state=[], mode='free', soundOn=true, target=null;
var score={c:0,t:0}, chalTimer=null, chalSec=0, practIdx=0;
var audioCtx=null;

// Fixed bead dimensions
var BW=30; // bead width
var BH=18; // bead height (oval)
var GAP=3; // gap between items

function getAudio(){if(!audioCtx)try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}return audioCtx;}
function beep(f){if(!soundOn)return;var ctx=getAudio();if(!ctx)return;var o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=f;g.gain.setValueAtTime(.08,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.07);o.start();o.stop(ctx.currentTime+.07);}
function playWin(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){beep(f);},i*90);});}

function initState(){state=[];for(var i=0;i<N;i++)state.push({h:0,e:0});}
function getVal(){var t=0;for(var i=0;i<N;i++)t+=(state[i].h*5+state[i].e)*Math.pow(10,N-1-i);return t;}

function setRods(n,btn){
  N=n;
  document.querySelectorAll('.rbtn').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  initState(); build(); updateVal();
}

// Create a coloured bead element
function mkBead(ci, w, h){
  var el=document.createElement('div');
  el.className='bead';
  el.style.width=w+'px';
  el.style.height=h+'px';
  el.style.background=COLORS[ci].g;
  el.style.border='1.5px solid '+COLORS[ci].b;
  el.style.boxShadow='0 2px 6px '+COLORS[ci].glow;
  return el;
}

// Create a ghost (empty) slot
function mkGhost(w, h){
  var el=document.createElement('div');
  el.className='ghost';
  el.style.width=w+'px';
  el.style.height=h+'px';
  return el;
}

function build(){
  var mid=document.getElementById('abMid');
  mid.innerHTML='';

  // Calculate bead width to fit number of rods
  var areaW=document.getElementById('abacusArea').offsetWidth||320;
  var bw=Math.min(BW, Math.floor((areaW-20)/N)-4);
  bw=Math.max(bw,12);
  var bh=Math.round(bw*0.62);
  var gap=3;

  // Section heights:
  // Heaven: 1 bead + 1 ghost + 1 gap + top/bot padding = bh+bh+gap+4+4
  // Earth:  4 beads/ghosts + 3 gaps + top/bot padding = 4*bh+3*gap+4+4
  var hH=2*bh+gap+8;
  var eH=4*bh+3*gap+8;
  mid.style.height=(hH+5+eH)+'px'; // heaven + divider + earth

  for(var vi=0;vi<N;vi++){
    var di=N-1-vi; // data index: 0=ones=rightmost
    var ci=vi%COLORS.length;
    var rod=state[di];

    var colEl=document.createElement('div');
    colEl.className='rod-col';
    colEl.style.height=(hH+5+eH)+'px';

    // Rod line
    var stick=document.createElement('div');
    stick.className='rod-stick';
    stick.style.background=COLORS[ci].rod;
    colEl.appendChild(stick);

    // ── HEAVEN AREA ─────────────────────────────────────────
    // 1 heaven bead + 1 ghost slot
    // ACTIVE (value=1): ghost on TOP, bead on BOTTOM (touching divider)
    // INACTIVE (value=0): bead on TOP, ghost on BOTTOM (touching divider)
    var ha=document.createElement('div');
    ha.className='h-area';
    ha.style.height=hH+'px';
    ha.style.gap=gap+'px';

    var hb=mkBead(ci,bw,bh);
    hb.dataset.di=di;
    hb.onclick=function(e){e.stopPropagation();tapH(+this.dataset.di);};
    hb.ontouchend=function(e){e.preventDefault();tapH(+this.dataset.di);};

    var hg=mkGhost(bw,bh);
    hg.dataset.di=di;
    hg.onclick=function(e){e.stopPropagation();tapH(+this.dataset.di);};
    hg.ontouchend=function(e){e.preventDefault();tapH(+this.dataset.di);};

    if(rod.h===1){
      // Active: ghost top, bead bottom (near divider)
      ha.appendChild(hg);
      ha.appendChild(hb);
    } else {
      // Inactive: bead top, ghost bottom (near divider)
      ha.appendChild(hb);
      ha.appendChild(hg);
    }
    colEl.appendChild(ha);

    // ── DIVIDER ─────────────────────────────────────────────
    var dv=document.createElement('div');
    dv.className='divbar';
    colEl.appendChild(dv);

    // ── EARTH AREA ──────────────────────────────────────────
    // 4 slots: rod.e = how many are ACTIVE (touching divider = top of earth area)
    //
    // rod.e=0: all 4 ghosts (none active)
    //   [ghost][ghost][ghost][ghost]
    //
    // rod.e=1: 1 bead at top, 3 ghosts below
    //   [bead][ghost][ghost][ghost]
    //
    // rod.e=2: 2 beads at top, 2 ghosts below
    //   [bead][bead][ghost][ghost]
    //
    // rod.e=3: 3 beads, 1 ghost
    //   [bead][bead][bead][ghost]
    //
    // rod.e=4: all 4 beads
    //   [bead][bead][bead][bead]
    //
    // Tapping a BEAD at position i: deactivates it → rod.e = i
    // Tapping a GHOST at position i: activates up to i → rod.e = i+1

    var ea=document.createElement('div');
    ea.className='e-area';
    ea.style.height=eH+'px';
    ea.style.gap=gap+'px';

    for(var slot=0;slot<4;slot++){
      if(slot<rod.e){
        // Active bead
        var eb=mkBead(ci,bw,bh);
        (function(d,s){
          eb.dataset.di=d;
          eb.onclick=function(e){e.stopPropagation();tapE(+this.dataset.di,s);};
          eb.ontouchend=function(e){e.preventDefault();tapE(+this.dataset.di,s);};
        })(di,slot);
        ea.appendChild(eb);
      } else {
        // Ghost slot
        var eg=mkGhost(bw,bh);
        (function(d,s){
          eg.dataset.di=d;
          eg.onclick=function(e){e.stopPropagation();tapE(+this.dataset.di,s);};
          eg.ontouchend=function(e){e.preventDefault();tapE(+this.dataset.di,s);};
        })(di,slot);
        ea.appendChild(eg);
      }
    }

    colEl.appendChild(ea);
    mid.appendChild(colEl);
  }
}

// HEAVEN: toggle between 0 and 1
function tapH(di){
  state[di].h=state[di].h?0:1;
  beep(900); build(); updateVal();
}

// EARTH:
// Tap bead at slot s → rod.e becomes s (deactivate s and above)
// Tap ghost at slot s → rod.e becomes s+1 (activate 0 through s)
function tapE(di, slot){
  if(slot < state[di].e){
    state[di].e = slot;      // deactivate: keep 0..(slot-1)
  } else {
    state[di].e = slot + 1;  // activate: set 0..slot as active
  }
  beep(650); build(); updateVal();
}

function updateVal(){
  var v=getVal();
  var el=document.getElementById('vd');
  el.textContent=v===0?'0':v.toLocaleString('en-IN');
  el.style.color=v===0?'rgba(255,255,255,.2)':'#FFD54F';
}

function clearAll(silent){
  initState(); build(); updateVal();
  if(!silent) document.getElementById('qfb').className='qfb';
}

function randomNum(){
  var mx=Math.pow(10,N)-1;
  setNum(Math.floor(Math.random()*mx)+1);
}

function setNum(n){
  initState();
  var rem=Math.floor(n);
  for(var vi=0;vi<N;vi++){
    var di=N-1-vi;
    var pl=Math.pow(10,N-1-vi);
    var dg=Math.floor(rem/pl); rem-=dg*pl;
    state[di].h=dg>=5?1:0;
    state[di].e=dg>=5?dg-5:dg;
  }
  build(); updateVal();
}

function toggleSound(){
  soundOn=!soundOn;
  document.getElementById('sndBtn').textContent=soundOn?'🔊':'🔇';
  getAudio();
}

function setMode(m,btn){
  mode=m;
  document.querySelectorAll('.mbtn').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  var qc=document.getElementById('qcard');
  var chk=document.getElementById('chkBtn');
  var nxt=document.getElementById('nxtBtn');
  var rnd=document.getElementById('randBtn');
  if(m==='free'){
    qc.classList.remove('show');
    chk.style.display='none'; nxt.style.display='none'; rnd.style.display='';
    if(chalTimer){clearInterval(chalTimer);chalTimer=null;}
  } else {
    qc.classList.add('show');
    chk.style.display=''; nxt.style.display='none'; rnd.style.display='none';
    score={c:0,t:0}; nextQ();
  }
  clearAll(true);
}

var PLIST=[3,5,7,8,9,12,23,45,67,89,123,456,789,999,1234,5678,9999,12345,56789];
function nextQ(){
  document.getElementById('celeb').classList.remove('show');
  document.getElementById('qfb').className='qfb';
  document.getElementById('chkBtn').style.display='';
  document.getElementById('nxtBtn').style.display='none';
  var mx=Math.pow(10,N)-1;
  if(mode==='practice'){
    var fl=PLIST.filter(function(x){return x<=mx;});
    target=fl[practIdx%fl.length]; practIdx++;
    document.getElementById('qlbl').textContent='Set this number on the abacus';
  } else {
    target=Math.floor(Math.random()*Math.min(mx,9999))+1;
    chalSec=0;
    if(chalTimer)clearInterval(chalTimer);
    chalTimer=setInterval(function(){chalSec++;document.getElementById('qlbl').textContent='⚡ Time: '+chalSec+'s';},1000);
    document.getElementById('qlbl').textContent='⚡ Time: 0s';
  }
  document.getElementById('qnum').textContent=(target||0).toLocaleString('en-IN');
  clearAll(true);
}

function checkAns(){
  var v=getVal(), fb=document.getElementById('qfb');
  if(v===target){
    if(chalTimer){clearInterval(chalTimer);chalTimer=null;}
    score.c++; score.t++; playWin();
    document.getElementById('cSub').textContent=
      (target||0).toLocaleString('en-IN')+' — correct! '+
      (mode==='challenge'?'Time: '+chalSec+'s. ':'')+
      'Score: '+score.c+'/'+score.t;
    document.getElementById('celeb').classList.add('show');
    document.getElementById('chkBtn').style.display='none';
    document.getElementById('nxtBtn').style.display='';
  } else {
    score.t++;
    fb.textContent='✗ You set '+v.toLocaleString('en-IN')+
      ' — answer is '+(target||0).toLocaleString('en-IN')+'. Try again!';
    fb.className='qfb no';
  }
}

// Start
initState();
setTimeout(function(){ build(); updateVal(); }, 30);
window.addEventListener('resize', function(){ build(); });
</script>
</body>
</html>
