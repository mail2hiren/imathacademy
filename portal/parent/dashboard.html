<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <title>Parent Dashboard — iMathAcademy</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Nunito', sans-serif; background: #F7F8FF; color: #1A1A2E; min-height: 100vh; }
    :root {
      --green: #43A047; --green-dk: #1B5E20; --green-lt: #E8F5E9;
      --blue: #1E88E5; --blue-dk: #0D47A1; --blue-lt: #E3F2FD;
      --orange: #FB8C00; --orange-dk: #E65100; --orange-lt: #FFF3E0;
      --purple: #8E24AA; --purple-lt: #F3E5F5; --purple-dk: #4A148C;
      --red: #E53935; --red-lt: #FFEBEE;
      --yellow: #F9A825; --yellow-lt: #FFFDE7;
      --pink: #E91E8C; --pink-lt: #FCE4EC; --pink-dk: #880E4F;
      --bg: #fff; --bg2: #F7F8FF; --border: #E8EAF6;
      --text: #1A1A2E; --text2: #4A4A6A; --text3: #9090B0;
      --bottom-nav-h: 64px;
    }

    /* ── LAYOUT ── */
    .portal { display: flex; min-height: 100vh; }
    .sidebar { width: 220px; flex-shrink: 0; background: var(--bg); border-right: 2px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; height: 100vh; z-index: 300; overflow-y: auto; }
    .logo { padding: 18px 16px; border-bottom: 2px solid var(--border); font-family: 'Baloo 2', sans-serif; font-size: 1.1rem; font-weight: 800; color: var(--green-dk); display: flex; align-items: center; gap: 10px; }
    .logo-icon { width: 34px; height: 34px; background: var(--green); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
    .logo span { color: var(--orange-dk); }
    nav { flex: 1; padding: 10px 0; }
    .nav-sec { font-size: .65rem; font-weight: 800; text-transform: uppercase; letter-spacing: .8px; color: var(--text3); padding: 8px 16px 2px; margin-top: 4px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; font-size: .875rem; font-weight: 700; color: var(--text2); cursor: pointer; border-left: 3px solid transparent; transition: all .12s; text-decoration: none; }
    .nav-item:hover { background: var(--bg2); }
    .nav-item.active { color: var(--blue-dk); background: var(--blue-lt); border-left-color: var(--blue); }
    .nav-icon { width: 22px; text-align: center; font-size: 1.1rem; }
    .sidebar-user { padding: 12px 16px; border-top: 2px solid var(--border); display: flex; align-items: center; gap: 10px; }
    .av { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: .8rem; font-weight: 800; flex-shrink: 0; background: var(--pink-lt); color: var(--pink-dk); border: 2px solid var(--pink); }
    .sidebar-name { font-size: .82rem; font-weight: 800; }
    .sidebar-role { font-size: .7rem; color: var(--text3); }
    .logout-btn { margin-left: auto; background: none; border: none; cursor: pointer; color: var(--text3); min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 1rem; }
    .main { flex: 1; margin-left: 220px; }
    .topbar { height: 56px; background: var(--bg); border-bottom: 2px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: sticky; top: 0; z-index: 50; }
    .topbar-title { font-family: 'Baloo 2', sans-serif; font-size: 1rem; font-weight: 800; }
    .content { padding: 16px; }

    /* ── BOTTOM NAV (mobile) ── */
    .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; height: var(--bottom-nav-h); background: var(--bg); border-top: 2px solid var(--border); z-index: 200; }
    .bottom-nav-inner { display: flex; height: 100%; }
    .bnav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; text-decoration: none; border: none; background: none; padding: 4px 0; min-height: 44px; touch-action: manipulation; }
    .bnav-icon { font-size: 1.3rem; }
    .bnav-label { font-size: .62rem; font-weight: 700; color: var(--text3); font-family: 'Nunito', sans-serif; }
    .bnav-item.active .bnav-label { color: var(--blue-dk); }

    /* ── CHILD SELECTOR ── */
    .child-selector { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .child-chip { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border: 2px solid var(--border); border-radius: 14px; cursor: pointer; transition: all .12s; touch-action: manipulation; background: var(--bg); }
    .child-chip.active { border-color: var(--blue); background: var(--blue-lt); }
    .child-av { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: .9rem; font-weight: 800; flex-shrink: 0; }
    .child-name { font-size: .875rem; font-weight: 800; }
    .child-level { font-size: .72rem; color: var(--text2); margin-top: 1px; }

    /* ── SECTION TITLE ── */
    .sec-title { font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; color: var(--text3); margin-bottom: 10px; }

    /* ── CARDS ── */
    .card { background: var(--bg); border: 2px solid var(--border); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }

    /* ── MOTIVATIONAL BANNER ── */
    .journey-banner { border-radius: 18px; padding: 18px; margin-bottom: 12px; color: #fff; position: relative; overflow: hidden; }
    .journey-banner::before { content:''; position:absolute; top:-20px; right:-20px; width:100px; height:100px; border-radius:50%; background:rgba(255,255,255,.07); }
    .journey-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
    .journey-text h2 { font-size: 1rem; font-weight: 800; margin-bottom: 4px; }
    .journey-text p  { font-size: .78rem; opacity: .85; line-height: 1.6; }
    .journey-pct { background: rgba(255,255,255,.15); border: 1.5px solid rgba(255,255,255,.3); border-radius: 12px; padding: 10px 14px; text-align: center; flex-shrink: 0; }
    .journey-pct-num { font-size: 1.4rem; font-weight: 800; }
    .journey-pct-lbl { font-size: .65rem; opacity: .8; }
    .journey-bar-wrap { }
    .journey-bar-labels { display: flex; justify-content: space-between; font-size: .68rem; opacity: .8; margin-bottom: 4px; }
    .journey-bar { height: 8px; background: rgba(255,255,255,.2); border-radius: 20px; overflow: hidden; }
    .journey-bar-fill { height: 100%; border-radius: 20px; background: linear-gradient(90deg,#FFD600,#FF6F00); transition: width .5s ease; }

    /* ── TODAY'S SNAPSHOT ── */
    .snapshot-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .snap-box { background: var(--bg); border: 2px solid var(--border); border-radius: 12px; padding: 10px; text-align: center; }
    .snap-num { font-size: 1.3rem; font-weight: 800; }
    .snap-lbl { font-size: .65rem; color: var(--text3); font-weight: 600; margin-top: 2px; }

    /* ── PLAIN ENGLISH SUMMARY ── */
    .summary-box { border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
    .summary-title { font-size: .78rem; font-weight: 800; margin-bottom: 5px; }
    .summary-text  { font-size: .82rem; line-height: 1.7; }

    /* ── CONVERSATION STARTERS ── */
    .conv-box { border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
    .conv-title { font-size: .78rem; font-weight: 800; margin-bottom: 8px; }
    .conv-item { font-size: .82rem; line-height: 1.7; display: flex; gap: 8px; }

    /* ── 12-WEEK CALENDAR ── */
    .weeks-grid { display: grid; grid-template-columns: repeat(6,1fr); gap: 6px; margin-bottom: 12px; }
    .week-box { text-align: center; padding: 8px 4px; border-radius: 10px; border: 2px solid var(--border); }
    .week-box.done    { background: var(--green-lt); border-color: var(--green); }
    .week-box.current { background: var(--blue-lt);  border-color: var(--blue); border-width: 2px; }
    .week-box.locked  { background: var(--bg2); opacity: .5; }
    .week-box.milestone { background: var(--yellow-lt); border-color: var(--yellow); }
    .week-num  { font-size: .75rem; font-weight: 800; }
    .week-icon { font-size: .75rem; margin-top: 2px; }

    /* ── CONCEPT MILESTONES ── */
    .concept-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .concept-item:last-child { border-bottom: none; }
    .concept-icon { font-size: 1rem; width: 20px; text-align: center; flex-shrink: 0; }
    .concept-info { flex: 1; }
    .concept-name { font-size: .875rem; font-weight: 700; }
    .concept-sub  { font-size: .72rem; color: var(--text2); margin-top: 2px; }
    .concept-bar-wrap { flex: 2; height: 5px; background: var(--border); border-radius: 20px; overflow: hidden; }
    .concept-bar-fill { height: 100%; border-radius: 20px; }
    .concept-pct { font-size: .72rem; font-weight: 800; width: 32px; text-align: right; }
    .concept-pill { font-size: .65rem; font-weight: 800; padding: 2px 8px; border-radius: 20px; white-space: nowrap; }

    /* ── BADGES ── */
    .badges-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .badges-scroll::-webkit-scrollbar { display: none; }
    .badge-item { flex-shrink: 0; text-align: center; padding: 10px; border-radius: 12px; border: 2px solid var(--border); background: var(--bg); min-width: 70px; }
    .badge-item.earned { border-color: var(--yellow); background: var(--yellow-lt); }
    .badge-item.locked { opacity: .35; }
    .badge-emoji { font-size: 1.5rem; }
    .badge-name  { font-size: .65rem; font-weight: 700; margin-top: 4px; color: var(--text2); }
    .badge-date  { font-size: .6rem; color: var(--text3); margin-top: 2px; }

    /* ── ACTION TIPS ── */
    .tip-item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .tip-item:last-child { border-bottom: none; }
    .tip-icon { font-size: 1.2rem; flex-shrink: 0; width: 24px; text-align: center; }
    .tip-title { font-size: .875rem; font-weight: 700; margin-bottom: 3px; }
    .tip-desc  { font-size: .78rem; color: var(--text2); line-height: 1.6; }

    /* ── UPCOMING MILESTONES ── */
    .milestone-item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
    .milestone-item:last-child { border-bottom: none; }
    .milestone-icon { font-size: 1rem; width: 20px; text-align: center; flex-shrink: 0; }
    .milestone-text { flex: 1; font-size: .82rem; }
    .milestone-when { font-size: .72rem; font-weight: 800; white-space: nowrap; }

    /* ── HOW IT WORKS (explainer) ── */
    .explainer-step { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; background: var(--bg2); border-radius: 12px; border: 1px solid var(--border); margin-bottom: 8px; }
    .step-num { background: var(--blue); color: #fff; font-size: .78rem; font-weight: 800; padding: 3px 10px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; margin-top: 1px; }
    .step-title { font-size: .875rem; font-weight: 700; margin-bottom: 3px; }
    .step-desc  { font-size: .78rem; color: var(--text2); line-height: 1.6; }

    /* ── TABS ── */
    .tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 16px; padding-bottom: 2px; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn { padding: 7px 16px; border-radius: 20px; border: 2px solid var(--border); background: var(--bg); font-size: .82rem; font-weight: 700; cursor: pointer; white-space: nowrap; touch-action: manipulation; transition: all .12s; font-family: 'Nunito', sans-serif; }
    .tab-btn.active { background: var(--blue-lt); border-color: var(--blue); color: var(--blue-dk); }

    /* ── LOADER ── */
    .loader { text-align: center; padding: 60px 20px; color: var(--text3); }
    .spinner { width: 36px; height: 36px; border: 4px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to{transform:rotate(360deg)} }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { margin-left: 0; padding-bottom: var(--bottom-nav-h); }
      .topbar { height: 52px; padding: 0 14px; }
      .content { padding: 12px; }
      .bottom-nav { display: block; }
      .snapshot-grid { grid-template-columns: 1fr 1fr; }
      .weeks-grid { grid-template-columns: repeat(4,1fr); }
      .journey-pct-num { font-size: 1.2rem; }
    }
    @media (max-width: 360px) {
      .snapshot-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
    }
  
    /* ── MOBILE SIDEBAR ── */
    .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;}
    .sidebar-overlay.show{display:block;}
    @media(max-width:768px){
      .hamburger-mobile{display:flex!important;}
      .sidebar{transform:translateX(-100%);transition:transform .25s ease;z-index:300;}
      .sidebar.open{transform:translateX(0);box-shadow:4px 0 24px rgba(0,0,0,.18);}
      .main,.content-wrap,.body{margin-left:0!important;}
    }
    @media(min-width:769px){
      .sidebar{transform:translateX(0)!important;}
      .sidebar-overlay{display:none!important;}
      .hamburger-mobile{display:none!important;}
    }
    
    /* ── LANGUAGE SELECTOR ── */
    .lang-bar {
      display: flex; align-items: center; gap: 6px;
      padding: 10px 14px; background: #fff;
      border-bottom: 2px solid var(--border);
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      position: sticky; top: 56px; z-index: 40;
    }
    .lang-bar::-webkit-scrollbar { display: none; }
    .lang-label { font-size: .7rem; font-weight: 800;
      color: var(--text3); text-transform: uppercase;
      letter-spacing: .5px; flex-shrink: 0; }
    .lang-btn {
      padding: 6px 14px; border-radius: 20px;
      border: 2px solid var(--border);
      background: #fff; font-size: .82rem; font-weight: 800;
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
      font-family: inherit; transition: all .12s;
      color: var(--text2);
    }
    .lang-btn.active {
      background: var(--blue); color: #fff;
      border-color: var(--blue);
    }

    /* ── VOICE CARD ── */
    .voice-card {
      background: linear-gradient(135deg, #1565C0, #6A1B9A);
      border-radius: 20px; padding: 20px;
      margin-bottom: 14px; color: #fff;
      box-shadow: 0 4px 20px rgba(21,101,192,.25);
    }
    .voice-greeting {
      font-size: 1rem; font-weight: 700;
      opacity: .85; margin-bottom: 6px;
    }
    .voice-summary {
      font-size: 1.05rem; font-weight: 800;
      line-height: 1.6; margin-bottom: 16px;
    }
    .voice-btn {
      display: flex; align-items: center; gap: 10px;
      background: #fff; color: #1565C0;
      border: none; border-radius: 50px;
      padding: 12px 24px; font-family: inherit;
      font-size: 1rem; font-weight: 900;
      cursor: pointer; width: 100%;
      justify-content: center;
      transition: transform .1s, box-shadow .1s;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    .voice-btn:active { transform: scale(.97); }
    .voice-btn.speaking {
      background: #FF6F00; color: #fff;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 2px 8px rgba(255,111,0,.4); }
      50% { box-shadow: 0 4px 20px rgba(255,111,0,.7); }
    }
    .voice-icon { font-size: 1.4rem; }

    /* ── STAT CARDS ── */
    .stat-row {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px; margin-bottom: 14px;
    }
    .stat-card {
      background: #fff; border-radius: 16px;
      border: 2px solid var(--border);
      padding: 16px 14px; text-align: center;
    }
    .stat-icon { font-size: 2rem; margin-bottom: 4px; }
    .stat-val {
      font-size: 1.6rem; font-weight: 900;
      font-family: 'Baloo 2', sans-serif;
      line-height: 1;
    }
    .stat-lbl {
      font-size: .72rem; font-weight: 800;
      color: var(--text3); margin-top: 4px;
      text-transform: uppercase; letter-spacing: .3px;
    }

    /* ── PROGRESS BAR CARD ── */
    .progress-card {
      background: #fff; border-radius: 16px;
      border: 2px solid var(--border);
      padding: 16px; margin-bottom: 14px;
    }
    .progress-header {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 10px;
    }
    .progress-title {
      font-size: .875rem; font-weight: 800;
    }
    .progress-pct {
      font-size: 1.1rem; font-weight: 900;
      color: var(--blue);
    }
    .prog-bar {
      height: 12px; background: var(--border);
      border-radius: 20px; overflow: hidden;
      margin-bottom: 6px;
    }
    .prog-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #1565C0, #6A1B9A);
      border-radius: 20px; transition: width .6s ease;
    }
    .prog-labels {
      display: flex; justify-content: space-between;
      font-size: .68rem; color: var(--text3); font-weight: 700;
    }

    /* ── HOMEWORK ALERT ── */
    .hw-alert {
      background: #FFF3E0; border: 2px solid #FFB300;
      border-radius: 16px; padding: 14px 16px;
      margin-bottom: 14px;
      display: flex; align-items: center; gap: 12px;
    }
    .hw-alert-icon { font-size: 2rem; flex-shrink: 0; }
    .hw-alert-text { font-size: .875rem; font-weight: 800; color: #E65100; }
    .hw-alert-sub { font-size: .78rem; color: #BF360C; margin-top: 2px; }

    /* ── TIPS ── */
    .tip-card {
      background: #fff; border-radius: 14px;
      border: 2px solid var(--border);
      padding: 14px; margin-bottom: 10px;
      display: flex; gap: 12px; align-items: flex-start;
    }
    .tip-emoji { font-size: 1.6rem; flex-shrink: 0; margin-top: 2px; }
    .tip-heading { font-size: .875rem; font-weight: 800; margin-bottom: 3px; }
    .tip-body { font-size: .78rem; color: var(--text2); line-height: 1.6; }

    /* ── CONVERSATION STARTERS ── */
    .conv-card {
      background: #E8F5E9; border: 2px solid #43A047;
      border-radius: 16px; padding: 14px 16px;
      margin-bottom: 14px;
    }
    .conv-title {
      font-size: .78rem; font-weight: 900;
      color: #1B5E20; text-transform: uppercase;
      letter-spacing: .4px; margin-bottom: 10px;
    }
    .conv-item {
      background: #fff; border-radius: 10px;
      padding: 10px 12px; margin-bottom: 8px;
      font-size: .875rem; font-weight: 700;
      color: #1B5E20; line-height: 1.5;
    }
    .conv-item:last-child { margin-bottom: 0; }

    /* ── SECTION TITLE ── */
    .sec-hdr {
      font-size: .7rem; font-weight: 900;
      text-transform: uppercase; letter-spacing: .6px;
      color: var(--text3); margin: 16px 0 8px;
    }

    /* Box sizing */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { overflow-x: hidden; }

  </style>
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<div class="portal">

  <!-- Sidebar (desktop) -->
  <aside class="sidebar">
    <div class="logo"><img src="../../assets/logo.png" alt="iMathAcademy" style="height:32px;width:auto;object-fit:contain;"></div>
    <nav>
      <div class="nav-sec">My children</div>
      <a class="nav-item active" href="#"><span class="nav-icon">🏠</span> Dashboard</a>
      <div class="nav-sec">Account</div>
      <a class="nav-item" href="#"><span class="nav-icon">💳</span> Subscription</a>
    </nav>
    <div class="sidebar-user">
      <div class="av" id="sidebarAv">P</div>
      <div>
        <div class="sidebar-name" id="sidebarName">Parent</div>
        <div class="sidebar-role">Parent account</div>
      </div>
      <button class="logout-btn" onclick="logout()">⇥</button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <a href="dashboard.html" style="display:flex;align-items:center;flex-shrink:0;text-decoration:none;"><img src="../../assets/logo.png" alt="iMathAcademy" style="height:36px;width:auto;object-fit:contain;"></a>
    <div class="topbar-title" id="topbarTitle">Parent Dashboard</div>
      <button class="logout-btn" onclick="logout()" id="mobileLogout" style="display:none;">⇥</button>
    </div>

    <!-- Language bar -->
    <div class="lang-bar" id="langBar"></div>

    <div class="content" id="mainContent">
      <div class="loader"><div class="spinner"></div>Loading your children's progress...</div>
    </div>
  </div>
</div>

<!-- Bottom nav (mobile) -->
<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <a class="bnav-item active" href="#">
      <span class="bnav-icon">🏠</span><span class="bnav-label">Home</span>
    </a>
    <a class="bnav-item" href="#how">
      <span class="bnav-icon">❓</span><span class="bnav-label">How it works</span>

function initials(name) { return (name||'P').split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2); }
function fmt(date) { return date ? new Date(date).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) : '—'; }
function fmtShort(date) { return date ? new Date(date).toLocaleDateString('en-IN',{day:'numeric',month:'short'}) : '—'; }

function getGroupLabel(p) {

function levelGroup(lv) { return lv<=1?'tiny':lv<=4?'rising':'champions'; }

function getWeeksInLevel(enrollDate) {
  if (!enrollDate) return { week: 1, total: 12, pct: 8 };
  const diff = new Date() - new Date(enrollDate);
  const weeks = Math.max(1, Math.min(12, Math.ceil(diff / (7*24*3600*1000))));
  return { week: weeks, total: 12, pct: Math.round(weeks/12*100) };
}

function buildWeeklySummary(child, stats, journey, practiceToday) {
  const name = child.full_name.split(' ')[0];
  const streak = child.streak_days || 0;
  const xp = stats.weeklyXP || 0;
  const puzzles = stats.puzzlesSolved || 0;
  let msg = `${name} `;
  if (practiceToday) msg += 'has already practised today — great consistency! ';
  else msg += 'has not yet practised today — a gentle nudge would help. ';
  msg += `${streak > 0 ? `${streak}-day login streak is going strong. ` : 'The streak was broken recently — encourage a daily habit. '}`;
  msg += `${xp > 0 ? `Earned ${xp} XP this week. ` : ''}`;
  msg += `${puzzles > 0 ? `Solved ${puzzles} puzzle${puzzles>1?'s':''} — that means getting 5 correct in a row ${puzzles} time${puzzles>1?'s':''}!` : ''}`;
  return msg;
}

    ],
  };
  return (bases[group] || bases.rising).slice(0, 3);
}

function buildActionTips(child, stats, journey, group) {
  const name = child.full_name.split(' ')[0];
  const streak = child.streak_days || 0;
  const tips = [
    {
      icon: '📅',
      title: `Remind ${name} to login${streak > 0 ? ' today' : ' and restart the streak'}`,
      desc: streak > 0
        ? `${name} is on a ${streak}-day streak. Just ask "Did you do your maths today?" — frame it as "your badge is waiting!" not a chore.`
        : `The streak was broken recently. Help ${name} restart — even 5 minutes of practice counts and gets the streak going again.`,
    },
    {
      icon: group === 'tiny' ? '🐘' : '🧩',
      title: `Ask to see the ${group==='tiny'?'maze puzzle':'Sudoku'} ${name} solved`,
      desc: `Let ${name} explain it to you. Teaching reinforces learning and kids feel proud when parents show genuine interest. Ask "How did you solve it?"`,
    },
    {
      icon: '🎯',
      title: `Celebrate the streak tonight`,
      desc: `If ${name} has a streak going, mention it at dinner — "I saw you have a ${streak}-day streak, that is amazing!" It costs nothing and means everything.`,
    },
    {
      icon: '🧮',
      title: `Quick maths game in the car or at dinner`,
      desc: group === 'tiny'
        ? `Ask "${name}, what is 3 + 4?" Use simple numbers from Level ${child.current_level}. Make it fun — not a test. Clap and celebrate every right answer!`
        : `Ask "${name}, what is 47 + 28 — can you do it in your head?" Level ${child.current_level} students can handle this. Let them take their time.`,
    },
  ];
  return tips;
}

function buildMilestones(child, stats, journey, streak, badges) {
  const earnedKeys = new Set(badges.map(b=>b.badge_type||b.key));
  const ms = [];
  if (streak < 5 && !earnedKeys.has('streak_5')) ms.push({ icon:'🔥', text:`5-day streak badge — ${Math.max(0,5-streak)} more day${5-streak!==1?'s':''} to go`, when:`${5-streak}d` });
  else if (streak < 7 && !earnedKeys.has('streak_7')) ms.push({ icon:'🥇', text:`7-day legend badge — ${7-streak} more day${7-streak!==1?'s':''} to go`, when:`${7-streak}d` });
  if (!earnedKeys.has('puzzle_pro')) ms.push({ icon:'🧩', text:`Puzzle pro badge — solve ${Math.max(0,5-(stats.puzzlesSolved||0))} more puzzles`, when:'~1 week' });
  ms.push({ icon:'🎓', text:`Level ${(child.current_level||1)+1} unlocks after Week 12!`, when:`~${12-journey.week}w` });
  return ms.slice(0,4);
}

// ── LOAD CHILD STATS ─────────────────────────────────────────
async function loadChildStats(childId) {
  const stats = { badges:[], weeklyXP:0, practiceToday:false, puzzlesSolved:0, homeworkPending:0 };
  try {
    // Badges
    const { data: badges } = await sb.from('badges').select('*').eq('student_id', childId).order('earned_at',{ascending:false});
    stats.badges = badges || [];

    // Weekly XP from practice sessions
    const weekStart = new Date(); weekStart.setDate(weekStart.getDate()-weekStart.getDay()); weekStart.setHours(0,0,0,0);
    const { data: ws } = await sb.from('practice_sessions').select('xp_awarded').eq('student_id', childId).gte('created_at', weekStart.toISOString());
    stats.weeklyXP = (ws||[]).reduce((s,r)=>s+(r.xp_awarded||0),0);

    // Practice today
    const todayStart = new Date(); todayStart.setHours(0,0,0,0);
    const { data: ts } = await sb.from('practice_sessions').select('id').eq('student_id', childId).gte('created_at', todayStart.toISOString()).limit(1);
    stats.practiceToday = (ts?.length||0)>0;

    // Puzzles solved
    const { data: ps } = await sb.from('practice_sessions').select('id').eq('student_id', childId).eq('topic','puzzle');
    stats.puzzlesSolved = ps?.length || 0;

    // Homework pending = lx_worksheets not yet submitted
    const { data: batches } = await sb.from('batch_students').select('batch_id').eq('student_id', childId);
    if(batches?.length) {
      const { data: wsResp } = await sb.from('worksheet_responses').select('worksheet_id').eq('student_id', childId);
      const doneIds = new Set((wsResp||[]).map(r=>r.worksheet_id));
      const batchIds = batches.map(b=>b.batch_id);
      const { data: allWs } = await sb.from('lx_worksheets').select('id').eq('is_active',true)
        .or('student_id.eq.'+childId+',batch_id.in.('+batchIds.join(',')+')');
      stats.homeworkPending = (allWs||[]).filter(w=>!doneIds.has(w.id)).length;
    }
  } catch(e) { console.error('loadChildStats error:', e); }

  // Load teacher parent notes from worksheets
  try {
    const { data: batchLinks } = await sb.from('batch_students').select('batch_id').eq('student_id', childId);
    const batchIds = (batchLinks||[]).map(b => b.batch_id);
    if (batchIds.length) {
      const oneWeekAgo = new Date(); oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);
      const { data: notes } = await sb.from('lx_worksheets')
        .select('title, parent_note, created_at')
        .or(`student_id.eq.${childId},batch_id.in.(${batchIds.join(',')})`)
        .not('parent_note', 'is', null)
        .gte('created_at', oneWeekAgo.toISOString())
        .order('created_at', { ascending: false })
        .limit(3);
      stats.parentNotes = (notes||[]).filter(n => n.parent_note?.trim());
    }
  } catch(e) {}

  return stats;
}

// ── INIT ─────────────────────────────────────────────────────
async function init() {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href='../../login.html'; return; }

    const { data: profile } = await sb.from('users').select('*').eq('id', session.user.id).single();
    if (!profile || profile.role !== 'parent') { window.location.href='../../login.html'; return; }
    parentProfile = profile;

    // Sidebar
    document.getElementById('sidebarAv').textContent   = initials(profile.full_name);
    document.getElementById('sidebarName').textContent = profile.full_name;
    if (window.innerWidth <= 768) document.getElementById('mobileLogout').style.display='flex';

    // Load linked children
    const { data: links } = await sb.from('parent_student').select('student_id, users!student_id(*)').eq('parent_id', session.user.id);
    children = (links||[]).map(l=>l.users).filter(Boolean);

    if (!children.length) {
      document.getElementById('mainContent').innerHTML = `
        <div style="text-align:center;padding:40px 20px;color:var(--text3);">
          <div style="font-size:3rem;margin-bottom:12px;">👶</div>
          <div style="font-size:1rem;font-weight:800;color:var(--text);margin-bottom:6px;">No children linked yet</div>
          <div style="font-size:.875rem;">Ask the academy admin to link your child to your account.</div>
        </div>`;
      return;
    }

    activeChild = children[0];
    const stats = await loadChildStats(activeChild.id);
    window._activeChild = activeChild;
    window._activeStats = stats;
    renderDashboard(activeChild, stats);
    renderLangBar();
    renderVoiceCard(activeChild, stats);
    renderStatCards(activeChild, stats);
    renderConvStarters(activeChild, stats);
    renderHomeworkAlert(activeChild, stats);
    renderTips(activeChild, stats);

  } catch(err) {
    document.getElementById('mainContent').innerHTML = `<div style="padding:40px;text-align:center;color:var(--red);">Error: ${err.message} <a href="../../login.html">Login again</a></div>`;
  }
}

function getBestVoice(langCode) {
  var available = speechSynth.getVoices();

  // User-selected voice override
  var overrides = JSON.parse(localStorage.getItem('voiceOverrides') || '{}');
  if (overrides[currentLang]) {
    var ov = available.find(function(v){ return v.name === overrides[currentLang]; });
    if (ov) { console.log('Override:', ov.name); return {voice:ov, usedCode:ov.lang}; }
  }

  // Keyword matching — covers iOS naming quirks
  var LANG_KEYWORDS = {
    'gu-IN': ['gujarati','gu-in','gu_in','gu'],
    'mr-IN': ['marathi','mr-in','mr_in','mr'],
    'hi-IN': ['hindi','lekha','hi-in','hi_in'],
    'ta-IN': ['tamil','ta-in','ta_in','ta'],
    'te-IN': ['telugu','te-in','te_in','te'],
    'en-IN': ['rishi','veena','en-in','english (india)'],
  };
  var FALLBACKS = {
    'gu-IN': ['gu-IN','hi-IN','en-IN'],
    'mr-IN': ['mr-IN','hi-IN','en-IN'],
    'hi-IN': ['hi-IN','en-IN'],
    'ta-IN': ['ta-IN','en-IN'],
    'te-IN': ['te-IN','hi-IN','en-IN'],
    'en-IN': ['en-IN','en-US','en-GB'],
  };

  var keywords = LANG_KEYWORDS[langCode] || [];
  // Try keyword match
  for (var ki=0; ki<keywords.length; ki++) {
    var kw = keywords[ki];
    var found = available.find(function(v) {
      return v.name.toLowerCase().indexOf(kw) > -1 ||
             v.lang.toLowerCase() === kw ||
             v.lang.toLowerCase().replace('-','_') === kw;
    });
    if (found) { console.log('Keyword match:', found.name, found.lang); return {voice:found, usedCode:found.lang}; }
  }

  // Fallback chain
  var fallbacks = FALLBACKS[langCode] || [langCode,'en-IN'];
  for (var fi=0; fi<fallbacks.length; fi++) {
    var code = fallbacks[fi];
    var v2 = available.find(function(v){ return v.lang === code; });
    if (!v2) v2 = available.find(function(v){ return v.lang.startsWith(code.split('-')[0]); });
    if (v2) { console.log('Fallback:', v2.name, v2.lang); return {voice:v2, usedCode:v2.lang}; }
  }

  return available.length ? {voice:available[0], usedCode:available[0].lang} : null;
}


function showVoiceNotice(langCode) {
  var info = VOICE_INSTALL[langCode];
  if (!info) return;
  var msg = info[currentLang] || info.en;
  var notice = document.getElementById('voiceNotice');
  if (!notice) {
    notice = document.createElement('div');
    notice.id = 'voiceNotice';
    notice.style.cssText = 'background:#FFF3E0;border:1.5px solid #FFB300;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:.75rem;font-weight:700;color:#E65100;line-height:1.6;';
    var vc = document.getElementById('voiceCard');
    if (vc) vc.appendChild(notice);
  }
  notice.textContent = '⚠️ ' + msg;
  notice.style.display = 'block';
  setTimeout(function() { if (notice) notice.style.display = 'none'; }, 8000);
}

function speakText(text, langCode) {
  if (!speechSynth) {
    alert('Voice is not supported on this browser. Please try Chrome or Safari.');
    return;
  }
  speechSynth.cancel();

  // Wait for voices to load (needed on some browsers)
  function doSpeak() {
    var result = getBestVoice(langCode);
    if (!result) {
      alert('No voice available on this device.');
      return;
    }

    // Notify if we had to use a fallback
    if (result.usedCode !== langCode) {
      showVoiceNotice(langCode);
    }

    var utter = new SpeechSynthesisUtterance(text);
    utter.voice = result.voice;
    utter.lang  = result.usedCode;
    utter.rate  = 0.88;
    utter.pitch = 1.0;

    var btn = document.getElementById('voicePlayBtn');
    if (btn) {
      btn.classList.add('speaking');
      btn.textContent = t('stopBtn');
    }

    utter.onend = function() {
      if (btn) {
        btn.classList.remove('speaking');
        btn.innerHTML = '<span class="voice-icon">🔊</span> ' + t('listenBtn');
      }
      currentUtterance = null;
    };
    utter.onerror = function(e) {
      console.warn('Speech error:', e);
      if (btn) {
        btn.classList.remove('speaking');
        btn.innerHTML = '<span class="voice-icon">🔊</span> ' + t('listenBtn');
      }
    };

    currentUtterance = utter;
    speechSynth.speak(utter);
  }

  // Voices may not be loaded yet on page load
  if (speechSynth.getVoices().length > 0) {
    doSpeak();
  } else {
    speechSynth.addEventListener('voiceschanged', function onVoicesLoaded() {
      speechSynth.removeEventListener('voiceschanged', onVoicesLoaded);
      doSpeak();
    });
    // Fallback if voiceschanged never fires
    setTimeout(doSpeak, 1000);
  }
}

function toggleVoice() {
  if (speechSynth.speaking) {
    stopVoice();
    return;
  }
  if (!window._activeChild || !window._activeStats) return;
  var script = buildVoiceScript(window._activeChild, window._activeStats);
  var lang = LANGS[currentLang] || LANGS.en;
  speakText(script, lang.code);
}

function stopVoice() {
  if (speechSynth) speechSynth.cancel();
  var btn = document.getElementById('voicePlayBtn');
  if (btn) {
    btn.classList.remove('speaking');
    btn.innerHTML = '<span class="voice-icon">🔊</span> ' + t('listenBtn');
  }
  currentUtterance = null;
}

function renderLangBar() {
  var bar = document.getElementById('langBar');
  if (!bar) return;
  var html = '<span class="lang-label">🌐</span>';
  Object.keys(LANGS).forEach(function(k) {
    var l = LANGS[k];
    html += '<button class="lang-btn' + (k===currentLang?' active':'') + '" data-lang="' + k + '" onclick="setLang(\'' + k + '\')">' + l.label + '</button>';
  });
  bar.innerHTML = html;
}

    '<button onclick="showVoicePicker()" style="margin-top:8px;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.3);border-radius:10px;color:#fff;font-size:.72rem;font-weight:800;padding:7px 14px;cursor:pointer;font-family:inherit;width:100%;">🎤 Choose voice for this language</button>';

// Hook into renderDashboard to populate new elements
var _origRenderDashboard = window.renderDashboard;


// ── VOICE PICKER ─────────────────────────────────────────────
function showVoicePicker() {
  var voices = speechSynth.getVoices();
  if (!voices.length) {
    setTimeout(showVoicePicker, 800);
    return;
  }

  var existing = document.getElementById('voicePickerModal');
  if (existing) { existing.remove(); return; }

  var langLabel = (LANGS[currentLang] || {}).label || currentLang;
  var overrides = JSON.parse(localStorage.getItem('voiceOverrides') || '{}');
  var currentOverride = overrides[currentLang] || '';

  var modal = document.createElement('div');
  modal.id = 'voicePickerModal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:9999;display:flex;align-items:flex-end;justify-content:center;';

  var sheet = document.createElement('div');
  sheet.style.cssText = 'background:#fff;border-radius:20px 20px 0 0;padding:20px 16px;width:100%;max-width:500px;max-height:75vh;overflow-y:auto;';

  var titleEl = document.createElement('div');
  titleEl.style.cssText = 'font-size:1rem;font-weight:900;margin-bottom:4px;color:#1A1A2E;';
  titleEl.textContent = '🎤 Choose voice for ' + langLabel;

  var subEl = document.createElement('div');
  subEl.style.cssText = 'font-size:.75rem;color:#888;margin-bottom:14px;';
  subEl.textContent = 'Tap ▶ Test to hear each voice. Tap a voice name to select it.';

  var LANG_KW = {
    'gu-IN':['gujarati','gu'], 'mr-IN':['marathi','mr'],
    'hi-IN':['hindi','lekha','hi'], 'ta-IN':['tamil','ta'],
    'te-IN':['telugu','te'], 'en-IN':['english','rishi','veena','en-in'],
  };
  var langCode = (LANGS[currentLang] || {}).code || 'en-IN';
  var kws = LANG_KW[langCode] || [];

  var langVoices = voices.filter(function(v) {
    return kws.some(function(k) {
      return v.name.toLowerCase().indexOf(k) > -1 || v.lang.toLowerCase().indexOf(k) > -1;
    });
  });
  var otherVoices = voices.filter(function(v){ return langVoices.indexOf(v) < 0; });

  function makeVoiceBtn(v, isLang) {
    var isSelected = currentOverride ? v.name === currentOverride : false;
    var row = document.createElement('div');
    row.style.cssText = (
      'display:flex;align-items:center;gap:10px;padding:10px 12px;' +
      'border:2px solid ' + (isSelected ? '#1565C0' : (isLang ? '#43A047' : '#E0E0E0')) + ';' +
      'border-radius:12px;margin-bottom:8px;background:' + (isSelected ? '#E3F2FD' : (isLang ? '#F1F8E9' : '#fff')) + ';' +
      'cursor:pointer;'
    );

    var info = document.createElement('div');
    info.style.cssText = 'flex:1;';
    info.innerHTML = (
      '<div style="font-size:.875rem;font-weight:800;">' + v.name +
      (isLang ? ' <span style="background:#43A047;color:#fff;font-size:.6rem;padding:2px 6px;border-radius:6px;">MATCH</span>' : '') +
      '</div>' +
      '<div style="font-size:.68rem;color:#888;">' + v.lang + '</div>'
    );

    var testBtn = document.createElement('button');
    testBtn.textContent = '▶ Test';
    testBtn.style.cssText = 'padding:6px 12px;background:#1565C0;color:#fff;border:none;border-radius:8px;font-size:.72rem;font-weight:800;cursor:pointer;font-family:inherit;';
    testBtn.onclick = function(e) {
      e.stopPropagation();
      speechSynth.cancel();
      var utter = new SpeechSynthesisUtterance('Hello! This is ' + v.name + '. Testing voice.');
      utter.voice = v; utter.lang = v.lang; utter.rate = 0.9;
      speechSynth.speak(utter);
    };

    row.onclick = function() {
      var ov2 = JSON.parse(localStorage.getItem('voiceOverrides') || '{}');
      ov2[currentLang] = v.name;
      localStorage.setItem('voiceOverrides', JSON.stringify(ov2));
      modal.remove();
      if (window._activeChild && window._activeStats) {
        setTimeout(function(){ toggleVoice(); }, 200);
      }
    };

    row.appendChild(info);
    row.appendChild(testBtn);
    return row;
  }

  var listEl = document.createElement('div');
  if (langVoices.length) {
    var hdr = document.createElement('div');
    hdr.style.cssText = 'font-size:.68rem;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:#43A047;margin-bottom:8px;';
    hdr.textContent = 'Voices matching ' + langLabel + ':';
    listEl.appendChild(hdr);
    langVoices.forEach(function(v){ listEl.appendChild(makeVoiceBtn(v, true)); });
  }
  if (otherVoices.length) {
    var hdr2 = document.createElement('div');
    hdr2.style.cssText = 'font-size:.68rem;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:#888;margin:12px 0 8px;';
    hdr2.textContent = 'All other voices:';
    listEl.appendChild(hdr2);
    otherVoices.forEach(function(v){ listEl.appendChild(makeVoiceBtn(v, false)); });
  }

  var closeBtn = document.createElement('button');
  closeBtn.textContent = 'Cancel';
  closeBtn.style.cssText = 'width:100%;padding:12px;background:#F5F5F5;border:none;border-radius:12px;font-family:inherit;font-size:.875rem;font-weight:800;cursor:pointer;margin-top:8px;';
  closeBtn.onclick = function(){ modal.remove(); };

  sheet.appendChild(titleEl);
  sheet.appendChild(subEl);
  sheet.appendChild(listEl);
  sheet.appendChild(closeBtn);
  modal.appendChild(sheet);
  modal.onclick = function(e){ if (e.target===modal) modal.remove(); };
  document.body.appendChild(modal);
}
