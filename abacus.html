<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>iMathAcademy — Virtual Abacus</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Baloo+2:wght@800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#1A1A2E;font-family:'Nunito',sans-serif;color:#fff;overflow:hidden;}
body{display:flex;flex-direction:column;}

.topbar{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;background:#111827;flex-shrink:0;}
.logo{font-family:'Baloo 2',sans-serif;font-size:1rem;font-weight:900;}
.logo em{color:#90CAF9;font-style:normal;}
.val-box{text-align:center;}
.val-lbl{font-size:.58rem;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.5px;font-weight:800;}
.val-num{font-family:'Baloo 2',sans-serif;font-size:1.5rem;font-weight:900;color:#FFD54F;min-width:90px;text-align:center;}
.icon-btns{display:flex;gap:6px;}
.ibtn{width:34px;height:34px;border-radius:8px;border:none;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;font-size:1rem;}

.rod-sel{display:flex;align-items:center;justify-content:center;gap:6px;padding:4px 14px;background:#111827;border-top:1px solid rgba(255,255,255,.06);flex-shrink:0;}
.rsl{font-size:.63rem;font-weight:800;color:rgba(255,255,255,.3);}
.rbtn{padding:3px 11px;border-radius:20px;border:1.5px solid rgba(255,255,255,.18);background:transparent;color:rgba(255,255,255,.4);font-family:inherit;font-size:.68rem;font-weight:800;cursor:pointer;}
.rbtn.on{background:#1565C0;border-color:#1565C0;color:#fff;}

.modes{display:flex;gap:6px;padding:4px 14px;background:#111827;border-top:1px solid rgba(255,255,255,.06);flex-shrink:0;}
.mbtn{flex:1;padding:6px 4px;border-radius:8px;border:1.5px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:rgba(255,255,255,.5);font-family:inherit;font-size:.68rem;font-weight:800;cursor:pointer;text-align:center;}
.mbtn.on{background:#1565C0;border-color:#1565C0;color:#fff;}

.qcard{margin:4px 12px;border-radius:9px;padding:7px 12px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.1);flex-shrink:0;display:none;}
.qcard.show{display:block;}
.qlbl{font-size:.56rem;font-weight:900;text-transform:uppercase;letter-spacing:.4px;color:rgba(255,255,255,.35);}
.qnum{font-family:'Baloo 2',sans-serif;font-size:1.2rem;font-weight:900;color:#FFD54F;}
.qfb{font-size:.73rem;font-weight:800;margin-top:3px;padding:3px 8px;border-radius:6px;display:none;}
.qfb.ok{background:rgba(46,125,50,.35);color:#81C784;display:block;}
.qfb.no{background:rgba(183,28,28,.35);color:#EF9A9A;display:block;}

.abacus-wrap{flex-shrink:0;padding:8px 10px;}
.frame{background:#4E342E;border-radius:12px;padding:6px;display:flex;flex-direction:column;border:3px solid #6D4C41;}
.top-bar,.bot-bar{height:8px;background:#3E2723;border-radius:4px;flex-shrink:0;}
.rods{display:flex;gap:2px;flex-shrink:0;position:relative;}
.div-bar{height:6px;background:#3E2723;flex-shrink:0;}
.rod{flex:1;position:relative;}
.rod-stick{position:absolute;left:50%;transform:translateX(-50%);width:3px;border-radius:2px;top:0;bottom:0;z-index:1;opacity:.5;}
.bead{position:absolute;left:50%;transform:translateX(-50%);border-radius:35%;cursor:pointer;z-index:3;transition:top .2s cubic-bezier(.4,0,.2,1);}
.bead::after{content:'';position:absolute;top:15%;left:18%;width:28%;height:22%;border-radius:50%;background:rgba(255,255,255,.45);pointer-events:none;}

.spacer{flex:1;}
.controls{display:flex;gap:8px;padding:6px 14px;background:#111827;border-top:1px solid rgba(255,255,255,.06);flex-shrink:0;}
.cbtn{flex:1;padding:9px 4px;border-radius:9px;border:1.5px solid rgba(255,255,255,.13);background:rgba(255,255,255,.07);color:#fff;font-family:inherit;font-size:.72rem;font-weight:800;cursor:pointer;text-align:center;}
.cbtn.p{background:#1565C0;border-color:#1565C0;}

.celeb{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:200;}
.celeb.show{display:flex;}
.celeb-box{background:#111827;border:2px solid #FFD54F;border-radius:18px;padding:24px 20px;text-align:center;max-width:260px;width:86%;}
.c-icon{font-size:2.8rem;margin-bottom:6px;}
.c-title{font-family:'Baloo 2',sans-serif;font-size:1.3rem;font-weight:900;color:#FFD54F;margin-bottom:4px;}
.c-sub{font-size:.8rem;color:rgba(255,255,255,.65);margin-bottom:12px;line-height:1.5;}
.c-btn{width:100%;padding:10px;background:#1565C0;color:#fff;border:none;border-radius:9px;font-family:inherit;font-size:.88rem;font-weight:900;cursor:pointer;}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">🧮 iMath<em>Academy</em></div>
  <div class="val-box">
    <div class="val-lbl">Value</div>
    <div class="val-num" id="vd">0</div>
  </div>
  <div class="icon-btns">
    <button class="ibtn" id="sndBtn" onclick="toggleSound()">🔊</button>
    <button class="ibtn" onclick="clearAll()">↺</button>
  </div>
</div>

<div class="rod-sel">
  <span class="rsl">Rods:</span>
  <button class="rbtn on" onclick="setRods(7,this)">7</button>
  <button class="rbtn" onclick="setRods(9,this)">9</button>
  <button class="rbtn" onclick="setRods(13,this)">13</button>
  <button class="rbtn" onclick="setRods(17,this)">17</button>
</div>

<div class="modes">
  <button class="mbtn on" onclick="setMode('free',this)">🎯 Free</button>
  <button class="mbtn" onclick="setMode('practice',this)">📝 Practice</button>
  <button class="mbtn" onclick="setMode('challenge',this)">⚡ Challenge</button>
</div>

<div class="qcard" id="qcard">
  <div class="qlbl" id="qlbl">Set this number</div>
  <div class="qnum" id="qnum">—</div>
  <div class="qfb" id="qfb"></div>
</div>

<div class="abacus-wrap" id="abWrap">
  <div class="frame">
    <div class="top-bar"></div>
    <div class="rods" id="hRods"></div>
    <div class="div-bar"></div>
    <div class="rods" id="eRods"></div>
    <div class="bot-bar"></div>
  </div>
</div>

<div class="spacer"></div>

<div class="controls">
  <button class="cbtn" id="randBtn" onclick="randomNum()">🎲 Random</button>
  <button class="cbtn p" id="chkBtn" style="display:none" onclick="checkAns()">✓ Check</button>
  <button class="cbtn" id="nxtBtn" style="display:none" onclick="nextQ()">Next →</button>
</div>

<div class="celeb" id="celeb">
  <div class="celeb-box">
    <div class="c-icon">🎉</div>
    <div class="c-title">Correct!</div>
    <div class="c-sub" id="cSub">Well done!</div>
    <button class="c-btn" onclick="nextQ()">Next question →</button>
  </div>
</div>

<script>
// ── COLOURS — ones=red(rightmost), cycling left ───────────────
var COLS = ['#E53935','#F57C00','#F9A825','#388E3C','#1976D2','#7B1FA2'];
var GRADS = [
  'radial-gradient(ellipse at 35% 28%,#FFCDD2,#E53935 60%,#B71C1C)',
  'radial-gradient(ellipse at 35% 28%,#FFE0B2,#F57C00 60%,#E65100)',
  'radial-gradient(ellipse at 35% 28%,#FFF9C4,#F9A825 60%,#F57F17)',
  'radial-gradient(ellipse at 35% 28%,#C8E6C9,#388E3C 60%,#1B5E20)',
  'radial-gradient(ellipse at 35% 28%,#BBDEFB,#1976D2 60%,#0D47A1)',
  'radial-gradient(ellipse at 35% 28%,#E1BEE7,#7B1FA2 60%,#4A148C)',
];

// ── STATE ─────────────────────────────────────────────────────
// state[i]: i=0=ones(rightmost), i=N-1=highest(leftmost)
// h: 0=inactive(top), 1=active(near divider)
// e: 0-4, count active earth beads (near divider=top of earth zone)
var N = 7;
var state = [];
var mode = 'free', soundOn = true, target = null;
var score = {c:0,t:0}, chalTimer = null, chalSec = 0, practIdx = 0;
var audioCtx = null;

// ── BEAD DIMENSIONS ───────────────────────────────────────────
var BW, BH, GAP = 3;

// Heaven positions (computed after BW/BH known)
var H_GAP = 6;
var H_H, H_REST, H_ACTIVE;

// Earth positions
var E_H, E_PAD = 4;

function calcDims() {
  var wrap = document.getElementById('abWrap');
  var availW = (wrap.offsetWidth || 320) - 32;
  BW = Math.min(30, Math.floor(availW / N) - 4);
  BW = Math.max(BW, 12);
  BH = Math.round(BW * 0.65);

  // Heaven
  H_H      = BH + H_GAP + BH + 8;
  H_REST   = 4;
  H_ACTIVE = 4 + BH + H_GAP;

  // Earth — same formula as working widget
  E_H = 4*(BH+GAP) - GAP + BH + GAP + 8;
}

function eActiveTop(bi) { return E_PAD + (bi-1)*(BH+GAP); }
function eRestTop(bi)   { return E_H - E_PAD - BH - (4-bi)*(BH+GAP); }
function eTop(bi, e)    { return bi<=e ? eActiveTop(bi) : eRestTop(bi); }

// ── AUDIO ─────────────────────────────────────────────────────
function getAudio(){if(!audioCtx)try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}return audioCtx;}
function beep(f){if(!soundOn)return;var ctx=getAudio();if(!ctx)return;var o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=f;g.gain.setValueAtTime(.07,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.07);o.start();o.stop(ctx.currentTime+.07);}
function playWin(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){beep(f);},i*90);});}

// ── STATE ─────────────────────────────────────────────────────
function initState(){state=[];for(var i=0;i<N;i++)state.push({h:0,e:0});}
function getVal(){var t=0;for(var i=0;i<N;i++)t+=(state[i].h*5+state[i].e)*Math.pow(10,i);return t;}

// ── BUILD ─────────────────────────────────────────────────────
function makeBead(ci, top) {
  var b = document.createElement('div');
  b.className = 'bead';
  b.style.width  = BW + 'px';
  b.style.height = BH + 'px';
  b.style.background = GRADS[ci % GRADS.length];
  b.style.border = '1.5px solid rgba(0,0,0,.25)';
  b.style.top = top + 'px';
  return b;
}

function makeStick(ci, h) {
  var s = document.createElement('div');
  s.className = 'rod-stick';
  s.style.background = COLS[ci % COLS.length];
  s.style.height = h + 'px';
  return s;
}

function build() {
  var hRow = document.getElementById('hRods');
  var eRow = document.getElementById('eRods');
  hRow.innerHTML = ''; eRow.innerHTML = '';
  hRow.style.height = H_H + 'px';
  eRow.style.height = E_H + 'px';

  // Visual order: vi=0=leftmost=highest, vi=N-1=rightmost=ones
  // So ci (colour) = by data index for consistent colour per place
  for (var vi = 0; vi < N; vi++) {
    var di = N - 1 - vi; // data index: 0=ones=rightmost visually
    var ci = di % COLS.length;

    // ── HEAVEN ROD ──────────────────────────────────────
    var hr = document.createElement('div');
    hr.className = 'rod'; hr.style.height = H_H + 'px';
    hr.appendChild(makeStick(ci, H_H));

    var hb = makeBead(ci, state[di].h ? H_ACTIVE : H_REST);
    hb.dataset.di = di;
    hb.addEventListener('click', function() {
      var d = +this.dataset.di;
      state[d].h = state[d].h ? 0 : 1;
      this.style.top = (state[d].h ? H_ACTIVE : H_REST) + 'px';
      beep(900); updateVal();
    });
    hb.addEventListener('touchend', function(e) {
      e.preventDefault();
      var d = +this.dataset.di;
      state[d].h = state[d].h ? 0 : 1;
      this.style.top = (state[d].h ? H_ACTIVE : H_REST) + 'px';
      beep(900); updateVal();
    });
    hr.appendChild(hb);
    hRow.appendChild(hr);

    // ── EARTH ROD ───────────────────────────────────────
    var er = document.createElement('div');
    er.className = 'rod'; er.style.height = E_H + 'px';
    er.appendChild(makeStick(ci, E_H));

    for (var bi = 1; bi <= 4; bi++) {
      var eb = makeBead(ci, eTop(bi, state[di].e));
      eb.dataset.di = di; eb.dataset.bi = bi;
      eb.addEventListener('click', (function(d, b) {
        return function() {
          state[d].e = (b <= state[d].e) ? b-1 : b;
          var all = document.querySelectorAll('#eRods .bead[data-di="'+d+'"]');
          for (var i=0;i<all.length;i++) {
            all[i].style.top = eTop(+all[i].dataset.bi, state[d].e) + 'px';
          }
          beep(650); updateVal();
        };
      })(di, bi));
      eb.addEventListener('touchend', (function(d, b) {
        return function(e) {
          e.preventDefault();
          state[d].e = (b <= state[d].e) ? b-1 : b;
          var all = document.querySelectorAll('#eRods .bead[data-di="'+d+'"]');
          for (var i=0;i<all.length;i++) {
            all[i].style.top = eTop(+all[i].dataset.bi, state[d].e) + 'px';
          }
          beep(650); updateVal();
        };
      })(di, bi));
      er.appendChild(eb);
    }
    eRow.appendChild(er);
  }
}

// ── DISPLAY ───────────────────────────────────────────────────
function updateVal() {
  var v = getVal();
  var el = document.getElementById('vd');
  el.textContent = v===0 ? '0' : v.toLocaleString('en-IN');
  el.style.color = v===0 ? 'rgba(255,255,255,.2)' : '#FFD54F';
}

function clearAll(silent) {
  initState(); build(); updateVal();
  if (!silent) document.getElementById('qfb').className = 'qfb';
}

function randomNum() {
  var mx = Math.pow(10,N)-1;
  setNum(Math.floor(Math.random()*mx)+1);
}

function setNum(n) {
  initState();
  var rem = Math.floor(n);
  for (var i=0;i<N;i++) {
    var dg = Math.floor(rem/Math.pow(10,i))%10;
    state[i].h = dg>=5?1:0;
    state[i].e = dg>=5?dg-5:dg;
  }
  build(); updateVal();
}

function toggleSound() {
  soundOn = !soundOn;
  document.getElementById('sndBtn').textContent = soundOn?'🔊':'🔇';
  getAudio();
}

function setRods(n,btn) {
  N=n;
  document.querySelectorAll('.rbtn').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  initState(); calcDims(); build(); updateVal();
}

// ── MODES ─────────────────────────────────────────────────────
function setMode(m,btn) {
  mode=m;
  document.querySelectorAll('.mbtn').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  var qc=document.getElementById('qcard');
  if (m==='free') {
    qc.classList.remove('show');
    document.getElementById('chkBtn').style.display='none';
    document.getElementById('nxtBtn').style.display='none';
    document.getElementById('randBtn').style.display='';
    if(chalTimer){clearInterval(chalTimer);chalTimer=null;}
  } else {
    qc.classList.add('show');
    document.getElementById('chkBtn').style.display='';
    document.getElementById('nxtBtn').style.display='none';
    document.getElementById('randBtn').style.display='none';
    score={c:0,t:0}; nextQ();
  }
  clearAll(true);
}

var PLIST=[3,5,7,8,9,12,23,45,67,89,123,456,789,999,1234,5678,9999,12345,56789];
function nextQ() {
  document.getElementById('celeb').classList.remove('show');
  document.getElementById('qfb').className='qfb';
  document.getElementById('chkBtn').style.display='';
  document.getElementById('nxtBtn').style.display='none';
  var mx=Math.pow(10,N)-1;
  if (mode==='practice') {
    var fl=PLIST.filter(function(x){return x<=mx;});
    target=fl[practIdx%fl.length]; practIdx++;
    document.getElementById('qlbl').textContent='Set this number on the abacus';
  } else {
    target=Math.floor(Math.random()*Math.min(mx,9999))+1;
    chalSec=0;
    if(chalTimer)clearInterval(chalTimer);
    chalTimer=setInterval(function(){chalSec++;document.getElementById('qlbl').textContent='⚡ Time: '+chalSec+'s';},1000);
    document.getElementById('qlbl').textContent='⚡ Time: 0s';
  }
  document.getElementById('qnum').textContent=(target||0).toLocaleString('en-IN');
  clearAll(true);
}

function checkAns() {
  var v=getVal(), fb=document.getElementById('qfb');
  if (v===target) {
    if(chalTimer){clearInterval(chalTimer);chalTimer=null;}
    score.c++;score.t++;playWin();
    document.getElementById('cSub').textContent=
      (target||0).toLocaleString('en-IN')+' — correct! '+
      (mode==='challenge'?'Time: '+chalSec+'s. ':'')+
      'Score: '+score.c+'/'+score.t;
    document.getElementById('celeb').classList.add('show');
    document.getElementById('chkBtn').style.display='none';
    document.getElementById('nxtBtn').style.display='';
  } else {
    score.t++;
    fb.textContent='✗ You set '+v.toLocaleString('en-IN')+' — answer is '+(target||0).toLocaleString('en-IN')+'. Try again!';
    fb.className='qfb no';
  }
}

// ── INIT ─────────────────────────────────────────────────────
initState();
setTimeout(function(){ calcDims(); build(); updateVal(); }, 50);
window.addEventListener('resize', function(){ calcDims(); build(); updateVal(); });
</script>
</body>
</html>
