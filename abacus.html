<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Abacus — iMathAcademy</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Baloo+2:wght@800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal/css/abacus.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #1A1A2E; color: #fff; font-family: 'Nunito', sans-serif; }
  body { display: flex; flex-direction: column; }

  .topbar { display: flex; align-items: center; justify-content: space-between;
            padding: 10px 14px; background: #111827; flex-shrink: 0; }
  .logo { font-family: 'Baloo 2', sans-serif; font-size: 1rem; font-weight: 900; }
  .logo em { color: #90CAF9; font-style: normal; }
  .icon-btns { display: flex; gap: 6px; }
  .ibtn { width: 34px; height: 34px; border: none; border-radius: 8px;
          background: rgba(255,255,255,.1); color: #fff; font-size: 1rem; cursor: pointer; }

  .modes { display: flex; gap: 6px; padding: 5px 14px; background: #111827;
           border-top: 1px solid rgba(255,255,255,.06); flex-shrink: 0; }
  .mbtn { flex: 1; padding: 6px 4px; border-radius: 8px; cursor: pointer;
          border: 1.5px solid rgba(255,255,255,.12); background: rgba(255,255,255,.05);
          color: rgba(255,255,255,.5); font-family: inherit; font-size: .68rem; font-weight: 800; }
  .mbtn.on { background: #1565C0; border-color: #1565C0; color: #fff; }

  .qcard { display: none; margin: 6px 12px; padding: 8px 12px; border-radius: 9px;
           background: rgba(255,255,255,.07); border: 1.5px solid rgba(255,255,255,.1); flex-shrink: 0; }
  .qcard.show { display: block; }
  .qlbl { font-size: .56rem; font-weight: 900; letter-spacing: .4px;
          text-transform: uppercase; color: rgba(255,255,255,.35); }
  .qnum { font-size: 1.2rem; font-weight: 900; color: #FFD54F; }
  .qfb { display: none; margin-top: 4px; padding: 4px 8px; border-radius: 6px;
         font-size: .73rem; font-weight: 800; }
  .qfb.ok { display: block; background: rgba(46,125,50,.35);  color: #81C784; }
  .qfb.no { display: block; background: rgba(183,28,28,.35); color: #EF9A9A; }

  .stage { padding: 8px 10px; flex-shrink: 0; }
  .spacer { flex: 1; }

  .controls { display: flex; gap: 8px; padding: 6px 14px; background: #111827;
              border-top: 1px solid rgba(255,255,255,.06); flex-shrink: 0; }
  .cbtn { flex: 1; padding: 9px 4px; border-radius: 9px; cursor: pointer;
          border: 1.5px solid rgba(255,255,255,.13); background: rgba(255,255,255,.07);
          color: #fff; font-family: inherit; font-size: .72rem; font-weight: 800; }
  .cbtn.primary { background: #1565C0; border-color: #1565C0; }

  .celeb { position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 200;
           display: none; align-items: center; justify-content: center; }
  .celeb.show { display: flex; }
  .celeb-box { background: #111827; border: 2px solid #FFD54F; border-radius: 18px;
               padding: 24px 20px; text-align: center; max-width: 260px; width: 86%; }
  .celeb-icon { font-size: 2.8rem; margin-bottom: 6px; }
  .celeb-title { font-family: 'Baloo 2', sans-serif; font-size: 1.3rem;
                 font-weight: 900; color: #FFD54F; margin-bottom: 4px; }
  .celeb-sub { font-size: .8rem; color: rgba(255,255,255,.65); margin-bottom: 12px; line-height: 1.5; }
  .celeb-btn { width: 100%; padding: 10px; border: none; border-radius: 9px;
               background: #1565C0; color: #fff; font-family: inherit;
               font-size: .88rem; font-weight: 900; cursor: pointer; }

  @media (orientation: landscape) and (max-height: 500px) {
    .topbar { padding: 4px 14px; }
    .modes  { padding: 2px 14px; }
    .stage  { padding: 4px 10px; }
    .controls { padding: 4px 14px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">🧮 iMath<em>Academy</em></div>
  <div class="icon-btns">
    <button class="ibtn" id="soundBtn" title="Sound">🔊</button>
    <button class="ibtn" id="clearBtn" title="Clear">↺</button>
  </div>
</div>

<div class="modes">
  <button class="mbtn on" data-mode="free">🎯 Free</button>
  <button class="mbtn"    data-mode="practice">📝 Practice</button>
  <button class="mbtn"    data-mode="challenge">⚡ Challenge</button>
</div>

<div class="qcard" id="qcard">
  <div class="qlbl" id="qlbl">Set this number</div>
  <div class="qnum" id="qnum">—</div>
  <div class="qfb"  id="qfb"></div>
</div>

<div class="stage" id="abacusSlot"></div>

<div class="spacer"></div>

<div class="controls">
  <button class="cbtn" id="randBtn">🎲 Random</button>
  <button class="cbtn primary" id="checkBtn" style="display:none">✓ Check</button>
  <button class="cbtn" id="nextBtn" style="display:none">Next →</button>
</div>

<div class="celeb" id="celeb">
  <div class="celeb-box">
    <div class="celeb-icon">🎉</div>
    <div class="celeb-title">Correct!</div>
    <div class="celeb-sub" id="celebSub">Well done!</div>
    <button class="celeb-btn" id="celebNext">Next question →</button>
  </div>
</div>

<script src="portal/js/abacus.js"></script>
<script>
(function () {
  var abacus = Abacus.mount(document.getElementById('abacusSlot'), { sound: true });

  var mode = 'free', target = null, score = { correct: 0, total: 0 };
  var timer = null, seconds = 0, practiceIndex = 0;
  var PRACTICE = [3, 5, 7, 8, 9, 12, 23, 45, 67, 89, 123, 456, 789, 999,
                  1234, 5678, 9999, 12345, 56789, 123456];

  var el = {
    qcard:  document.getElementById('qcard'),
    qlbl:   document.getElementById('qlbl'),
    qnum:   document.getElementById('qnum'),
    qfb:    document.getElementById('qfb'),
    rand:   document.getElementById('randBtn'),
    check:  document.getElementById('checkBtn'),
    next:   document.getElementById('nextBtn'),
    celeb:  document.getElementById('celeb'),
    celebSub: document.getElementById('celebSub')
  };

  function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

  function setMode(next, btn) {
    mode = next;
    var buttons = document.querySelectorAll('.mbtn');
    for (var i = 0; i < buttons.length; i++) buttons[i].classList.remove('on');
    btn.classList.add('on');

    if (mode === 'free') {
      el.qcard.classList.remove('show');
      el.check.style.display = 'none';
      el.next.style.display  = 'none';
      el.rand.style.display  = '';
      stopTimer();
      abacus.reset();
    } else {
      el.qcard.classList.add('show');
      el.check.style.display = '';
      el.next.style.display  = 'none';
      el.rand.style.display  = 'none';
      score = { correct: 0, total: 0 };
      nextQuestion();
    }
  }

  function nextQuestion() {
    el.celeb.classList.remove('show');
    el.qfb.className = 'qfb';
    el.check.style.display = '';
    el.next.style.display  = 'none';

    if (mode === 'practice') {
      target = PRACTICE[practiceIndex % PRACTICE.length];
      practiceIndex++;
      el.qlbl.textContent = 'Set this number on the abacus';
      stopTimer();
    } else {
      target = Math.floor(Math.random() * 99999) + 1;
      seconds = 0;
      stopTimer();
      el.qlbl.textContent = '⚡ Time: 0s';
      timer = setInterval(function () {
        seconds++;
        el.qlbl.textContent = '⚡ Time: ' + seconds + 's';
      }, 1000);
    }

    el.qnum.textContent = target.toLocaleString('en-IN');
    abacus.reset();
  }

  function checkAnswer() {
    var value = abacus.getValue();
    if (value === target) {
      stopTimer();
      score.correct++; score.total++;
      el.celebSub.textContent = target.toLocaleString('en-IN') + ' — correct! ' +
        (mode === 'challenge' ? 'Time: ' + seconds + 's. ' : '') +
        'Score: ' + score.correct + '/' + score.total;
      el.celeb.classList.add('show');
      el.check.style.display = 'none';
      el.next.style.display  = '';
    } else {
      score.total++;
      el.qfb.textContent = '✗ You set ' + value.toLocaleString('en-IN') +
        ' — the answer is ' + target.toLocaleString('en-IN') + '. Try again!';
      el.qfb.className = 'qfb no';
    }
  }

  var modeButtons = document.querySelectorAll('.mbtn');
  for (var i = 0; i < modeButtons.length; i++) {
    modeButtons[i].addEventListener('click', function () {
      setMode(this.dataset.mode, this);
    });
  }

  document.getElementById('clearBtn').addEventListener('click', function () {
    abacus.reset();
    el.qfb.className = 'qfb';
  });

  document.getElementById('soundBtn').addEventListener('click', function () {
    var on = !abacus.isSoundOn();
    abacus.setSound(on);
    this.textContent = on ? '🔊' : '🔇';
  });

  el.rand.addEventListener('click', function () {
    abacus.setValue(Math.floor(Math.random() * 99999999) + 1);
  });

  el.check.addEventListener('click', checkAnswer);
  el.next.addEventListener('click', nextQuestion);
  document.getElementById('celebNext').addEventListener('click', nextQuestion);
})();
</script>
</body>
</html>
