<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>iMathAcademy — Virtual Abacus</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Baloo+2:wght@800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#1A1A2E;font-family:'Nunito',sans-serif;color:#fff;overflow:hidden;}
body{display:flex;flex-direction:column;}
.topbar{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;background:#111827;flex-shrink:0;}
.logo{font-family:'Baloo 2',sans-serif;font-size:1rem;font-weight:900;}
.logo em{color:#90CAF9;font-style:normal;}
.val-box{text-align:center;}
.val-lbl{font-size:.58rem;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.5px;font-weight:800;}
.val-num{font-family:'Baloo 2',sans-serif;font-size:1.5rem;font-weight:900;color:#FFD54F;min-width:90px;text-align:center;}
.icon-btns{display:flex;gap:6px;}
.ibtn{width:34px;height:34px;border-radius:8px;border:none;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;font-size:1rem;}
.rod-sel{display:flex;align-items:center;justify-content:center;gap:6px;padding:4px 14px;background:#111827;border-top:1px solid rgba(255,255,255,.06);flex-shrink:0;}
.rsl{font-size:.63rem;font-weight:800;color:rgba(255,255,255,.3);}
.rbtn{padding:3px 11px;border-radius:20px;border:1.5px solid rgba(255,255,255,.18);background:transparent;color:rgba(255,255,255,.4);font-family:inherit;font-size:.68rem;font-weight:800;cursor:pointer;}
.rbtn.on{background:#1565C0;border-color:#1565C0;color:#fff;}
.modes{display:flex;gap:6px;padding:4px 14px;background:#111827;border-top:1px solid rgba(255,255,255,.06);flex-shrink:0;}
.mbtn{flex:1;padding:6px 4px;border-radius:8px;border:1.5px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:rgba(255,255,255,.5);font-family:inherit;font-size:.68rem;font-weight:800;cursor:pointer;text-align:center;}
.mbtn.on{background:#1565C0;border-color:#1565C0;color:#fff;}
.qcard{margin:4px 12px;border-radius:9px;padding:7px 12px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.1);flex-shrink:0;display:none;}
.qcard.show{display:block;}
.qlbl{font-size:.56rem;font-weight:900;text-transform:uppercase;letter-spacing:.4px;color:rgba(255,255,255,.35);}
.qnum{font-family:'Baloo 2',sans-serif;font-size:1.2rem;font-weight:900;color:#FFD54F;}
.qfb{font-size:.73rem;font-weight:800;margin-top:3px;padding:3px 8px;border-radius:6px;display:none;}
.qfb.ok{background:rgba(46,125,50,.35);color:#81C784;display:block;}
.qfb.no{background:rgba(183,28,28,.35);color:#EF9A9A;display:block;}
.abacus-wrap{flex-shrink:0;padding:6px 10px;}
.abacus-frame{border-radius:12px;background:#3E2723;border:3px solid #6D4C41;overflow:hidden;}
.ab-bar{height:8px;background:#5D4037;}
.ab-body{display:flex;position:relative;}
.ab-div{height:6px;background:#5D4037;position:relative;z-index:10;}
/* Each rod column */
.rod{flex:1;position:relative;}
.rod-stick{position:absolute;left:50%;transform:translateX(-50%);width:4px;border-radius:2px;top:0;bottom:0;z-index:1;}
/* Bead: absolutely positioned, slides via top transition */
.bead{
  position:absolute;left:50%;transform:translateX(-50%);
  border-radius:38%;z-index:5;cursor:pointer;
  transition:top .2s cubic-bezier(.4,0,.2,1);
  will-change:top;
}
.bead::after{content:'';position:absolute;top:14%;left:15%;width:28%;height:22%;border-radius:50%;background:rgba(255,255,255,.45);pointer-events:none;}
.spacer{flex:1;}
.controls{display:flex;gap:8px;padding:6px 14px;background:#111827;border-top:1px solid rgba(255,255,255,.06);flex-shrink:0;}
.cbtn{flex:1;padding:9px 4px;border-radius:9px;border:1.5px solid rgba(255,255,255,.13);background:rgba(255,255,255,.07);color:#fff;font-family:inherit;font-size:.72rem;font-weight:800;cursor:pointer;text-align:center;}
.cbtn.p{background:#1565C0;border-color:#1565C0;}
.celeb{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:200;}
.celeb.show{display:flex;}
.celeb-box{background:#111827;border:2px solid #FFD54F;border-radius:18px;padding:24px 20px;text-align:center;max-width:260px;width:86%;}
.c-icon{font-size:2.8rem;margin-bottom:6px;}
.c-title{font-family:'Baloo 2',sans-serif;font-size:1.3rem;font-weight:900;color:#FFD54F;margin-bottom:4px;}
.c-sub{font-size:.8rem;color:rgba(255,255,255,.65);margin-bottom:12px;line-height:1.5;}
.c-btn{width:100%;padding:10px;background:#1565C0;color:#fff;border:none;border-radius:9px;font-family:inherit;font-size:.88rem;font-weight:900;cursor:pointer;}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">🧮 iMath<em>Academy</em></div>
  <div class="val-box">
    <div class="val-lbl">Value</div>
    <div class="val-num" id="vd">0</div>
  </div>
  <div class="icon-btns">
    <button class="ibtn" id="sndBtn" onclick="toggleSound()">🔊</button>
    <button class="ibtn" onclick="clearAll()">↺</button>
  </div>
</div>
<div class="rod-sel">
  <span class="rsl">Rods:</span>
  <button class="rbtn on" onclick="setRods(7,this)">7</button>
  <button class="rbtn" onclick="setRods(9,this)">9</button>
  <button class="rbtn" onclick="setRods(13,this)">13</button>
  <button class="rbtn" onclick="setRods(17,this)">17</button>
</div>
<div class="modes">
  <button class="mbtn on" onclick="setMode('free',this)">🎯 Free</button>
  <button class="mbtn" onclick="setMode('practice',this)">📝 Practice</button>
  <button class="mbtn" onclick="setMode('challenge',this)">⚡ Challenge</button>
</div>
<div class="qcard" id="qcard">
  <div class="qlbl" id="qlbl">Set this number</div>
  <div class="qnum" id="qnum">—</div>
  <div class="qfb" id="qfb"></div>
</div>
<div class="abacus-wrap" id="abWrap">
  <div class="abacus-frame" id="abFrame">
    <div class="ab-bar"></div>
    <div class="ab-body" id="heavenBody"></div>
    <div class="ab-div"></div>
    <div class="ab-body" id="earthBody"></div>
    <div class="ab-bar"></div>
  </div>
</div>
<div class="spacer"></div>
<div class="controls">
  <button class="cbtn" id="randBtn" onclick="randomNum()">🎲 Random</button>
  <button class="cbtn p" id="chkBtn" style="display:none" onclick="checkAns()">✓ Check</button>
  <button class="cbtn" id="nxtBtn" style="display:none" onclick="nextQ()">Next →</button>
</div>
<div class="celeb" id="celeb">
  <div class="celeb-box">
    <div class="c-icon">🎉</div>
    <div class="c-title">Correct!</div>
    <div class="c-sub" id="cSub">Well done!</div>
    <button class="c-btn" onclick="nextQ()">Next question →</button>
  </div>
</div>

<script>
// ── COLOURS (rightmost=ones=first colour) ─────────────────────
var C = [
  {r:'#E53935', b:'radial-gradient(ellipse at 35% 28%,#FFCDD2,#E53935 58%,#B71C1C)', br:'#B71C1C', g:'rgba(229,57,53,.55)'},
  {r:'#F57C00', b:'radial-gradient(ellipse at 35% 28%,#FFE0B2,#F57C00 58%,#E65100)', br:'#E65100', g:'rgba(245,124,0,.55)'},
  {r:'#F9A825', b:'radial-gradient(ellipse at 35% 28%,#FFF9C4,#F9A825 58%,#F57F17)', br:'#F57F17', g:'rgba(249,168,37,.55)'},
  {r:'#388E3C', b:'radial-gradient(ellipse at 35% 28%,#C8E6C9,#388E3C 58%,#1B5E20)', br:'#1B5E20', g:'rgba(56,142,60,.55)'},
  {r:'#1976D2', b:'radial-gradient(ellipse at 35% 28%,#BBDEFB,#1976D2 58%,#0D47A1)', br:'#0D47A1', g:'rgba(25,118,210,.55)'},
  {r:'#7B1FA2', b:'radial-gradient(ellipse at 35% 28%,#E1BEE7,#7B1FA2 58%,#4A148C)', br:'#4A148C', g:'rgba(123,31,162,.55)'},
];

// ── STATE ─────────────────────────────────────────────────────
// state[i]: i=0 = ONES (rightmost), i=N-1 = highest (leftmost)
// h: 0=inactive(bead at top of heaven), 1=active(bead slid down to divider)
// e: 0-4, count of active earth beads (slid UP toward divider)
var N = 7;
var state = [];
var mode = 'free', soundOn = true, target = null;
var score = {c:0,t:0}, chalTimer = null, chalSec = 0, practIdx = 0;
var audioCtx = null;

// ── DIMENSIONS (global, computed once) ────────────────────────
var BW = 28;  // bead width
var BH = 18;  // bead height (oval)
var PAD = 5;  // padding inside each zone
var HGAP = 6; // gap between heaven bead and ghost slot
var EGAP = 4; // gap between earth beads

// Heaven zone has 2 positions: pos0 (top, resting) and pos1 (bottom, active/near divider)
// Earth zone has 5 positions: pos0 (empty gap, just below divider) and pos1-4 (bead positions)
// Beads rest at pos4,3,2,1 from bottom and slide to pos1,2,3,4 from top when active

var H_HEIGHT, E_HEIGHT; // computed

function calcDims() {
  var wrap = document.getElementById('abWrap');
  var availW = (wrap.offsetWidth || 320) - 26;
  BW = Math.min(30, Math.floor(availW / N) - 4);
  BW = Math.max(BW, 12);
  BH = Math.round(BW * 0.62);
  H_HEIGHT = PAD + BH + HGAP + BH + PAD; // top_pad + bead + gap + bead + bot_pad
  E_HEIGHT = PAD*2 + 9*(BH+EGAP); // 1 empty + 4 active + 4 resting slots
}

// ── POSITION HELPERS (global scope) ───────────────────────────
// Heaven: top position of bead
// inactive = top slot (pos0), active = bottom slot (pos1, near divider)
function heavenPos(active) {
  if (active) return PAD + BH + HGAP; // pos1: near divider
  return PAD; // pos0: top (resting)
}

// Earth: top position of bead bi (1-4) given active count e
// Bead bi is ACTIVE if bi <= e → position near top (pos bi)
// Bead bi is INACTIVE if bi > e → position near bottom (resting)
//
// Active positions (near divider = top of earth zone):
//   slot 0 = empty gap = PAD
//   slot 1 = PAD + BH + EGAP
//   slot 2 = PAD + 2*(BH + EGAP)
//   ...
//   slot bi = PAD + bi*(BH + EGAP)
//
// Resting positions (bottom of earth zone):
//   4 beads stacked from bottom:
//   bead 4 = E_HEIGHT - PAD - BH
//   bead 3 = E_HEIGHT - PAD - 2*(BH+EGAP)
//   bead 2 = E_HEIGHT - PAD - 3*(BH+EGAP)
//   bead 1 = E_HEIGHT - PAD - 4*(BH+EGAP)
//
function earthActivePos(bi) {
  return PAD + bi * (BH + EGAP); // slot bi (slot 0 is empty)
}
function earthRestPos(bi) {
  return E_HEIGHT - PAD - BH - (4 - bi) * (BH + EGAP);
}
function earthPos(bi, e) {
  return (bi <= e) ? earthActivePos(bi) : earthRestPos(bi);
}

// ── AUDIO ─────────────────────────────────────────────────────
function getAudio() {
  if (!audioCtx) try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  return audioCtx;
}
function beep(f) {
  if (!soundOn) return;
  var ctx = getAudio(); if (!ctx) return;
  var o = ctx.createOscillator(), g = ctx.createGain();
  o.connect(g); g.connect(ctx.destination);
  o.frequency.value = f;
  g.gain.setValueAtTime(.07, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .07);
  o.start(); o.stop(ctx.currentTime + .07);
}
function playWin() {
  [523,659,784,1047].forEach(function(f,i) { setTimeout(function() { beep(f); }, i*90); });
}

// ── STATE INIT ────────────────────────────────────────────────
function initState() {
  state = [];
  for (var i = 0; i < N; i++) state.push({h:0, e:0});
}
function getVal() {
  var t = 0;
  for (var i = 0; i < N; i++) t += (state[i].h * 5 + state[i].e) * Math.pow(10, i);
  return t;
}

// ── BUILD DOM ─────────────────────────────────────────────────
function build() {
  var hBody = document.getElementById('heavenBody');
  var eBody = document.getElementById('earthBody');
  hBody.innerHTML = '';
  eBody.innerHTML = '';
  hBody.style.height = H_HEIGHT + 'px';
  eBody.style.height = E_HEIGHT + 'px';

  // Visual order: vi=0 = leftmost = highest place value
  // data index di = N-1-vi (so di=0=ones is rightmost)
  for (var vi = 0; vi < N; vi++) {
    var di = N - 1 - vi;
    var ci = (N - 1 - vi) % C.length; // colour by data index so ones=red always
    buildHeavenRod(hBody, di, ci);
    buildEarthRod(eBody, di, ci);
  }
}

function makeStick(ci, h) {
  var s = document.createElement('div');
  s.className = 'rod-stick';
  s.style.background = C[ci].r;
  s.style.height = h + 'px';
  return s;
}

function makeBead(ci) {
  var b = document.createElement('div');
  b.className = 'bead';
  b.style.width = BW + 'px';
  b.style.height = BH + 'px';
  b.style.background = C[ci].b;
  b.style.border = '1.5px solid ' + C[ci].br;
  b.style.boxShadow = '0 2px 8px ' + C[ci].g;
  return b;
}

function buildHeavenRod(container, di, ci) {
  var rod = document.createElement('div');
  rod.className = 'rod';
  rod.style.height = H_HEIGHT + 'px';
  rod.appendChild(makeStick(ci, H_HEIGHT));

  var bead = makeBead(ci);
  bead.style.top = heavenPos(state[di].h) + 'px';
  bead.dataset.di = di;

  bead.addEventListener('click', function(e) {
    e.stopPropagation();
    var d = parseInt(this.dataset.di);
    state[d].h = state[d].h ? 0 : 1;
    this.style.top = heavenPos(state[d].h) + 'px';
    beep(900); updateVal();
  });
  bead.addEventListener('touchend', function(e) {
    e.preventDefault(); e.stopPropagation();
    var d = parseInt(this.dataset.di);
    state[d].h = state[d].h ? 0 : 1;
    this.style.top = heavenPos(state[d].h) + 'px';
    beep(900); updateVal();
  });

  rod.appendChild(bead);
  container.appendChild(rod);
}

function buildEarthRod(container, di, ci) {
  var rod = document.createElement('div');
  rod.className = 'rod';
  rod.style.height = E_HEIGHT + 'px';
  rod.appendChild(makeStick(ci, E_HEIGHT));

  // Create 4 earth beads (bi = 1..4)
  for (var bi = 1; bi <= 4; bi++) {
    var bead = makeBead(ci);
    bead.dataset.di = di;
    bead.dataset.bi = bi;
    bead.style.top = earthPos(bi, state[di].e) + 'px';

    // Click handler — uses dataset not closure vars so always reads current state
    bead.addEventListener('click', handleEarthClick);
    bead.addEventListener('touchend', handleEarthTouch);

    rod.appendChild(bead);
  }

  container.appendChild(rod);
}

// Earth bead handler — same pattern as heaven: query by data attributes
function handleEarthClick(e) {
  e.stopPropagation();
  toggleEarth(parseInt(this.dataset.di), parseInt(this.dataset.bi));
}
function handleEarthTouch(e) {
  e.preventDefault(); e.stopPropagation();
  toggleEarth(parseInt(this.dataset.di), parseInt(this.dataset.bi));
}

function toggleEarth(di, bi) {
  if (bi <= state[di].e) {
    state[di].e = bi - 1;
  } else {
    state[di].e = bi;
  }
  // Update ALL earth beads on this rod by querying data attributes
  // This is identical in approach to how heaven bead updates itself
  var allEarthBeads = document.querySelectorAll('#earthBody .bead[data-di="' + di + '"]');
  allEarthBeads.forEach(function(beadEl) {
    var b = parseInt(beadEl.dataset.bi);
    beadEl.style.top = earthPos(b, state[di].e) + 'px';
  });
  beep(650);
  updateVal();
}

// Keep refreshEarthRod for clearAll/setNum — also use querySelectorAll
function refreshEarthRod(di) {
  var allEarthBeads = document.querySelectorAll('#earthBody .bead[data-di="' + di + '"]');
  allEarthBeads.forEach(function(beadEl) {
    var b = parseInt(beadEl.dataset.bi);
    beadEl.style.top = earthPos(b, state[di].e) + 'px';
  });
}

function refreshHeavenRod(di) {
  var vi = N - 1 - di;
  var hBody = document.getElementById('heavenBody');
  var rod = hBody.children[vi];
  if (!rod) return;
  // rod.children[0]=stick, rod.children[1]=bead
  var beadEl = rod.children[1];
  if (beadEl) beadEl.style.top = heavenPos(state[di].h) + 'px';
}

// ── DISPLAY ───────────────────────────────────────────────────
function updateVal() {
  var v = getVal();
  var el = document.getElementById('vd');
  el.textContent = v === 0 ? '0' : v.toLocaleString('en-IN');
  el.style.color = v === 0 ? 'rgba(255,255,255,.2)' : '#FFD54F';
}

function clearAll(silent) {
  initState();
  for (var di = 0; di < N; di++) {
    refreshHeavenRod(di);
    refreshEarthRod(di);
  }
  updateVal();
  if (!silent) document.getElementById('qfb').className = 'qfb';
}

function randomNum() {
  var mx = Math.pow(10, N) - 1;
  setNum(Math.floor(Math.random() * mx) + 1);
}

function setNum(n) {
  initState();
  var rem = Math.floor(n);
  for (var di = 0; di < N; di++) {
    var dg = Math.floor(rem / Math.pow(10, di)) % 10;
    state[di].h = dg >= 5 ? 1 : 0;
    state[di].e = dg >= 5 ? dg - 5 : dg;
  }
  for (var di = 0; di < N; di++) {
    refreshHeavenRod(di);
    refreshEarthRod(di);
  }
  updateVal();
}

function toggleSound() {
  soundOn = !soundOn;
  document.getElementById('sndBtn').textContent = soundOn ? '🔊' : '🔇';
  getAudio();
}

function setRods(n, btn) {
  N = n;
  document.querySelectorAll('.rbtn').forEach(function(b) { b.classList.remove('on'); });
  btn.classList.add('on');
  initState(); calcDims(); build(); updateVal();
}

// ── MODES ─────────────────────────────────────────────────────
function setMode(m, btn) {
  mode = m;
  document.querySelectorAll('.mbtn').forEach(function(b) { b.classList.remove('on'); });
  btn.classList.add('on');
  var qc = document.getElementById('qcard');
  if (m === 'free') {
    qc.classList.remove('show');
    document.getElementById('chkBtn').style.display = 'none';
    document.getElementById('nxtBtn').style.display = 'none';
    document.getElementById('randBtn').style.display = '';
    if (chalTimer) { clearInterval(chalTimer); chalTimer = null; }
  } else {
    qc.classList.add('show');
    document.getElementById('chkBtn').style.display = '';
    document.getElementById('nxtBtn').style.display = 'none';
    document.getElementById('randBtn').style.display = 'none';
    score = {c:0,t:0}; nextQ();
  }
  clearAll(true);
}

var PLIST = [3,5,7,8,9,12,23,45,67,89,123,456,789,999,1234,5678,9999,12345];
function nextQ() {
  document.getElementById('celeb').classList.remove('show');
  document.getElementById('qfb').className = 'qfb';
  document.getElementById('chkBtn').style.display = '';
  document.getElementById('nxtBtn').style.display = 'none';
  var mx = Math.pow(10, N) - 1;
  if (mode === 'practice') {
    var fl = PLIST.filter(function(x) { return x <= mx; });
    target = fl[practIdx % fl.length]; practIdx++;
    document.getElementById('qlbl').textContent = 'Set this number on the abacus';
  } else {
    target = Math.floor(Math.random() * Math.min(mx, 9999)) + 1;
    chalSec = 0;
    if (chalTimer) clearInterval(chalTimer);
    chalTimer = setInterval(function() {
      chalSec++;
      document.getElementById('qlbl').textContent = '⚡ Time: ' + chalSec + 's';
    }, 1000);
    document.getElementById('qlbl').textContent = '⚡ Time: 0s';
  }
  document.getElementById('qnum').textContent = (target||0).toLocaleString('en-IN');
  clearAll(true);
}

function checkAns() {
  var v = getVal(), fb = document.getElementById('qfb');
  if (v === target) {
    if (chalTimer) { clearInterval(chalTimer); chalTimer = null; }
    score.c++; score.t++; playWin();
    document.getElementById('cSub').textContent =
      (target||0).toLocaleString('en-IN') + ' — correct! ' +
      (mode === 'challenge' ? 'Time: ' + chalSec + 's. ' : '') +
      'Score: ' + score.c + '/' + score.t;
    document.getElementById('celeb').classList.add('show');
    document.getElementById('chkBtn').style.display = 'none';
    document.getElementById('nxtBtn').style.display = '';
  } else {
    score.t++;
    fb.textContent = '✗ You set ' + v.toLocaleString('en-IN') +
      ' — answer is ' + (target||0).toLocaleString('en-IN') + '. Try again!';
    fb.className = 'qfb no';
  }
}

// ── INIT ─────────────────────────────────────────────────────
initState();
setTimeout(function() { calcDims(); build(); updateVal(); }, 50);
window.addEventListener('resize', function() { calcDims(); build(); updateVal(); });
</script>
</body>
</html>
